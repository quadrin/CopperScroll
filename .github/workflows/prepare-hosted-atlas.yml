name: Prepare hosted atlas source
on:
  push:
    branches: [atlas-hosted-sync-20261124]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            atlas
            text
            research/shared_tools
      - name: Export current atlas application and map assets
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/app.tgz" HEAD atlas/app atlas/components atlas/lib atlas/pages atlas/hooks atlas/registration atlas/scripts atlas/text
          git archive --format=tar.gz -o "$RUNNER_TEMP/public.tgz" HEAD atlas/public
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-atlas-app
          path: ${{ runner.temp }}/app.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-atlas-public
          path: ${{ runner.temp }}/public.tgz
          retention-days: 1
