<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 46 (X 5–7) — the reservoir in Beth ha-Kerem</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan drawn from the entrance, not north up: the text gives no compass bearing. One arrangement the text allows.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Text shown: on the left as you go in; the ten cubits taken as depth</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">A large built reservoir · אשיח with one entrance. “On its left” is the left hand of someone entering.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">The cubits are drawn as depth (Milik's rule); Lefkovits reads a distance (right). Q19 is open.</text>
<rect x="54.0" y="782.0" width="181.6" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="795.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project text · depth reading</text>
