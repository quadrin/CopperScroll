<text x="638.0" y="396.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 638.0 396.0)"></text>
<text x="660.0" y="400.0" font-size="11.5" fill="#8e2e22" font-weight="700">10 cubits ≈ 5 m</text>
<text x="632.0" y="490.0" font-size="11.5" fill="#8e2e22" font-weight="700">silver, 62 talents</text>
<text x="540.0" y="576.0" font-size="10.5" fill="#8d8780">Measured here from the reservoir floor (assumed);</text>
<text x="540.0" y="591.0" font-size="10.5" fill="#8d8780">1 cubit taken as about 0.5 m.</text>
<text x="528.0" y="632.0" font-size="12.5" fill="#2a2420" font-weight="700">Reading the words</text>
<text x="528.0" y="652.0" font-size="11.5" fill="#5a524a">All editions read the place name and the</text>
<text x="528.0" y="667.2" font-size="11.5" fill="#5a524a">reservoir word the same way; the dispute is</text>
<text x="528.0" y="682.4" font-size="11.5" fill="#5a524a">the site (footer) and the unit after “left”</text>
<text x="528.0" y="697.5" font-size="11.5" fill="#5a524a">(right).</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Lefkovits: the ten cubits are a distance</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Lefkovits (p. 161) takes the cubits after “left” as a distance;</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">Milik (C158/C160) as a depth. The files leave it open (Q19).</text>
<rect x="904.0" y="302.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
