<text x="987.5" y="266.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(360.0 987.5 266.0)"></text>
<text x="1154.0" y="214.0" font-size="11.5" fill="#8e2e22" font-weight="700">10 cubits ≈ 5 m along the</text>
<text x="1154.0" y="228.4" font-size="11.5" fill="#8e2e22">left from the entrance</text>
<text x="1154.0" y="242.8" font-size="11.5" fill="#8e2e22">(direction drawn: one choice)</text>
<text x="1154.0" y="276.0" font-size="11.5" fill="#5a524a">no digging depth given</text>
<rect x="890.0" y="340.0" width="470.0" height="240.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Where is the entrance? Not stated</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">“On its left” turns with the entrance, which the text does not</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">place. The same words give a different corner each time.</text>
<rect x="904.0" y="552.0" width="63.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="565.0" font-size="10.5" fill="#5f574e" font-weight="600">Same text</text>
<rect x="933.0" y="438.0" width="80.0" height="64.0" fill="#dcebf4" stroke="#245b82" stroke-width="1.6"/>
