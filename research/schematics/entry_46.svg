<text x="94.0" y="257.0" font-size="12" fill="#2a2420">the place; its extent is not given</text>
<rect x="153.0" y="341.0" width="260.0" height="235.0" fill="#dcebf4" stroke="#245b82" stroke-width="2.2"/>
<rect x="155.0" y="343.0" width="128.0" height="231.0" fill="#f1e2c6" stroke="none" stroke-width="1.0" fill-opacity="0.8"/>
