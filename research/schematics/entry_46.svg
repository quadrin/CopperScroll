<text x="103.0" y="315.0" font-size="12" fill="#245b82" font-weight="700">reservoir · אשיח</text>
<text x="103.0" y="330.0" font-size="12" fill="#245b82">large and built, not a household cistern (Milik C70)</text>
<text x="167.0" y="367.0" font-size="12" fill="#8a5a17" font-weight="700">on its left · לסמולו</text>
