<text x="167.0" y="500.8" font-size="11.5" fill="#8e2e22">dig 10 cubits</text>
<text x="167.0" y="515.1" font-size="11.5" fill="#8e2e22">≈ 5 m</text>
<text x="496.0" y="756.0" font-size="10.5" fill="#8d8780" text-anchor="end">Not to scale. Size of the reservoir not given.</text>
