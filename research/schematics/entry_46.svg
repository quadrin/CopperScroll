<text x="904.0" y="614.0" font-size="14" fill="#2a2420" font-weight="700">Cubits or feet? (Q15)</text>
<text x="904.0" y="634.0" font-size="11.5" fill="#5a524a">Puech, Lefkovits: ten cubits. Milik 1962: “ten feet” · רגמות</text>
<text x="904.0" y="650.0" font-size="11.5" fill="#5a524a">(twelve feet in 1960). Wolters: notches. Milik's unit is unattested.</text>
<rect x="904.0" y="782.0" width="150.6" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#7a2f22" font-weight="600">Not adopted · unit open</text>
<rect x="918.0" y="680.0" width="140.0" height="8.0" fill="#b33a2a" stroke="none" stroke-width="1.0" fill-opacity="0.8"/>
<text x="1068.0" y="688.0" font-size="11.5" fill="#8e2e22" font-weight="600">10 cubits ≈ 5 m (text shown)</text>
<rect x="918.0" y="706.0" width="140.0" height="8.0" fill="none" stroke="#8d8780" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="1068.0" y="714.0" font-size="11.5" fill="#5a524a">10 feet: length of the unit not recorded</text>
<text x="918.0" y="742.0" font-size="11" fill="#5a524a">The plates show a gimel-like first letter: a cursive alef (Puech) or</text>
<text x="918.0" y="756.5" font-size="11" fill="#5a524a">gimel; they cannot decide the unit (plate_check.md).</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (X 5–7)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the reservoir that is in Beth ha-Kerem, as you go in, on its left, dig ten cubits: silver,</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">sixty-two talents.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">One large built reservoir (Milik C70) with one entrance, side not given. The deposit is just inside</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">on the left; the ten cubits are drawn as depth below its floor.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Best-supported, low (lowered from medium): Ramat Raḥel (Kh. Ṣaliḥ), Aharoni's Beth ha-Kerem, followed</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">by Milik (“plausibly”) and Lefkovits. Conder (SWP III p. 20) proposed ʿAin Karim.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">phase5_assessments.csv: Ramat Raḥel's large plastered pools belong to an earlier phase, buried under</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">fill with 2nd-c. BCE pottery; no report shows a large reservoir in use in the scroll's period.</text>
</svg>
