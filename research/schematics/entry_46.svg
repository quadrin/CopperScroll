<text x="70.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">PLAN</text>
<text x="114.0" y="198.0" font-size="11" fill="#8d8780" font-style="italic">entrance drawn at the bottom; no bearing given</text>
<rect x="76.0" y="216.0" width="414.0" height="520.0" fill="#f4efe6" stroke="#7d7264" stroke-width="1.2" rx="26" stroke-dasharray="7 5"/>
