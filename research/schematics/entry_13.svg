 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 13 (III 8–10) — the Millo pit</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site. The text gives no size, distance or depth.</text>
<rect x="40.0" y="100.0" width="830.0" height="695.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: the pit on the north side of ha-Melaḥ, taken as the Esplanade</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">ha-Melaḥ · מלח drawn as a walled platform with fill (Milik 1962; Puech 2006: the Millo, the Esplanade).</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">“The western corner” drawn as the north-west one, nearest the pit; the text says only “western”.</text>
<rect x="54.0" y="767.0" width="212.6" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="780.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading (atlas placement)</text>
<rect x="150.0" y="250.0" width="420.0" height="150.0" fill="#c98a2e" stroke="none" stroke-width="1.0" fill-opacity="0.16"/>
<rect x="150.0" y="250.0" width="420.0" height="410.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<path d="M150.0,250.0 L570.0,250.0 L570.0,660.0 L150.0,660.0 L150.0,250.0" fill="none" stroke="#7d7264" stroke-width="12" stroke-linejoin="miter"/>
<line x1="156.0" y1="400.0" x2="564.0" y2="400.0" stroke="#8a5a17" stroke-width="1" stroke-dasharray="4 4"/>
<text x="554.0" y="388.0" font-size="12" fill="#8a5a17" font-weight="700" text-anchor="end">north side · בצפונו</text>
<text x="360.0" y="520.0" font-size="13" fill="#2a2420" font-weight="700" text-anchor="middle">ha-Melaḥ · מלח</text>
<text x="360.0" y="536.2" font-size="13" fill="#2a2420" text-anchor="middle">retaining walls and fill</text>
<text x="360.0" y="682.0" font-size="11" fill="#8d8780" text-anchor="middle" font-style="italic">size and shape not given</text>
<path d="M154.0,254.0 L210.0,290.0 L302.0,324.0" fill="none" stroke="#c98a2e" stroke-width="10" stroke-linejoin="round" opacity="0.25"/>
<path d="M154.0,254.0 L210.0,290.0 L302.0,324.0" fill="none" stroke="#8a5a17" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="5 3"/>
<circle cx="320.0" cy="328.0" r="17.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<path d="M318,326 L330,338 M330,326 L318,338" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="350.0" y="322.0" font-size="12.5" fill="#2a2420" font-weight="700">pit · שית</text>
<text x="350.0" y="340.0" font-size="11.5" fill="#8e2e22" font-weight="600">vessels of offering, garments</text>
<text x="350.0" y="354.4" font-size="11.5" fill="#8e2e22">no depth given</text>
<line x1="106.0" y1="220.0" x2="144.0" y2="246.0" stroke="#8a5a17" stroke-width="1.4" marker-end="url(#ah-ochre)"/>
<text x="120.0" y="192.0" font-size="12" fill="#8a5a17" font-weight="700">its entrance · ביאתא, under the western corner · הפנא המערבית</text>
<text x="190.0" y="314.0" font-size="10.5" fill="#8a5a17" font-style="italic" transform="rotate(33 190.0 314.0)">way in</text>
<path d="M820,214 L828,246 L820,240 L812,246 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="820.0" y="208.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="615.0" y="340.0" font-size="13" fill="#2a2420" font-weight="700">Key</text>
<path d="M618.0,358.0 L636.0,358.0" fill="none" stroke="#7d7264" stroke-width="8" stroke-linejoin="miter"/>
<text x="645.0" y="362.0" font-size="11.5" fill="#5a524a">retaining wall</text>
<rect x="618.0" y="378.0" width="18.0" height="12.0" fill="url(#earth)" stroke="#a49a8b" stroke-width="0.6"/>
<text x="645.0" y="388.0" font-size="11.5" fill="#5a524a">fill</text>
<rect x="618.0" y="404.0" width="18.0" height="12.0" fill="#c98a2e" stroke="none" stroke-width="1.0" fill-opacity="0.25"/>
<text x="645.0" y="414.0" font-size="11.5" fill="#5a524a">“its north side”</text>
<circle cx="627.0" cy="436.0" r="6.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<text x="645.0" y="440.0" font-size="11.5" fill="#5a524a">pit · שית</text>
<path d="M617.0,462.0 L637.0,462.0" fill="none" stroke="#c98a2e" stroke-width="10" stroke-linejoin="round" opacity="0.25"/>
<path d="M617.0,462.0 L637.0,462.0" fill="none" stroke="#8a5a17" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="5 3"/>
<text x="645.0" y="466.0" font-size="11.5" fill="#5a524a">way in, course not given</text>
<path d="M622,483 L632,493 M632,483 L622,493" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="645.0" y="492.0" font-size="11.5" fill="#5a524a">deposit</text>
<text x="615.0" y="530.0" font-size="11" fill="#8d8780">Where the passage runs, and how</text>
<text x="615.0" y="543.8" font-size="11" fill="#8d8780">far the pit lies from the corner,</text>
<text x="615.0" y="557.5" font-size="11" fill="#8d8780">are not given; drawn for clarity.</text>
<rect x="890.0" y="100.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Lefkovits: “its north” is the pit’s own north</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">The suffix of בצפונו is masculine: “in the north section</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">of the deep pit” (leads_on_old_plans, §1).</text>
<rect x="904.0" y="297.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="310.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<circle cx="980.0" cy="230.5" r="52.0" fill="#e9dfcf" stroke="#8a5a17" stroke-width="1.6"/>
<path d="M928,230.5 A52,52 0 0,1 1032,230.5 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.25"/>
<line x1="928.0" y1="230.5" x2="1032.0" y2="230.5" stroke="#8a5a17" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M975,199.5 L985,209.5 M985,199.5 L975,209.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="980.0" y="260.5" font-size="10.5" fill="#5a524a" text-anchor="middle">pit</text>
<text x="1062.0" y="192.0" font-size="11.5" fill="#5a524a">The deposit is in the pit’s north part.</text>
<text x="1062.0" y="206.4" font-size="11.5" fill="#5a524a">Where the pit lies in ha-Melaḥ</text>
<text x="1062.0" y="220.8" font-size="11.5" fill="#5a524a">is then not given.</text>
<rect x="890.0" y="335.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="359.0" font-size="14" fill="#2a2420" font-weight="700">ha-Melaḥ as a named place</text>
<text x="904.0" y="379.0" font-size="11.5" fill="#5a524a">Lefkovits 2000 (conditional): the City of Salt, near Secacah.</text>
<text x="904.0" y="395.0" font-size="11.5" fill="#5a524a">Research notes: a place in the Jericho district.</text>
<rect x="904.0" y="532.0" width="156.8" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="545.0" font-size="10.5" fill="#7a2f22" font-weight="600">Not adopted in the atlas</text>
<path d="M968.0,473.5 L928.0,433.5 A56.5,56.5 0 0,1 1008.0,433.5 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.14"/>
<circle cx="968.0" cy="473.5" r="56.5" fill="none" stroke="#6f6a64" stroke-width="1.3"/>
<line x1="968.0" y1="473.5" x2="1008.0" y2="433.5" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="473.5" x2="1008.0" y2="513.5" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="473.5" x2="928.0" y2="513.5" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="473.5" x2="928.0" y2="433.5" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<path transform="translate(968.0,473.5) scale(0.800)" d="M-14,-6 C-15,-14 -5,-17 3,-16 C11,-15 16,-9 15,-1 C16,8 10,15 1,15 C-8,16 -16,10 -15,3 C-17,0 -14,-3 -14,-6 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.75"/>
<circle cx="968.0" cy="473.5" r="1.8" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<circle cx="968.0" cy="438.5" r="6.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<path d="M973,428.47 L981,436.47 M981,428.47 L973,436.47" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="968.0" y="499.5" font-size="10.5" fill="#2a2420" font-weight="700" text-anchor="middle">ha-Melaḥ</text>
<text x="1054.5" y="427.0" font-size="11.5" fill="#5a524a">The pit lies north of a site. Kh. Qumran</text>
<text x="1054.5" y="441.4" font-size="11.5" fill="#5a524a">and ʿAin el-Ghuweir are the candidates</text>
<text x="1054.5" y="455.8" font-size="11.5" fill="#5a524a">named; both untested for this pit.</text>
<text x="1054.5" y="470.1" font-size="11.5" fill="#5a524a">“The western corner” is then a corner</text>
<text x="1054.5" y="484.5" font-size="11.5" fill="#5a524a">of the site or a building, not given.</text>
<rect x="890.0" y="570.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="594.0" font-size="14" fill="#2a2420" font-weight="700">Readings that leave the plan as it is</text>
<text x="904.0" y="614.0" font-size="11.5" fill="#5a524a">Contents and word meanings only.</text>
<rect x="904.0" y="767.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="780.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="906.0" y="640.0" font-size="11.5" fill="#5a524a">•</text>
<text x="918.0" y="640.0" font-size="11.5" fill="#5a524a">garments: Puech; “my garments”: Wolters; resin of Aleppo</text>
<text x="918.0" y="655.5" font-size="11.5" fill="#5a524a">pine: Milik.</text>
<text x="906.0" y="675.0" font-size="11.5" fill="#5a524a">•</text>
<text x="918.0" y="675.0" font-size="11.5" fill="#5a524a">pit · שית and entrance · ביאתא are rated medium in the</text>
<text x="918.0" y="690.5" font-size="11.5" fill="#5a524a">lexicon; no editor reads them otherwise.</text>
<text x="906.0" y="710.0" font-size="11.5" fill="#5a524a">•</text>
<text x="918.0" y="710.0" font-size="11.5" fill="#5a524a">Puech 2002 reads “salt”: the setting is then left open.</text>
<text x="906.0" y="729.5" font-size="11.5" fill="#5a524a">•</text>
<text x="918.0" y="729.5" font-size="11.5" fill="#5a524a">Sums and depth: none given in the text.</text>
<rect x="40.0" y="815.0" width="1320.0" height="169.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Text (III 8–10)</text>
<text x="60.0" y="858.0" font-size="11.5" fill="#5a524a">“In the pit that is in ha-Melaḥ, on its north side: vessels of offering, garments. Its entrance is</text>
<text x="60.0" y="873.2" font-size="11.5" fill="#5a524a">under the western corner.”</text>
<text x="60.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.4" font-size="11.5" fill="#5a524a">ha-Melaḥ read as the Esplanade: retaining walls and fill (Milik; Puech 2006). “On its north side” is</text>
<text x="60.0" y="928.5" font-size="11.5" fill="#5a524a">taken as the platform’s north side and “the western corner” as its north-west corner. No size,</text>
<text x="60.0" y="943.7" font-size="11.5" fill="#5a524a">distance or depth is given; the way in is drawn only to link the corner to the pit.</text>
<text x="700.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="858.0" font-size="11.5" fill="#5a524a">Atlas: possible only, low. Candidate: Temple enclosure (Temple Mount), possible, low. Research notes</text>
<text x="700.0" y="873.2" font-size="11.5" fill="#5a524a">read ha-Melaḥ as a place name (deeper_analysis §2.1); the atlas is unchanged.</text>
<text x="700.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="913.4" font-size="11.5" fill="#5a524a">phase5_assessments.csv (JER, entries 3–14): the platform’s retaining walls and fill are reported</text>
<text x="700.0" y="928.5" font-size="11.5" fill="#5a524a">(Shukron &amp; Reich 2011; Warren 1871); the reading of מלה or מלח decides the place, so the entry stays</text>
<text x="700.0" y="943.7" font-size="11.5" fill="#5a524a">possible, low. leads_on_old_plans §3: the pit is untested at Kh. Qumran and ʿAin el-Ghuweir.</text>
</svg>
