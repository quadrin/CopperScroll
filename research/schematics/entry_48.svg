<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
<title>Copper Scroll entry 48: Absalom's monument</title>
<defs>
 <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2420"/></marker>
 <marker id="ah-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a17"/></marker>
 <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#245b82"/></marker>
 <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e2e22"/></marker>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#efe3cf"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a5a17" stroke-width="1.2"/></pattern>
 <pattern id="rockfill" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e7dfd0"/><circle cx="2" cy="2" r="0.8" fill="#a49a8b"/><circle cx="6" cy="6" r="0.6" fill="#a49a8b"/></pattern>
 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 48 (X 12–14) — Absalom's monument</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">All editions: under the monument, on its west side, dig twelve cubits</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">A free-standing monument · יד אבשלום. The deposit lies under its west side; “dig twelve”</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">is drawn as depth, 12 cubits ≈ 6 m. Size and form of the monument are not given.</text>
<rect x="54.0" y="782.0" width="101.0" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="795.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading</text>
<rect x="58.0" y="176.0" width="400.0" height="590.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="70.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">PLAN</text>
<path d="M258.0,446.0 L151.9,552.1 A150,150 0 0,1 151.9,339.9 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.14"/>
<circle cx="258.0" cy="446.0" r="150.0" fill="none" stroke="#6f6a64" stroke-width="1.3"/>
<line x1="258.0" y1="446.0" x2="364.1" y2="339.9" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="258.0" y1="446.0" x2="364.1" y2="552.1" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="258.0" y1="446.0" x2="151.9" y2="552.1" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="258.0" y1="446.0" x2="151.9" y2="339.9" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="221.0" y="409.0" width="74.0" height="74.0" fill="#e9dfcc" stroke="#2a2420" stroke-width="1.8"/>
<circle cx="258.0" cy="446.0" r="16.3" fill="none" stroke="#2a2420" stroke-width="1.2"/>
<text x="258.0" y="622.0" font-size="12" fill="#2a2420" font-weight="700" text-anchor="middle">Absalom's monument · יד</text>
<text x="258.0" y="637.0" font-size="12" fill="#2a2420" text-anchor="middle">free-standing; size not given</text>
<path d="M214.0,439 L228.0,453 M228.0,439 L214.0,453" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="214.0" y1="440.0" x2="128.0" y2="274.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="74.0" y="240.0" font-size="11.5" fill="#8e2e22" font-weight="700">80 talents, under the</text>
<text x="74.0" y="254.4" font-size="11.5" fill="#8e2e22">west side; dig 12 cubits</text>
<text x="124.0" y="486.0" font-size="12" fill="#8a5a17" font-weight="700">WEST side</text>
<path d="M428,210 L436,242 L428,236 L420,242 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="428.0" y="204.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="70.0" y="736.0" font-size="10.5" fill="#8d8780">The section at right is cut west–east</text>
<text x="70.0" y="752.0" font-size="10.5" fill="#8d8780">through the monument. Not to scale in plan.</text>
<rect x="478.0" y="176.0" width="374.0" height="470.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="490.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">SECTION · “under … dig twelve cubits”</text>
<text x="490.0" y="214.0" font-size="10.5" fill="#8d8780" font-style="italic">looking north; west at left</text>
<rect x="479.0" y="366.0" width="372.0" height="234.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="479.0" y1="366.0" x2="851.0" y2="366.0" stroke="#a49a8b" stroke-width="1.6"/>
<text x="490.0" y="358.0" font-size="10.5" fill="#8d8780" font-style="italic">ground</text>
<text x="492.0" y="240.0" font-size="13" fill="#8a5a17" font-weight="700">W</text>
<text x="828.0" y="240.0" font-size="13" fill="#5a524a" font-weight="700">E</text>
<rect x="615.0" y="286.0" width="140.0" height="80.0" fill="#e9dfcc" stroke="#2a2420" stroke-width="1.6"/>
<path d="M609.0,286 L685.0,240 L761.0,286 Z" fill="#e9dfcc" stroke="#2a2420" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="685.0" y="336.0" font-size="11" fill="#2a2420" font-weight="600" text-anchor="middle">monument</text>
<text x="685.0" y="350.0" font-size="10" fill="#8d8780" text-anchor="middle">height, form not given</text>
<rect x="615.0" y="366.0" width="140.0" height="10.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="0.8"/>
<line x1="627.0" y1="376.0" x2="627.0" y2="522.0" stroke="#8e2e22" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M620.0,515 L634.0,529 M634.0,515 L620.0,529" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="593.0" y1="366.0" x2="593.0" y2="522.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="598.0" y1="366.0" x2="588.0" y2="366.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="598.0" y1="522.0" x2="588.0" y2="522.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="583.0" y="444.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 583.0 444.0)"></text>
<text x="583.0" y="444.0" font-size="11.5" fill="#8e2e22" font-weight="700" text-anchor="end">12 cubits</text>
<text x="583.0" y="458.4" font-size="11.5" fill="#8e2e22" text-anchor="end">≈ 6 m</text>
<text x="643.0" y="526.0" font-size="11.5" fill="#8e2e22" font-weight="700">80 talents</text>
<text x="490.0" y="618.0" font-size="10.5" fill="#8d8780">Measured here from the ground at the west side (assumed).</text>
<text x="490.0" y="633.0" font-size="10.5" fill="#8d8780">1 cubit taken as about 0.5 m; depth to scale, monument not.</text>
<text x="478.0" y="672.0" font-size="12.5" fill="#2a2420" font-weight="700">Reading the words</text>
<text x="478.0" y="692.0" font-size="11.5" fill="#5a524a">The name and “west side” are read the same way in all</text>
<text x="478.0" y="707.2" font-size="11.5" fill="#5a524a">editions. יד is a monument (2 Sam 18:18: “Absalom's</text>
<text x="478.0" y="722.4" font-size="11.5" fill="#5a524a">monument”, in the King's Valley).</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Lefkovits: יד as “place”</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Lefkovits notes that יד can mean “place”: “the Place of</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">Absalom” (Targum), pp. 348–349. Then no structure is required.</text>
<rect x="904.0" y="302.0" width="113.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative sense</text>
<rect x="938.0" y="184.0" width="200.0" height="96.0" fill="url(#earth)" stroke="#7d7264" stroke-width="1.2" rx="14" stroke-dasharray="6 4"/>
<rect x="939.0" y="185.0" width="99.0" height="94.0" fill="#c98a2e" stroke="none" stroke-width="1.0" fill-opacity="0.14"/>
<text x="1046.0" y="236.0" font-size="11" fill="#2a2420" font-weight="600">the Place</text>
<path d="M963,227.0 L973,237.0 M973,227.0 L963,237.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1154.0" y="210.0" font-size="11.5" fill="#5a524a">an area, extent not given;</text>
<text x="1154.0" y="224.4" font-size="11.5" fill="#5a524a">deposit under its west part,</text>
<text x="1154.0" y="238.8" font-size="11.5" fill="#5a524a">dig 12 cubits</text>
<rect x="890.0" y="340.0" width="470.0" height="210.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Cubits or feet? (Q15)</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Puech, Lefkovits: twelve cubits. Milik 1960: twelve “feet”</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">(italicised as uncertain); Milik 1962: רגמות, feet.</text>
<rect x="904.0" y="522.0" width="150.6" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="535.0" font-size="10.5" fill="#7a2f22" font-weight="600">Not adopted · unit open</text>
<rect x="918.0" y="426.0" width="144.0" height="8.0" fill="#b33a2a" stroke="none" stroke-width="1.0" fill-opacity="0.8"/>
<text x="1072.0" y="434.0" font-size="11.5" fill="#8e2e22" font-weight="600">12 cubits ≈ 6 m (text shown)</text>
<rect x="918.0" y="452.0" width="144.0" height="8.0" fill="none" stroke="#8d8780" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="1072.0" y="460.0" font-size="11.5" fill="#5a524a">12 feet: length of the unit not recorded</text>
<text x="918.0" y="488.0" font-size="11" fill="#5a524a">Plate check: no ר before the gimel-like letter at X 13, so Milik's</text>
<text x="918.0" y="502.5" font-size="11" fill="#5a524a">רגמות is not seen; the unit stays open.</text>
<rect x="890.0" y="560.0" width="470.0" height="250.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="584.0" font-size="14" fill="#2a2420" font-weight="700">Which side of Jerusalem? (Q18)</text>
<text x="904.0" y="604.0" font-size="11.5" fill="#5a524a">The plan is the same; the setting moves. Generic sketch, not a map.</text>
<rect x="904.0" y="782.0" width="156.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the setting only</text>
<rect x="958.0" y="649.0" width="100.0" height="80.0" fill="#eeeae4" stroke="#8d8780" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1008.0" y="693.0" font-size="11" fill="#5a524a" text-anchor="middle" font-style="italic">the city</text>
<rect x="923.0" y="738.0" width="14.0" height="14.0" fill="#e9dfcc" stroke="#2a2420" stroke-width="1.8"/>
<circle cx="930.0" cy="745.0" r="3.1" fill="none" stroke="#2a2420" stroke-width="1.2"/>
<text x="946.0" y="749.0" font-size="11" fill="#2a2420" font-weight="700">SW</text>
<rect x="1079.0" y="722.0" width="14.0" height="14.0" fill="#e9dfcc" stroke="#2a2420" stroke-width="1.8"/>
<circle cx="1086.0" cy="729.0" r="3.1" fill="none" stroke="#2a2420" stroke-width="1.2"/>
<text x="1100.0" y="733.0" font-size="11" fill="#2a2420" font-weight="700">E / SE</text>
<path d="M920,628 L928,660 L920,654 L912,660 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="920.0" y="622.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="1134.0" y="632.0" font-size="11" fill="#5a524a">SW: Milik, the Hand of Absalom in</text>
<text x="1134.0" y="646.5" font-size="11" fill="#5a524a">the SW necropolis (Baqʿah).</text>
<text x="1134.0" y="665.0" font-size="11" fill="#5a524a">E/SE: Puech (in the Kidron below</text>
<text x="1134.0" y="679.6" font-size="11" fill="#5a524a">Siloam) and Høgenhaven (Kidron).</text>
<text x="1134.0" y="698.1" font-size="11" fill="#5a524a">The standing Kidron monument was</text>
<text x="1134.0" y="712.6" font-size="11" fill="#5a524a">first labelled Zacharias.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (X 12–14)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“Under Absalom's monument, on the west side, dig twelve cubits: 80 talents.”</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">One free-standing monument with a west side. The deposit lies under that side, twelve cubits ≈ 6 m</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">below the ground there. Size, form and height of the monument are not given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Best-supported, low: the Kidron valley at the Kidron monuments (Absalom, Bene Ḥezir, Zechariah); the</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">placement rests on the order of the entries. Milik put it in the SW necropolis (Q18).</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">phase5_assessments.csv: the Kidron monument is 1st-c. CE by style, but its earliest labels (4th c.)</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">name Zacharias; Josephus knew a stele of Absalom two stades from the city. No source shows the name</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">in the 1st century.</text>
</svg>
