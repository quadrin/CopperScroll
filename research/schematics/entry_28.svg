<text x="779.0" y="449.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(-90.0 779.0 449.0)">nine cubits ≈ 4.5 m?</text>
<text x="654.0" y="642.0" font-size="12" fill="#8e2e22" font-weight="700">22 talents (a lost figure</text>
<text x="654.0" y="657.0" font-size="12" fill="#8e2e22">may precede it)</text>
<text x="654.0" y="688.0" font-size="11" fill="#8d8780">Part of VII 1 is lost before</text>
<text x="654.0" y="701.8" font-size="11" fill="#8d8780">“nine”; depth taken from the</text>
<text x="654.0" y="715.5" font-size="11" fill="#8d8780">base of the cairn.</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: a bridge, not a ford</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Allegro and Lefkovits read “bridge”; Schiffman</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">“bridge or passageway”. Milik, Puech: a ford.</text>
<rect x="904.0" y="302.0" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Allegro, Lefkovits · not followed</text>
<path d="M962.0,174.0 L974.0,235.0 L964.0,288.0" fill="none" stroke="#245b82" stroke-width="30" stroke-linejoin="round"/>
