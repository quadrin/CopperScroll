<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 28 (VI 14–VII 2) — the cairn at the ford of the High Priest</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: a cairn at a ford, dig […] nine cubits</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives no direction or distance, only “at the ford”; bank and side are not given.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">River drawn north–south (the Jordan for Milik and Puech); cairn on the west bank by the path.</text>
