<rect x="950.0" y="488.0" width="40.0" height="18.0" fill="#e9f1f6" stroke="#245b82" stroke-width="0.8" rx="8" stroke-dasharray="3 2"/>
<circle cx="950.0" cy="493.0" r="2.6" fill="#7d7264" stroke="none" stroke-width="1.0"/>
