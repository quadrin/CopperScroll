<path d="M912,213.0 L920,221.0 M920,213.0 L912,221.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1048.0" y="188.0" font-size="11.5" fill="#5a524a">A bridge is a built structure; the cairn</text>
<text x="1048.0" y="202.4" font-size="11.5" fill="#5a524a">would stand at it. Puech: “certainly</text>
<text x="1048.0" y="216.8" font-size="11.5" fill="#5a524a">denoting a ford (not a bridge, as</text>
<text x="1048.0" y="231.1" font-size="11.5" fill="#5a524a">Allegro thinks)”.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Variant: a dam, not a cairn (Eshel)</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Eshel 2002: יגר “possibly a dam”, though he says he does</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">not understand the description.</text>
<rect x="904.0" y="542.0" width="156.8" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#7a2f22" font-weight="600">Eshel 2002 · not adopted</text>
