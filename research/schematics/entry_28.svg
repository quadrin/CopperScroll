<text x="80.0" y="477.0" font-size="12" fill="#3f3226">a heap of stones</text>
<text x="80.0" y="650.0" font-size="11" fill="#8d8780">West bank and the path's north side</text>
<text x="80.0" y="663.8" font-size="11" fill="#8d8780">are drawing choices, not given.</text>
