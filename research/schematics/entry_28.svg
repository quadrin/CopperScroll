<path d="M965,449.0 L973,457.0 M973,449.0 L965,457.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1048.0" y="428.0" font-size="11.5" fill="#5a524a">Puech finds it “difficult to imagine a ford</text>
<text x="1048.0" y="442.4" font-size="11.5" fill="#5a524a">and a dam side by side”. The research</text>
<text x="1048.0" y="456.8" font-size="11.5" fill="#5a524a">files follow the cairn reading.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<rect x="904.0" y="782.0" width="94.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Plan unchanged</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Sum: 22 (Milik); “[20+20(+20?)]+22” (Puech);</text>
<text x="904.0" y="638.4" font-size="11.5" fill="#5a524a">no figure read (Lefkovits). The files do not choose.</text>
<text x="904.0" y="652.8" font-size="11.5" fill="#5a524a">Ford · מגזה: Milik places it at the Jordan; Puech too.</text>
<text x="904.0" y="667.1" font-size="11.5" fill="#5a524a">High Priest: elsewhere a title, not a place name;</text>
<text x="904.0" y="681.5" font-size="11.5" fill="#5a524a">Milik cites the Jordan crossing of Joshua 3–4.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (VI 14–VII 2)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the cairn that is at the ford of the High Priest, dig [… cubits] nine: […] 22 talents.”</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">A cairn (a heap of stones) beside the path where it crosses the river. The bank, the side of the path</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">and any direction are not given. The depth is drawn as nine cubits, with the line damaged before it.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Best-supported, low (atlas): the lower Jordan near Jericho, a ford at river level only (area about 10</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">km); no particular ford is identified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">SWP (p. 170) records five fords of the lower Jordan near Jericho, one called ancient; no source</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">reports a cairn or heap at a ford, and none gives archaeology for any ford (phase5_assessments.csv).</text>
</svg>
