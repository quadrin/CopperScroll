<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
<title>Copper Scroll entry 12a: the adjoining corner</title>
<defs>
 <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2420"/></marker>
 <marker id="ah-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a17"/></marker>
 <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#245b82"/></marker>
 <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e2e22"/></marker>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#efe3cf"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a5a17" stroke-width="1.2"/></pattern>
 <pattern id="rockfill" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e7dfd0"/><circle cx="2" cy="2" r="0.8" fill="#a49a8b"/><circle cx="6" cy="6" r="0.6" fill="#a49a8b"/></pattern>
 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 12a (III 5–7) — the adjoining corner</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up, with a section at the corner. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="695.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: under the other corner of the same court, the eastern one</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">Same court as entry 12, square to the compass; its size and name are not given.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">“The eastern one” drawn as the south-east corner, beside 12’s south-west one.</text>
<rect x="54.0" y="767.0" width="101.0" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="780.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading</text>
<rect x="130.0" y="220.0" width="340.0" height="350.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M130.0,220.0 L470.0,220.0 L470.0,570.0 L130.0,570.0 L130.0,220.0" fill="none" stroke="#7d7264" stroke-width="8" stroke-linejoin="miter"/>
<text x="300.0" y="385.0" font-size="13" fill="#2a2420" font-weight="700" text-anchor="middle">court · חצר</text>
<text x="300.0" y="401.2" font-size="13" fill="#2a2420" text-anchor="middle">the court of entry 12</text>
<text x="300.0" y="554.0" font-size="11" fill="#8d8780" text-anchor="middle" font-style="italic">south side</text>
<text x="454.0" y="395.0" font-size="11" fill="#8d8780" text-anchor="middle" font-style="italic" transform="rotate(90 454.0 395.0)">east side</text>
<path d="M86,204 L94,236 L86,230 L78,236 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="86.0" y="198.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<path d="M448,548 L460,560 M460,548 L448,560" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<circle cx="470.0" cy="570.0" r="16.0" fill="none" stroke="#b33a2a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="490.0" y="604.0" font-size="12" fill="#2a2420" font-weight="700" text-anchor="end">the other corner, the eastern one</text>
<text x="490.0" y="619.0" font-size="12" fill="#2a2420" text-anchor="end">corner · הפנא האחרת המזרחית</text>
<text x="490.0" y="638.0" font-size="11.5" fill="#8e2e22" font-weight="600" text-anchor="end">under it, dig 16 cubits ≈ 8 m:</text>
<text x="490.0" y="652.4" font-size="11.5" fill="#8e2e22" text-anchor="end">silver, 40 talents; then ΤΡ</text>
<path d="M141,549 L151,559 M151,549 L141,559" fill="none" stroke="#8d8780" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="130.0" cy="570.0" r="16.0" fill="none" stroke="#8d8780" stroke-width="1" stroke-dasharray="3 3"/>
<text x="110.0" y="604.0" font-size="11" fill="#8d8780">entry 12: the south</text>
<text x="110.0" y="617.8" font-size="11" fill="#8d8780">corner (own sheet)</text>
<text x="60.0" y="749.0" font-size="11" fill="#8d8780">Court size and proportions are arbitrary; only the section is to scale.</text>
<rect x="540.0" y="200.0" width="310.0" height="550.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="1" rx="4"/>
<text x="552.0" y="222.0" font-size="12.5" fill="#2a2420" font-weight="700">Section at the eastern corner</text>
<text x="552.0" y="238.0" font-size="11" fill="#8d8780">depth to scale; 1 cubit ≈ 0.5 m</text>
<rect x="541.0" y="320.0" width="308.0" height="360.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="541.0" y1="320.0" x2="849.0" y2="320.0" stroke="#2a2420" stroke-width="1.4"/>
<text x="552.0" y="312.0" font-size="11" fill="#5a524a" font-style="italic">court floor</text>
<rect x="648.2" y="268.0" width="44.0" height="52.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.4"/>
<text x="670.2" y="260.0" font-size="11" fill="#2a2420" font-weight="600" text-anchor="middle">the corner</text>
<rect x="656.2" y="320.0" width="28.0" height="320.0" fill="#fbf6ee" stroke="#8e2e22" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M664.2,626 L676.2,638 M676.2,626 L664.2,638" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="630.2" y="664.0" font-size="11" fill="#8e2e22" font-weight="600">silver, 40 talents</text>
<line x1="716.2" y1="320.0" x2="716.2" y2="640.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="721.2" y1="320.0" x2="711.2" y2="320.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="721.2" y1="640.0" x2="711.2" y2="640.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="706.2" y="480.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 706.2 480.0)"></text>
<text x="726.2" y="476.0" font-size="11.5" fill="#8e2e22" font-weight="700">dig 16 cubits</text>
<text x="726.2" y="490.4" font-size="11.5" fill="#8e2e22">≈ 8 m</text>
<rect x="552.0" y="716.0" width="40.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="592.0" y="716.0" width="40.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="552.0" y="736.0" font-size="11" fill="#2a2420">0</text>
<text x="632.0" y="736.0" font-size="11" fill="#2a2420" text-anchor="middle">2 m</text>
<rect x="890.0" y="100.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">One hiding place or two?</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Puech (p. 173 n. 26) and Milik: a separate entry. Lefkovits: one</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">item with III 1–4 (p. 142). Høgenhaven: disputed (pp. 161–162).</text>
<rect x="904.0" y="297.0" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="310.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the count, not the plan</text>
<rect x="918.0" y="178.0" width="110.0" height="97.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M918.0,178.0 L1028.0,178.0 L1028.0,275.0 L918.0,275.0 L918.0,178.0" fill="none" stroke="#7d7264" stroke-width="5" stroke-linejoin="miter"/>
<path d="M924,259.0 L934,269.0 M934,259.0 L924,269.0" fill="none" stroke="#8d8780" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M1012,259.0 L1022,269.0 M1022,259.0 L1012,269.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1058.0" y="198.0" font-size="11.5" fill="#5a524a">All agree it is a second corner of the</text>
<text x="1058.0" y="212.4" font-size="11.5" fill="#5a524a">same court. Split or not, the deposit</text>
<text x="1058.0" y="226.8" font-size="11.5" fill="#5a524a">stays under the eastern corner;</text>
<text x="1058.0" y="241.1" font-size="11.5" fill="#5a524a">only the number of entries changes.</text>
<rect x="890.0" y="335.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="359.0" font-size="14" fill="#2a2420" font-weight="700">ΤΡ or ΤΡΙ? The letters after the sum</text>
<text x="904.0" y="379.0" font-size="11.5" fill="#5a524a">ΤΡ: Puech, Milik, Ullendorff. ΤΡΙ: Allegro, McCarter (early),</text>
<text x="904.0" y="395.0" font-size="11.5" fill="#5a524a">the Baker drawing. Lefkovits: ΤΡ or ΤΡΙ.</text>
<rect x="904.0" y="532.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="545.0" font-size="10.5" fill="#5f574e" font-weight="600">Not a plan question</text>
<text x="922.0" y="467.5" font-size="34" fill="#2a2420" font-weight="700">Τ Ρ</text>
<rect x="988.0" y="437.5" width="4.0" height="34.0" fill="#8d8780" stroke="none" stroke-width="1.0"/>
<text x="990.0" y="489.5" font-size="13" fill="#8d8780" font-weight="700" text-anchor="middle">?</text>
<text x="1042.0" y="433.5" font-size="11.5" fill="#5a524a">The plate check found a third stroke</text>
<text x="1042.0" y="447.9" font-size="11.5" fill="#5a524a">after the Ρ, longer than a letter;</text>
<text x="1042.0" y="462.2" font-size="11.5" fill="#5a524a">whether it is an Ι is open (Q27).</text>
<text x="1042.0" y="476.6" font-size="11.5" fill="#5a524a">The files reject Ullendorff’s</text>
<text x="1042.0" y="491.0" font-size="11.5" fill="#5a524a">400-read-as-40 numeral rule.</text>
<rect x="890.0" y="570.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="594.0" font-size="14" fill="#2a2420" font-weight="700">Milik: the eastern corner of the peribolos</text>
<text x="904.0" y="614.0" font-size="11.5" fill="#5a524a">If the court is the whole enclosure, this is one of its corners.</text>
<text x="904.0" y="630.0" font-size="11.5" fill="#5a524a">Atlas: its SE corner, or the Kidron slope just below it.</text>
<rect x="904.0" y="767.0" width="324.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="780.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading · candidate setting (schematic)</text>
<rect x="1015.0" y="656.0" width="40.0" height="101.0" fill="url(#rockfill)" stroke="none" stroke-width="1.0" fill-opacity="0.8"/>
<rect x="918.0" y="646.0" width="99.0" height="99.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M918.0,646.0 L1017.0,646.0 L1017.0,745.0 L918.0,745.0 L918.0,646.0" fill="none" stroke="#7d7264" stroke-width="6" stroke-linejoin="miter"/>
<path d="M1000.0,728.0 L1010.0,738.0 M1010.0,728.0 L1000.0,738.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="967.5" y="699.5" font-size="10.5" fill="#8d8780" text-anchor="middle">enclosure</text>
<text x="1071.0" y="664.0" font-size="11.5" fill="#5a524a">Slope east of the wall: dotted.</text>
<text x="1071.0" y="678.4" font-size="11.5" fill="#5a524a">Generic square, not the plan of</text>
<text x="1071.0" y="692.8" font-size="11.5" fill="#5a524a">the Temple Mount. Size not given</text>
<text x="1071.0" y="707.1" font-size="11.5" fill="#5a524a">in the records.</text>
<rect x="40.0" y="815.0" width="1320.0" height="169.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Text (III 5–7)</text>
<text x="60.0" y="858.0" font-size="11.5" fill="#5a524a">“Under the other corner, the eastern one, dig sixteen cubits: silver, 40 talents.” ΤΡ.</text>
<text x="60.0" y="881.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="898.2" font-size="11.5" fill="#5a524a">The same walled court as entry 12, square to the compass, north up. “The other corner, the eastern</text>
<text x="60.0" y="913.4" font-size="11.5" fill="#5a524a">one” is drawn as the south-east corner, next to 12’s south-west one; the text fixes neither, nor the</text>
<text x="60.0" y="928.5" font-size="11.5" fill="#5a524a">court’s size. The sixteen cubits are read as a digging depth under the corner.</text>
<text x="700.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="858.0" font-size="11.5" fill="#5a524a">Atlas: possible only, low. Candidates: SE corner of the Temple enclosure (Solomon’s Stables),</text>
<text x="700.0" y="873.2" font-size="11.5" fill="#5a524a">possible, low, at the corner itself or on the Kidron slope below it; Temple enclosure (Temple Mount),</text>
<text x="700.0" y="888.4" font-size="11.5" fill="#5a524a">possible, low. The scroll’s corner has not been identified.</text>
<text x="700.0" y="911.5" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.5" font-size="11.5" fill="#5a524a">phase5_reports.csv: Warren (1871 pp. 135–159) describes the enclosure’s east wall and its south-east</text>
<text x="700.0" y="943.7" font-size="11.5" fill="#5a524a">angle; phase5_assessments.csv keeps entries 3–14 possible, low, because the court’s name is restored</text>
<text x="700.0" y="958.9" font-size="11.5" fill="#5a524a">in every edition. readings.json e12a-tr: the ΤΡ group waits on photographs (Q27).</text>
</svg>
