<text x="88.0" y="458.0" font-size="11.5" fill="#245b82" font-weight="700">great drain · ביבא הגדולא</text>
<text x="88.0" y="472.4" font-size="11.5" fill="#245b82">a wide built drain; course</text>
<text x="88.0" y="486.8" font-size="11.5" fill="#245b82">not given</text>
<text x="466.0" y="460.0" font-size="11.5" fill="#245b82" font-weight="700">cistern · הבור</text>
<text x="466.0" y="474.4" font-size="11.5" fill="#245b82">underground; mouth at</text>
<text x="466.0" y="488.8" font-size="11.5" fill="#245b82">the centre</text>
<rect x="220.0" y="578.0" width="300.0" height="46.0" fill="#fbfaf7" stroke="none" stroke-width="1.0" rx="4" fill-opacity="0.9"/>
<text x="228.0" y="596.0" font-size="11.5" fill="#8e2e22" font-weight="700">inside the cistern: the whole weight,</text>
<text x="228.0" y="610.4" font-size="11.5" fill="#8e2e22">71 talents and twenty minas</text>
<line x1="338.8" y1="454.8" x2="310.0" y2="582.0" stroke="#8e2e22" stroke-width="0.8"/>
