<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 59 (XII 8–9) — the great drain of the cistern (Bezek?)</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up by convention, with a side-view inset. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="692.9" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Main reading (letters of the text shown): in the great drain, inside the cistern</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The great drain · ביבא הגדולא feeds the cistern · הבור; the deposit lies in the drain</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">where it runs inside the cistern · מלבית הבור. No direction, size or depth is given.</text>
