<text x="1128.0" y="430.3" font-size="11" fill="#5a524a">a generic kokhim chamber, drawn</text>
<text x="1128.0" y="444.1" font-size="11" fill="#5a524a">beside the conduit; the 1971</text>
<text x="1128.0" y="457.8" font-size="11" fill="#5a524a">Ibziq tomb matches the type,</text>
<text x="1128.0" y="471.6" font-size="11" fill="#5a524a">not the chamber.</text>
<rect x="890.0" y="568.6" width="470.0" height="224.3" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="592.6" font-size="14" fill="#2a2420" font-weight="700">Other letters for the name and the conduit</text>
<text x="904.0" y="612.6" font-size="11.5" fill="#5a524a">These move the place or are rejected; the plan stays the same.</text>
<rect x="904.0" y="764.9" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="777.9" font-size="10.5" fill="#5f574e" font-weight="600">Changes the place, not the plan</text>
<text x="908.0" y="636.6" font-size="11.5" fill="#5a524a">• Milik 1962: הברוך, ha-Baruk, Banî Naʿîm and Hebron; in the Addenda,</text>
<text x="908.0" y="651.8" font-size="11.5" fill="#5a524a">בית הברך at Ramet el-Ḫalîl, Mamre.</text>
<text x="908.0" y="670.0" font-size="11.5" fill="#5a524a">• Wolters הכוך and Beyer הכרך: no gloss recorded.</text>
<text x="908.0" y="688.2" font-size="11.5" fill="#5a524a">• bkwkʾ for the conduit word: rejected by Puech.</text>
<rect x="40.0" y="812.9" width="1320.0" height="171.1" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="838.9" font-size="13" fill="#2a2420" font-weight="700">Text (XII 8–9)</text>
<text x="60.0" y="855.9" font-size="11.5" fill="#5a524a">“In the great drain of the cistern, inside the cistern: the whole weight, 71 talents and twenty</text>
<text x="60.0" y="871.1" font-size="11.5" fill="#5a524a">minas.”</text>
<text x="60.0" y="894.3" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="911.3" font-size="11.5" fill="#5a524a">The letters of the text shown, הבור “the cistern”, read by Wilmot and Wise, in both places: a cistern</text>
<text x="60.0" y="926.5" font-size="11.5" fill="#5a524a">fed by a great drain · ביבא הגדולא, with the deposit in the drain where it lies inside the cistern.</text>
<text x="60.0" y="941.6" font-size="11.5" fill="#5a524a">The drain's course and size, and any depth, are not given.</text>
<text x="700.0" y="838.9" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="855.9" font-size="11.5" fill="#5a524a">Possible only, medium. Kh. Ibziq, Bezek: possible, medium; Kh. Salhab, Zertal's biblical Bezeq:</text>
<text x="700.0" y="871.1" font-size="11.5" fill="#5a524a">possible, low. Both rest on reading הבזך, not the הבור of the text shown (atlas-data.json;</text>
<text x="700.0" y="886.3" font-size="11.5" fill="#5a524a">entry59_bezek_review.md).</text>
<text x="700.0" y="909.5" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="926.5" font-size="11.5" fill="#5a524a">Zertal reports cisterns and burial caves but no conduit, drain or channel at either Ibziq site or at</text>
<text x="700.0" y="941.6" font-size="11.5" fill="#5a524a">Kh. Salhab. A kokhim tomb of the 1st–2nd c. CE, excavated at Kh. Ibziq in 1971, fits the “burial</text>
<text x="700.0" y="956.8" font-size="11.5" fill="#5a524a">chamber” reading in type only (phase5_assessments.csv; entry59_bezek_review.md).</text>
</svg>
