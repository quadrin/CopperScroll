<text x="790.0" y="338.0" font-size="10.5" fill="#245b82" font-weight="600">cistern</text>
<text x="612.0" y="416.0" font-size="10.5" fill="#8d8780">Deposit at the drain's inner end: one choice.</text>
<rect x="600.0" y="442.0" width="250.0" height="330.9" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="1" rx="4" stroke-dasharray="5 3"/>
