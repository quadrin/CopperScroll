<circle cx="646.0" cy="608.5" r="1.8" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<text x="738.0" y="542.0" font-size="10.5" fill="#2a2420" font-weight="700" text-anchor="middle">Upper Kh. Ibziq</text>
<text x="787.1" y="512.9" font-size="10.5" fill="#2a2420" font-weight="700" text-anchor="end">Lower, ≈1 km NE</text>
<text x="640.0" y="632.5" font-size="10.5" fill="#2a2420" font-weight="700">Kh. Salhab, ≈3 km WSW</text>
<text x="612.0" y="652.5" font-size="10.5" fill="#8a5a17">dashed: Roman road B7, Neapolis–Scythopolis</text>
<text x="612.0" y="746.9" font-size="10.5" fill="#8d8780">No conduit is reported at any of them</text>
<text x="612.0" y="760.9" font-size="10.5" fill="#8d8780">(Zertal 2008; entry59_bezek_review.md).</text>
<rect x="890.0" y="100.0" width="470.0" height="224.3" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Allegro, Puech, Lefkovits: הבזך, Bezek</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">“In the great conduit of ha-Bezek, inside the house of Bezek”:</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">a building named for Bezek, and Puech's placement at Kh. Ibziq.</text>
<rect x="904.0" y="296.3" width="336.6" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="912.0" y="309.3" font-size="10.5" fill="#2f5a26" font-weight="600">Alternative reading · the atlas placement rests on it</text>
<rect x="998.0" y="200.0" width="90.0" height="64.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="2" fill-opacity="0.5"/>
<path d="M928.0,196.0 L998.0,232.0" fill="none" stroke="#245b82" stroke-width="10.4" stroke-linejoin="round"/>
<path d="M928.0,196.0 L998.0,232.0" fill="none" stroke="#cfe1ee" stroke-width="8" stroke-linejoin="round"/>
<path d="M998.0,232.0 L1048.0,244.0" fill="none" stroke="#245b82" stroke-width="10.4" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M998.0,232.0 L1048.0,244.0" fill="none" stroke="#fbfaf7" stroke-width="8" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M1031,237 L1041,247 M1041,237 L1031,247" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1004.0" y="216.0" font-size="10.5" fill="#7d7264" font-weight="600">house of Bezek</text>
<text x="1128.0" y="206.0" font-size="11" fill="#5a524a">the deposit lies in the great</text>
<text x="1128.0" y="219.8" font-size="11" fill="#5a524a">conduit where it runs inside</text>
<text x="1128.0" y="233.5" font-size="11" fill="#5a524a">the building.</text>
<rect x="890.0" y="334.3" width="470.0" height="224.3" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="358.3" font-size="14" fill="#2a2420" font-weight="700">Puech's other choice: בית הכוך, a burial chamber</text>
<text x="904.0" y="378.3" font-size="11.5" fill="#5a524a">The second word may read bzk or kwk: the deposit is inside</text>
<text x="904.0" y="394.3" font-size="11.5" fill="#5a524a">a burial chamber by the great conduit.</text>
<rect x="904.0" y="530.6" width="256.0" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="543.6" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading · not the text shown</text>
<path d="M928.0,436.3 L1078.0,436.3" fill="none" stroke="#245b82" stroke-width="10.4" stroke-linejoin="round"/>
<path d="M928.0,436.3 L1078.0,436.3" fill="none" stroke="#cfe1ee" stroke-width="8" stroke-linejoin="round"/>
