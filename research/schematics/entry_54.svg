<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 54 (XI 9–11) — the Jericho people's tomb</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up (orientation arbitrary: the text gives no direction). One arrangement the text allows; not a real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: one tomb, with the deposit and its record inside</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">“In it”: the vessels lie inside the tomb, and the record beside them. No direction, distance</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">or depth is given, so the tomb is a generic rock-cut chamber; its layout is not from the text.</text>
<rect x="60.0" y="174.0" width="790.0" height="492.0" fill="#f7f3ec" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="72.0" y="194.0" font-size="11" fill="#8d8780" font-weight="700">PLAN</text>
<path d="M820,200 L828,232 L820,226 L812,232 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="820.0" y="194.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<g transform="rotate(0 380.0 419.0)"><rect x="210.0" y="254.0" width="340.0" height="290.0" fill="url(#rockfill)" stroke="none" opacity="0.8"/><rect x="280.0" y="334.0" width="200.0" height="170.0" fill="#f3ece0" stroke="#3f3226" stroke-width="1.8"/><rect x="280.0" y="334.0" width="22.0" height="170.0" fill="#e3d7c2" stroke="#3f3226" stroke-width="0.8"/><rect x="458.0" y="334.0" width="22.0" height="170.0" fill="#e3d7c2" stroke="#3f3226" stroke-width="0.8"/><rect x="280.0" y="334.0" width="200.0" height="22.0" fill="#e3d7c2" stroke="#3f3226" stroke-width="0.8"/><rect x="317.0" y="282.0" width="16.0" height="52.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.3"/><rect x="372.0" y="282.0" width="16.0" height="52.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.3"/><rect x="427.0" y="282.0" width="16.0" height="52.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.3"/><rect x="228.0" y="371.0" width="52.0" height="16.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.3"/><rect x="228.0" y="451.0" width="52.0" height="16.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.3"/><rect x="480.0" y="371.0" width="52.0" height="16.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.3"/><rect x="480.0" y="451.0" width="52.0" height="16.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.3"/><rect x="365.0" y="503.0" width="30.0" height="18.0" fill="#f3ece0" stroke="#3f3226" stroke-width="1.3"/><path d="M310.0,521.0 L310.0,579.0 M450.0,521.0 L450.0,579.0 M310.0,521.0 L450.0,521.0" fill="none" stroke="#3f3226" stroke-width="1.6"/></g>
<path d="M353,422 L367,436 M367,422 L353,436" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M347,451 L355,451 L356,460 Q351,464 346,460 Z" fill="#f1d9ae" stroke="#8a5a17" stroke-width="1" stroke-linejoin="round"/>
