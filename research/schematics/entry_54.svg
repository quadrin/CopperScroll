<rect x="397.0" y="424.0" width="22.0" height="14.0" fill="#fff8e8" stroke="#2a2420" stroke-width="1.2" rx="2"/>
<line x1="401.0" y1="428.0" x2="415.0" y2="428.0" stroke="#5a524a" stroke-width="0.8"/>
<line x1="401.0" y1="431.0" x2="415.0" y2="431.0" stroke="#5a524a" stroke-width="0.8"/>
<line x1="401.0" y1="434.0" x2="415.0" y2="434.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="620.0" y="284.0" font-size="12" fill="#3f3226" font-weight="700">tomb · קבר</text>
<text x="620.0" y="299.0" font-size="12" fill="#3f3226">of the common people · בני העם</text>
<text x="620.0" y="314.0" font-size="12" fill="#3f3226">which is ritually pure · טהור</text>
<line x1="614.0" y1="292.0" x2="520.0" y2="349.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="620.0" y="415.0" font-size="12" fill="#8e2e22" font-weight="700">× vessels of offering, fourteen</text>
<text x="620.0" y="430.0" font-size="12" fill="#8e2e22">“in it”: inside the tomb</text>
<line x1="614.0" y1="411.0" x2="368.0" y2="427.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="620.0" y="467.0" font-size="12" fill="#2a2420" font-weight="700">their record beside them</text>
<text x="620.0" y="482.0" font-size="12" fill="#2a2420">the translation's reading (as Pfann)</text>
<line x1="614.0" y1="463.0" x2="420.0" y2="433.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="620.0" y="531.0" font-size="11" fill="#8d8780" font-weight="600">dotted = rock. Benches and loculi show a</text>
<text x="620.0" y="544.8" font-size="11" fill="#8d8780">generic chamber tomb, not the text</text>
<text x="380.0" y="619.0" font-size="11" fill="#8a5a17" font-weight="600" text-anchor="middle">entrance (side not given)</text>
<text x="74.0" y="652.0" font-size="10.5" fill="#8d8780" font-style="italic">features enlarged; no scale in the text</text>
<rect x="60.0" y="680.0" width="790.0" height="116.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="74.0" y="702.0" font-size="12.5" fill="#2a2420" font-weight="700">What the lines give</text>
<text x="74.0" y="726.0" font-size="11.5" fill="#2a2420" font-weight="700">Landmark</text>
<text x="244.0" y="726.0" font-size="11.5" fill="#5a524a">a tomb · קבר, named by its owners (see the readings, right)</text>
<text x="74.0" y="745.0" font-size="11.5" fill="#2a2420" font-weight="700">Direction, distance</text>
<text x="244.0" y="745.0" font-size="11.5" fill="#5a524a">none given</text>
<text x="74.0" y="764.0" font-size="11.5" fill="#2a2420" font-weight="700">Position of the deposit</text>
<text x="244.0" y="764.0" font-size="11.5" fill="#5a524a">“in it”: inside the tomb; no depth</text>
<text x="74.0" y="783.0" font-size="11.5" fill="#2a2420" font-weight="700">Deposit</text>
<text x="244.0" y="783.0" font-size="11.5" fill="#5a524a">vessels of offering, fourteen, with their record beside them</text>
<rect x="890.0" y="100.0" width="470.0" height="372.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Whose tomb? The readings of XI 9–10</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">The readings change the owners' name, not the plan.</text>
<rect x="904.0" y="444.0" width="169.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="457.0" font-size="10.5" fill="#5f574e" font-weight="600">Same plan on every reading</text>
<text x="904.0" y="170.0" font-size="11.5" fill="#2a2420" font-weight="700">common people · בני העם</text>
<text x="904.0" y="185.0" font-size="11" fill="#5a524a">Puech 2006 (project text)</text>
<text x="904.0" y="208.0" font-size="11.5" fill="#2a2420" font-weight="700">the sons of Obed</text>
<text x="904.0" y="223.0" font-size="11" fill="#5a524a">Lefkovits 2000</text>
<text x="904.0" y="246.0" font-size="11.5" fill="#2a2420" font-weight="700">the sons of … (name read in part)</text>
<text x="904.0" y="261.0" font-size="11" fill="#5a524a">Milik; “of Yerah”, Milik 1960</text>
<text x="904.0" y="284.0" font-size="11.5" fill="#2a2420" font-weight="700">which is ritually pure · טהור</text>
<text x="904.0" y="299.0" font-size="11" fill="#5a524a">the text shown</text>
<text x="904.0" y="322.0" font-size="11.5" fill="#2a2420" font-weight="700">“my pure things are in it”</text>
<text x="904.0" y="337.0" font-size="11" fill="#5a524a">Wolters 1994, from the copper</text>
<text x="904.0" y="360.0" font-size="11.5" fill="#2a2420" font-weight="700">of Jericho · ירחו</text>
<text x="904.0" y="375.0" font-size="11" fill="#5a524a">Puech 2006</text>
<text x="904.0" y="398.0" font-size="11.5" fill="#2a2420" font-weight="700">the Jerichoite</text>
<text x="904.0" y="413.0" font-size="11" fill="#5a524a">Milik; Lefkovits 2000</text>
<rect x="890.0" y="482.0" width="470.0" height="328.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="506.0" font-size="14" fill="#2a2420" font-weight="700">The closing phrase: a record, or “nearby”?</text>
<text x="904.0" y="526.0" font-size="11.5" fill="#5a524a">Milik 1960 (with Pixner, García Martínez, Vermes, Lange)</text>
<text x="904.0" y="542.0" font-size="11.5" fill="#5a524a">makes it begin the next item; Puech and Lefkovits end this one.</text>
<rect x="904.0" y="782.0" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative division · Milik 1960</text>
<rect x="961.5" y="616.0" width="100.0" height="80.0" fill="#f3ece0" stroke="#3f3226" stroke-width="1.6"/>
<path d="M989.5,650.0 L1001.5,662.0 M1001.5,650.0 L989.5,662.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<rect x="1019.5" y="649.5" width="20.0" height="13.0" fill="#fff8e8" stroke="#2a2420" stroke-width="1.2" rx="2"/>
<line x1="1023.5" y1="653.0" x2="1035.5" y2="653.0" stroke="#5a524a" stroke-width="0.8"/>
<line x1="1023.5" y1="656.0" x2="1035.5" y2="656.0" stroke="#5a524a" stroke-width="0.8"/>
<line x1="1023.5" y1="659.0" x2="1035.5" y2="659.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="1011.5" y="718.0" font-size="11" fill="#2a2420" font-weight="700" text-anchor="middle">Project text, Pfann:</text>
<text x="1011.5" y="731.8" font-size="11" fill="#2a2420" text-anchor="middle">record in the tomb</text>
<rect x="1146.7" y="616.0" width="80.0" height="80.0" fill="#f3ece0" stroke="#3f3226" stroke-width="1.6"/>
<path d="M1180.72,650.0 L1192.72,662.0 M1192.72,650.0 L1180.72,662.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="1232.7" y1="656.0" x2="1290.7" y2="656.0" stroke="#8a5a17" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-ochre)"/>
<circle cx="1306.7" cy="656.0" r="11.0" fill="none" stroke="#8a5a17" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="1226.7" y="718.0" font-size="11" fill="#2a2420" font-weight="700" text-anchor="middle">Milik 1960: “and near there”</text>
<text x="1226.7" y="731.8" font-size="11" fill="#2a2420" text-anchor="middle">opens his item 57</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (XI 9–11)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the tomb of the common people, which is ritually pure: in it, vessels of offering, fourteen.</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">Their record beside them.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">One tomb with the deposit inside it; the record lies with the vessels, as the translation reads the</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">closing phrase. No direction, distance or depth; the tomb plan is generic.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low. Candidates kept for comparison: Kidron valley, east slope (Silwan necropolis) and</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">Kidron valley at Gethsemane. No landmark is uniquely identified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No phase-5 assessment or feature constraint is recorded. Wolters read “my pure things are in it” from</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">the copper (1994 pp. 292–295; sources.md). If the tomb was for priests, Puech 2015 p. 101 names the</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">Benê Ḥezîr tomb in the Kidron as one possibility (phase5_reports.csv).</text>
</svg>
