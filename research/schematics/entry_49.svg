<text x="904.0" y="914.0" font-size="10.5" fill="#5a524a">• Small receiver: L103 crosses W1 into it; its authors read storage or</text>
<text x="904.0" y="927.9" font-size="10.5" fill="#5a524a">overflow, so bathing stays inconclusive.</text>
<text x="904.0" y="944.7" font-size="10.5" fill="#5a524a">• Larger basin: no plan shows a place under a pipe inside it; its bath</text>
<text x="904.0" y="958.6" font-size="10.5" fill="#5a524a">function and name are open (siloam_bathing.md).</text>
<rect x="40.0" y="1030.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="1056.0" font-size="13" fill="#2a2420" font-weight="700">Text (X 15–16)</text>
<text x="60.0" y="1073.0" font-size="11.5" fill="#5a524a">“In the basin(?) of the bathhouse(?) of Raḥil(?), under the trough: 17 talents.”</text>
<text x="60.0" y="1096.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="1113.2" font-size="11.5" fill="#5a524a">Milik's letters as printed: a basin that belongs to a bathhouse, with a trough at the basin; the</text>
<text x="60.0" y="1128.4" font-size="11.5" fill="#5a524a">deposit is under the trough. The trough's place at the basin and all sizes are not given.</text>
<text x="700.0" y="1056.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="1073.0" font-size="11.5" fill="#5a524a">Best-supported, medium, conditional on reading Siloam: the Siloam complex, Gihon outlet to the Siloam</text>
<text x="700.0" y="1088.2" font-size="11.5" fill="#5a524a">pool (an area of about 300 m); no single pool or trough is selected.</text>
<text x="700.0" y="1111.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1128.4" font-size="11.5" fill="#5a524a">phase5_assessments.csv and feature_constraints.csv: the pool and outlet setting was in use in the 1st</text>
