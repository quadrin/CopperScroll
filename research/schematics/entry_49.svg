<text x="58.0" y="790.0" font-size="12.5" fill="#2a2420" font-weight="700">Reading the words</text>
<text x="58.0" y="812.0" font-size="11.5" fill="#5a524a">• Installation: basin of the Baths (Milik), outlet of the</text>
<text x="58.0" y="827.2" font-size="11.5" fill="#5a524a">waters (Puech), pool of the water closet (Lefkovits). The</text>
<text x="58.0" y="842.4" font-size="11.5" fill="#5a524a">kind of installation changes with the reading (right).</text>
<text x="58.0" y="863.5" font-size="11.5" fill="#5a524a">• Trough: engraved השקת, read by all editions (plate</text>
<text x="58.0" y="878.7" font-size="11.5" fill="#5a524a">check); Puech: a hollowed stone trough or gutter. Its</text>
<text x="58.0" y="893.9" font-size="11.5" fill="#5a524a">terminal letter is not independently settled.</text>
<text x="448.0" y="812.0" font-size="11.5" fill="#5a524a">• Name: Siloam for Puech, who supplies של, and for Milik,</text>
<text x="448.0" y="827.2" font-size="11.5" fill="#5a524a">who reads שלוחי; Rachel for Lurie, Beyer and Wolters; Jehu</text>
<text x="448.0" y="842.4" font-size="11.5" fill="#5a524a">for Lefkovits. The text shown prints ר: Raḥil. The plates</text>
<text x="448.0" y="857.5" font-size="11.5" fill="#5a524a">lean to Siloam without deciding it (Q35).</text>
<text x="448.0" y="878.7" font-size="11.5" fill="#5a524a">• 17 is the treasure quantity: no unit of length occurs in</text>
<text x="448.0" y="893.9" font-size="11.5" fill="#5a524a">X 15–16.</text>
