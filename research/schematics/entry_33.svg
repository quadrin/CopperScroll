<text x="934.0" y="342.0" font-size="11" fill="#2a2420" font-weight="700">Ḥazor</text>
<rect x="1070.0" y="332.0" width="63.4" height="18.8" fill="#ffffff" stroke="none" stroke-width="1.0" rx="3" fill-opacity="0.9"/>
<text x="1074.0" y="344.0" font-size="11" fill="#2a2420" font-weight="700">Bet Ḥaṣor</text>
<rect x="1252.0" y="286.5" width="55.0" height="31.2" fill="#ffffff" stroke="none" stroke-width="1.0" rx="3" fill-opacity="0.9"/>
<text x="1256.0" y="298.0" font-size="10.5" fill="#245b82" font-weight="700">road and</text>
<text x="1256.0" y="311.1" font-size="10.5" fill="#245b82">conduit</text>
<text x="908.0" y="182.0" font-size="10.5" fill="#8d8780" font-style="italic">settlement scale, not a building</text>
<rect x="890.0" y="490.0" width="470.0" height="400.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="514.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<rect x="904.0" y="862.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="875.0" font-size="10.5" fill="#5f574e" font-weight="600">Name and deposit only</text>
<circle cx="912.0" cy="532.0" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="536.0" font-size="11.5" fill="#5a524a">The reference name: Puech reads אחיה, Aḥiyah, a personal name; Milik</text>
<text x="922.0" y="551.2" font-size="11.5" fill="#5a524a">reads אחזר, Ḥazor. The אחור of the text shown matches neither. The</text>
<text x="922.0" y="566.4" font-size="11.5" fill="#5a524a">lexicon rates it low: in the Bible Ahijah is a person, never a place.</text>
<circle cx="912.0" cy="585.5" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="589.5" font-size="11.5" fill="#5a524a">The conduit: only the end of the word survives; no reading other than</text>
<text x="922.0" y="604.7" font-size="11.5" fill="#5a524a">Puech's restoration is reported.</text>
<circle cx="912.0" cy="623.9" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="627.9" font-size="11.5" fill="#5a524a">The last phrase: Wolters reads “and my scrolls, and a bar of silver”;</text>
<text x="922.0" y="643.1" font-size="11.5" fill="#5a524a">Puech and Milik read other letters, not glossed in the files. It</text>
<text x="922.0" y="658.3" font-size="11.5" fill="#5a524a">changes what lies in the conduit, not where.</text>
<text x="908.0" y="705.4" font-size="13" fill="#2a2420" font-weight="700">Key</text>
<rect x="910.0" y="716.4" width="20.0" height="14.0" fill="#c98a2e" stroke="none" stroke-width="1.0" fill-opacity="0.25"/>
<text x="938.0" y="727.4" font-size="11.5" fill="#5a524a">quarter east of Aḥor</text>
<rect x="910.0" y="740.4" width="20.0" height="14.0" fill="#5f8a52" stroke="none" stroke-width="1.0" fill-opacity="0.25"/>
<text x="938.0" y="751.4" font-size="11.5" fill="#5a524a">quarter east of the Treasury</text>
<rect x="911.0" y="764.9" width="18.0" height="13.0" fill="#f1ebe0" stroke="#7d7264" stroke-width="2.5"/>
<rect x="917.5" y="776.7" width="5.0" height="2.5" fill="#f1ebe0" stroke="none" stroke-width="1.0"/>
<text x="938.0" y="775.4" font-size="11.5" fill="#5a524a">House of the Treasury</text>
<path d="M910.0,795.4 L930.0,795.4" fill="none" stroke="#245b82" stroke-width="6.4" stroke-linejoin="round"/>
<path d="M910.0,795.4 L930.0,795.4" fill="none" stroke="#cfe1ee" stroke-width="4" stroke-linejoin="round"/>
<text x="938.0" y="799.4" font-size="11.5" fill="#5a524a">conduit along the road</text>
<rect x="40.0" y="910.0" width="1320.0" height="174.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Text (VIII 1–3)</text>
<text x="60.0" y="953.0" font-size="11.5" fill="#5a524a">“[In the con]duit that is on the road east of the House of the Treasury, which is east of Aḥor:</text>
<text x="60.0" y="968.2" font-size="11.5" fill="#5a524a">vessels of offering and scrolls, bound up(?): 10.”</text>
<text x="60.0" y="991.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="1008.4" font-size="11.5" fill="#5a524a">Each “east of” is the 90° quarter centred on east; “which is east of Aḥor” is taken with the House.</text>
<text x="60.0" y="1023.5" font-size="11.5" fill="#5a524a">The conduit runs along the road and holds the deposit. The road's course, the distances and the</text>
<text x="60.0" y="1038.7" font-size="11.5" fill="#5a524a">building's size are not given.</text>
<text x="700.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="953.0" font-size="11.5" fill="#5a524a">Possible only, low: Jericho oasis (town or district, no finer place). The placement stays at district</text>
<text x="700.0" y="968.2" font-size="11.5" fill="#5a524a">level; the scroll's feature has not been identified (atlas caution).</text>
<text x="700.0" y="991.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1008.4" font-size="11.5" fill="#5a524a">Not recorded: no phase-5 assessment or feature-constraint row exists for this entry, and the atlas</text>
<text x="700.0" y="1023.5" font-size="11.5" fill="#5a524a">says the site index supplies no uniquely identified landmark. Milik's el-ʿAṣur / Baal-Hazor placement</text>
<text x="700.0" y="1038.7" font-size="11.5" fill="#5a524a">is rated weak or ruled out (readings.json).</text>
</svg>
