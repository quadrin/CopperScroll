<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 33 (VIII 1–3) — the conduit on the road east of the Treasury</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="790.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: in the conduit on the road east of the Treasury, east of Aḥor</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">Two “east of” steps: the treasury lies in Aḥor's east quarter, and the road with its conduit in the</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">treasury's east quarter. No distance, road course or building size is given; “[In the con]duit” is restored.</text>
