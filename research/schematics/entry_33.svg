<text x="614.0" y="744.4" font-size="11.5" fill="#245b82">first letters restored (Puech)</text>
<rect x="610.0" y="473.0" width="196.2" height="35.0" fill="#ffffff" stroke="none" stroke-width="1.0" rx="3" fill-opacity="0.9"/>
