<text x="614.0" y="274.4" font-size="11.5" fill="#7d6a4a">course not given: drawn north–south</text>
<rect x="610.0" y="717.5" width="214.1" height="33.8" fill="#ffffff" stroke="none" stroke-width="1.0" rx="3" fill-opacity="0.9"/>
