<text x="822.0" y="792.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="64.0" y="870.0" font-size="10.5" fill="#8d8780">No scale: the text gives no distances. Quarters show directions only.</text>
<rect x="890.0" y="100.0" width="470.0" height="380.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Milik: two place names, not a building</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Milik 1960/1962 reads Bet Ḥaṣor for the House of the Treasury,</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">and Ḥazor for Aḥor: the same chain, between settlements.</text>
<rect x="904.0" y="452.0" width="268.4" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="465.0" font-size="10.5" fill="#7a2f22" font-weight="600">Not adopted: rests on Milik's emended text</text>
<path d="M958.0,302.0 L1042.9,217.1 A120,120 0 0,1 1042.9,386.9 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.13"/>
