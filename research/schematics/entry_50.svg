<path d="M945.5,185.5 L954.5,194.5 M954.5,185.5 L945.5,194.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M1091.5,185.5 L1100.5,194.5 M1100.5,185.5 L1091.5,194.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
