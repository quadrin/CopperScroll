<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
<title>Copper Scroll entry 50: the upper pool, at its four corners</title>
