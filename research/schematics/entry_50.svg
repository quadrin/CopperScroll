<text x="293.0" y="240.0" font-size="12" fill="#245b82" font-weight="700" text-anchor="middle">[upper pool] · בברכא העליונה</text>
<text x="293.0" y="255.0" font-size="12" fill="#245b82" text-anchor="middle">restored; what it is “upper” to is not said</text>
<text x="293.0" y="432.0" font-size="11.5" fill="#8e2e22" font-weight="700" text-anchor="middle">at each corner:</text>
<text x="293.0" y="446.4" font-size="11.5" fill="#8e2e22" text-anchor="middle">gold, vessels of offering;</text>
<text x="293.0" y="460.8" font-size="11.5" fill="#8e2e22" text-anchor="middle">their record beside them</text>
<text x="293.0" y="640.0" font-size="12" fill="#2a2420" font-weight="700" text-anchor="middle">four corners · ארבעת מקצועות</text>
<text x="293.0" y="655.0" font-size="12" fill="#2a2420" text-anchor="middle">four deposits, one per corner</text>
<text x="516.0" y="724.0" font-size="10.5" fill="#8d8780" text-anchor="end">Not to scale.</text>
<rect x="548.0" y="176.0" width="304.0" height="300.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="560.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">DETAIL · which corner?</text>
<text x="560.0" y="214.0" font-size="10.5" fill="#8d8780" font-style="italic">Schiffman, CSS pp. 180–197</text>
<path d="M588.0,336.0 L588.0,246.0 L678.0,246.0" fill="none" stroke="#7d7264" stroke-width="7" stroke-linejoin="miter"/>
<path d="M604,262 L616,274 M616,262 L604,274" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="688.0" y="270.0" font-size="11.5" fill="#2a2420" font-weight="700">inner corner · מקצוע</text>
<text x="688.0" y="284.4" font-size="11.5" fill="#2a2420">the word used here</text>
<path d="M678.0,446.0 L678.0,386.0 L618.0,386.0" fill="none" stroke="#7d7264" stroke-width="7" stroke-linejoin="miter"/>
<path d="M693,363 L703,373 M703,363 L693,373" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="692.0" y1="374.0" x2="704.0" y2="362.0" stroke="#b9b2a8" stroke-width="0.6"/>
<text x="718.0" y="406.0" font-size="11.5" fill="#8d8780" font-weight="700">outer corner · פנה</text>
<text x="718.0" y="420.4" font-size="11.5" fill="#8d8780">not this word</text>
<text x="548.0" y="502.0" font-size="12.5" fill="#2a2420" font-weight="700">Reading the words</text>
<text x="548.0" y="522.0" font-size="11.5" fill="#5a524a">Milik's Addenda read מקצועותיהם, “their</text>
<text x="548.0" y="537.2" font-size="11.5" fill="#5a524a">corners”. Lefkovits counts four deposits</text>
<text x="548.0" y="552.4" font-size="11.5" fill="#5a524a">here; Beyer joins entries 49 and 50 into</text>
<text x="548.0" y="567.5" font-size="11.5" fill="#5a524a">one unit.</text>
<text x="548.0" y="588.7" font-size="11.5" fill="#5a524a">“Their record beside them”: with כ, a</text>
<text x="548.0" y="603.9" font-size="11.5" fill="#5a524a">written record lies with the deposit;</text>
<text x="548.0" y="619.1" font-size="11.5" fill="#5a524a">the letter, כ or ב, is open (Q5).</text>
<text x="60.0" y="766.0" font-size="13" fill="#2a2420" font-weight="700">Key</text>
<path d="M67,779 L77,789 M77,779 L67,789" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="90.0" y="788.0" font-size="11.5" fill="#5a524a">deposit: gold, vessels of offering</text>
<rect x="66.5" y="803.0" width="11.0" height="14.0" fill="#fffdf6" stroke="#8a5a17" stroke-width="1"/>
<line x1="68.7" y1="807.0" x2="75.3" y2="807.0" stroke="#8a5a17" stroke-width="0.7"/>
<line x1="68.7" y1="810.3" x2="75.3" y2="810.3" stroke="#8a5a17" stroke-width="0.7"/>
<line x1="68.7" y1="813.6" x2="75.3" y2="813.6" stroke="#8a5a17" stroke-width="0.7"/>
<text x="90.0" y="814.0" font-size="11.5" fill="#5a524a">their record beside them, on the כ reading</text>
<rect x="890.0" y="100.0" width="470.0" height="192.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Puech 2006: the court of Zadok</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Puech names Zadok on this line, the only place the name rests</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">on his reading alone. A court, not a pool; gold included.</text>
<rect x="904.0" y="264.0" width="175.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="277.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading (Puech)</text>
<rect x="938.0" y="178.0" width="170.0" height="68.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
