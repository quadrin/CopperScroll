<path d="M1091.5,229.5 L1100.5,238.5 M1100.5,229.5 L1091.5,238.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1023.0" y="216.0" font-size="11" fill="#5a524a" text-anchor="middle" font-style="italic">court</text>
<text x="1128.0" y="198.0" font-size="11.5" fill="#5a524a">court of Zadok,</text>
<text x="1128.0" y="212.4" font-size="11.5" fill="#5a524a">four corners;</text>
<text x="1128.0" y="226.8" font-size="11.5" fill="#5a524a">his letters are not</text>
<text x="1128.0" y="241.1" font-size="11.5" fill="#5a524a">given in the files</text>
<rect x="890.0" y="302.0" width="470.0" height="192.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="326.0" font-size="14" fill="#2a2420" font-weight="700">Lefkovits: the [inner court]</text>
<text x="904.0" y="346.0" font-size="11.5" fill="#5a524a">Lefkovits restores an inner court: four deposits, one at</text>
<text x="904.0" y="362.0" font-size="11.5" fill="#5a524a">each corner, and no gold.</text>
<rect x="904.0" y="466.0" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="479.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading (Lefkovits)</text>
<path d="M928.0,376.0 L1118.0,376.0 L1118.0,452.0 L928.0,452.0 L928.0,376.0" fill="none" stroke="#b9b2a8" stroke-width="4" stroke-linejoin="miter"/>
<rect x="973.0" y="390.0" width="100.0" height="48.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M973.0,390.0 L1073.0,390.0 L1073.0,438.0 L973.0,438.0 L973.0,390.0" fill="none" stroke="#7d7264" stroke-width="4" stroke-linejoin="miter"/>
<path d="M978.5,395.5 L987.5,404.5 M987.5,395.5 L978.5,404.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M1058.5,395.5 L1067.5,404.5 M1067.5,395.5 L1058.5,404.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M978.5,423.5 L987.5,432.5 M987.5,423.5 L978.5,432.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M1058.5,423.5 L1067.5,432.5 M1067.5,423.5 L1058.5,432.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1138.0" y="396.0" font-size="11.5" fill="#5a524a">inner court, restored</text>
<text x="1138.0" y="410.4" font-size="11.5" fill="#5a524a">outer court implied</text>
<text x="1138.0" y="424.8" font-size="11.5" fill="#5a524a">(grey; one choice)</text>
<rect x="890.0" y="504.0" width="470.0" height="192.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="528.0" font-size="14" fill="#2a2420" font-weight="700">Milik's Addenda, Beyer: tied to entry 49</text>
<text x="904.0" y="548.0" font-size="11.5" fill="#5a524a">Milik restores “its pool” = the pool of Siloam; Beyer reads</text>
<text x="904.0" y="564.0" font-size="11.5" fill="#5a524a">49 and 50 as one unit: one basin, a trough and four corners.</text>
<rect x="904.0" y="668.0" width="132.0" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="681.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative division</text>
<rect x="928.0" y="580.0" width="190.0" height="72.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.6"/>
<path d="M935.5,587.5 L944.5,596.5 M944.5,587.5 L935.5,596.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M1101.5,587.5 L1110.5,596.5 M1110.5,587.5 L1101.5,596.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M935.5,635.5 L944.5,644.5 M944.5,635.5 L935.5,644.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M1101.5,635.5 L1110.5,644.5 M1110.5,635.5 L1101.5,644.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<rect x="997.0" y="573.0" width="52.0" height="16.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<text x="1138.0" y="600.0" font-size="11.5" fill="#5a524a">“its pool”: entry 49's</text>
<text x="1138.0" y="614.4" font-size="11.5" fill="#5a524a">basin, with its trough</text>
<text x="1138.0" y="628.8" font-size="11.5" fill="#5a524a">(grey box; one choice)</text>
<rect x="890.0" y="706.0" width="470.0" height="204.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="730.0" font-size="14" fill="#2a2420" font-weight="700">Readings that change the contents, not the plan</text>
<rect x="904.0" y="882.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="895.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="906.0" y="758.0" font-size="11.5" fill="#5a524a">• Gold: in Puech's text, not in Lefkovits's. The text shown has זהב, as</text>
<text x="906.0" y="773.2" font-size="11.5" fill="#5a524a">Puech.</text>
<text x="906.0" y="793.4" font-size="11.5" fill="#5a524a">• “Their record beside them”: Puech and Lefkovits end the entry with it;</text>
<text x="906.0" y="808.5" font-size="11.5" fill="#5a524a">Milik and his followers begin the next item, “and near there”. All five</text>
<text x="906.0" y="823.7" font-size="11.5" fill="#5a524a">occurrences follow “vessels of offering”, which favours ending the entry</text>
<text x="906.0" y="838.9" font-size="11.5" fill="#5a524a">(deeper analysis §6).</text>
<rect x="40.0" y="930.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="956.0" font-size="13" fill="#2a2420" font-weight="700">Text (X 17–XI 1)</text>
<text x="60.0" y="973.0" font-size="11.5" fill="#5a524a">“[In the upper pool], at its four corners: gold, vessels of offering; their record beside them.”</text>
<text x="60.0" y="996.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="1013.2" font-size="11.5" fill="#5a524a">The restored “upper pool” as one basin with four inner corners and one deposit at each, with its</text>
<text x="60.0" y="1028.4" font-size="11.5" fill="#5a524a">record. Size, depth, orientation and what the pool is “upper” to are not given.</text>
<text x="700.0" y="956.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="973.0" font-size="11.5" fill="#5a524a">Possible only, low; atlas title “Zadok's court”. Candidate: the south-east corner of the Temple</text>
<text x="700.0" y="988.2" font-size="11.5" fill="#5a524a">enclosure (Solomon's Stables) or the Kidron slope just below it. No landmark identified.</text>
<text x="700.0" y="1011.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1028.4" font-size="11.5" fill="#5a524a">No phase-5 assessment or feature-constraint row is recorded for this entry; the atlas keeps the</text>
<text x="700.0" y="1043.5" font-size="11.5" fill="#5a524a">candidate for comparison only (Phase 3 site index).</text>
</svg>
