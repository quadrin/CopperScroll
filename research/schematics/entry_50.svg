</defs>
<rect width="1400" height="1100" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 50 (X 17–XI 1) — the upper pool, at its four corners</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan; the text gives no direction, so no north arrow. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="810.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Text shown: the restored “upper pool”, a deposit at each of its four corners</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">“Upper pool” is a restoration, hence the brackets. One deposit per corner, as Lefkovits counts;</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">Schiffman: מקצוע is an inner corner, so each sits inside an angle. Size and orientation not given.</text>
<rect x="54.0" y="882.0" width="82.4" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="895.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project text</text>
