<path d="M72.8,817.5 L78.8,817.1 L70.6,811.5 L81.3,812.8 L73.1,807.3 L83.4,808.4 L74.4,802.5 L84.2,803.5 L75.2,797.6 L80.3,796.9 L79.2,796.5 L73.2,796.9 L81.4,802.5 L70.7,801.2 L78.9,806.7 L68.6,805.6 L77.6,811.5 L67.8,810.5 L76.8,816.4 L71.7,817.1 Z" fill="#4a3b2c" stroke="#2f241a" stroke-width="0.8" stroke-linejoin="round"/>
