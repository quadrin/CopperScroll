<text x="377.2" y="430.7" font-size="12" fill="#8e2e22">a natural crack: vessels of offering</text>
<line x1="551.2" y1="533.7" x2="579.2" y2="585.7" stroke="#5a524a" stroke-width="0.8"/>
<rect x="553.2" y="589.2" width="162.6" height="33.8" fill="#ffffff" stroke="none" stroke-width="1.0" rx="3" fill-opacity="0.9"/>
