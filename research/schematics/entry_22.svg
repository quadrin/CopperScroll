<path d="M71,827 L81,837 M81,827 L71,837" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="94.0" y="836.0" font-size="11.5" fill="#5a524a">deposit: vessels; smaller × = their record</text>
<rect x="890.0" y="100.0" width="470.0" height="300.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">What lies beside the vessels? (V 7)</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">The closing phrase is read three ways; it ends this entry</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">for Puech and Lefkovits, and opens the next for Milik.</text>
<rect x="904.0" y="372.0" width="256.0" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="385.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes what is deposited, not the place</text>
<path d="M951.3,254.4 L958.5,247.9 L951.0,238.4 L963.0,233.0 L955.5,223.4 L966.9,217.9 L958.1,208.1 L968.8,202.4 L960.0,192.6 L965.9,185.9 L964.7,185.6 L957.5,192.1 L965.0,201.6 L953.0,207.0 L960.5,216.6 L949.1,222.1 L957.9,231.9 L947.2,237.6 L956.0,247.4 L950.1,254.1 Z" fill="#4a3b2c" stroke="#2f241a" stroke-width="0.8" stroke-linejoin="round"/>
<path d="M948,204 L960,216 M960,204 L948,216" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M970,230 L978,238 M978,230 L970,238" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="908.0" y="280.0" font-size="10.5" fill="#5a524a" font-weight="700">text shown, Pfann:</text>
<text x="908.0" y="293.1" font-size="10.5" fill="#5a524a">a written record</text>
<text x="908.0" y="306.2" font-size="10.5" fill="#5a524a">lies with them</text>
<path d="M1101.3,254.4 L1108.5,247.9 L1101.0,238.4 L1113.0,233.0 L1105.5,223.4 L1116.9,217.9 L1108.1,208.1 L1118.8,202.4 L1110.0,192.6 L1115.9,185.9 L1114.7,185.6 L1107.5,192.1 L1115.0,201.6 L1103.0,207.0 L1110.5,216.6 L1099.1,222.1 L1107.9,231.9 L1097.2,237.6 L1106.0,247.4 L1100.1,254.1 Z" fill="#4a3b2c" stroke="#2f241a" stroke-width="0.8" stroke-linejoin="round"/>
<path d="M1100,210 L1112,222 M1112,210 L1100,222" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1058.0" y="280.0" font-size="10.5" fill="#5a524a" font-weight="700">Puech, with ב:</text>
<text x="1058.0" y="293.1" font-size="10.5" fill="#5a524a">“with their content”;</text>
<text x="1058.0" y="306.2" font-size="10.5" fill="#5a524a">no second object</text>
<path d="M1241.3,254.4 L1248.5,247.9 L1241.0,238.4 L1253.0,233.0 L1245.5,223.4 L1256.9,217.9 L1248.1,208.1 L1258.8,202.4 L1250.0,192.6 L1255.9,185.9 L1254.7,185.6 L1247.5,192.1 L1255.0,201.6 L1243.0,207.0 L1250.5,216.6 L1239.1,222.1 L1247.9,231.9 L1237.2,237.6 L1246.0,247.4 L1240.1,254.1 Z" fill="#4a3b2c" stroke="#2f241a" stroke-width="0.8" stroke-linejoin="round"/>
<path d="M1240,210 L1252,222 M1252,210 L1240,222" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="1272.0" y1="220.0" x2="1316.0" y2="220.0" stroke="#5a524a" stroke-width="1" marker-end="url(#ah-ink)"/>
<text x="1294.0" y="212.0" font-size="10.5" fill="#5a524a" font-weight="700" text-anchor="middle">23</text>
<text x="1208.0" y="280.0" font-size="10.5" fill="#5a524a" font-weight="700">Milik: “and near</text>
<text x="1208.0" y="293.1" font-size="10.5" fill="#5a524a">there” opens the</text>
<text x="1208.0" y="306.2" font-size="10.5" fill="#5a524a">next item (entry 23)</text>
<text x="908.0" y="352.0" font-size="11" fill="#5a524a">The research files favour ending the entry with the phrase (it always</text>
<text x="908.0" y="366.5" font-size="11" fill="#5a524a">follows “vessels of offering”) but leave the letter, כ or ב, open (Q5).</text>
<rect x="890.0" y="410.0" width="470.0" height="200.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="434.0" font-size="14" fill="#2a2420" font-weight="700">Fissure or hole?</text>
<text x="904.0" y="454.0" font-size="11.5" fill="#5a524a">Lefkovits (pp. 190–192) records Lurie's “hole” beside the fissure.</text>
<rect x="904.0" y="582.0" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="595.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative recorded, not adopted</text>
<path d="M942.3,527.5 L949.3,522.1 L941.5,513.7 L953.4,509.4 L945.6,500.9 L956.8,496.5 L947.7,487.7 L958.2,483.1 L949.2,474.4 L954.8,468.8 L953.7,468.5 L946.7,473.9 L954.5,482.3 L942.6,486.6 L950.4,495.1 L939.2,499.5 L948.3,508.3 L937.8,512.9 L946.8,521.6 L941.2,527.2 Z" fill="#4a3b2c" stroke="#2f241a" stroke-width="0.8" stroke-linejoin="round"/>
<text x="988.0" y="494.0" font-size="10.5" fill="#5a524a" font-weight="700">fissure · סדק</text>
<text x="988.0" y="507.1" font-size="10.5" fill="#5a524a">text shown, Puech</text>
<circle cx="1178.0" cy="498.0" r="9.0" fill="#4a3b2c" stroke="#2f241a" stroke-width="1"/>
<text x="1198.0" y="494.0" font-size="10.5" fill="#5a524a" font-weight="700">hole</text>
<text x="1198.0" y="507.1" font-size="10.5" fill="#5a524a">Lurie</text>
<text x="908.0" y="542.0" font-size="11" fill="#5a524a">Either way the feature lies east of the reservoir; only its kind</text>
<text x="908.0" y="556.5" font-size="11" fill="#5a524a">changes.</text>
<rect x="890.0" y="620.0" width="470.0" height="270.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="644.0" font-size="14" fill="#2a2420" font-weight="700">Which reservoir is “Solomon's”?</text>
<rect x="904.0" y="862.0" width="94.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="875.0" font-size="10.5" fill="#5f574e" font-weight="600">Placement only</text>
<circle cx="912.0" cy="662.0" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="666.0" font-size="11.5" fill="#5a524a">Milik 1960: a Qumran reservoir excavated by de Vaux, “undoubtedly” the</text>
<text x="922.0" y="681.2" font-size="11.5" fill="#5a524a">cistern south-east of the site.</text>
<circle cx="912.0" cy="698.4" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="702.4" font-size="11.5" fill="#5a524a">Milik 1962; Høgenhaven: a legendary name, given a generation or more</text>
<text x="922.0" y="717.5" font-size="11.5" fill="#5a524a">after 68 CE.</text>
<circle cx="912.0" cy="734.7" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="738.7" font-size="11.5" fill="#5a524a">Lefkovits: records the parallel with Solomon's Pool in Jerusalem.</text>
<circle cx="912.0" cy="755.9" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="759.9" font-size="11.5" fill="#5a524a">Puech 2015 spells the word אשוח; Milik's אשיח is a variant spelling.</text>
<text x="908.0" y="785.1" font-size="11.5" fill="#2a2420">Whichever basin is meant, the plan is the same: the fissure lies in its</text>
<text x="908.0" y="800.3" font-size="11.5" fill="#2a2420">east quarter.</text>
<rect x="40.0" y="910.0" width="1320.0" height="174.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Text (V 5–7)</text>
<text x="60.0" y="953.0" font-size="11.5" fill="#5a524a">“In the fissure that is in Secacah, east of the Reservoir of Solomon: vessels of offering, and their</text>
<text x="60.0" y="968.2" font-size="11.5" fill="#5a524a">record beside them.”</text>
<text x="60.0" y="991.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="1008.4" font-size="11.5" fill="#5a524a">“East of” is the 90° quarter centred on east, seen from the reservoir; the fissure also lies inside</text>
<text x="60.0" y="1023.5" font-size="11.5" fill="#5a524a">Sekakah. Distance, reservoir size and Sekakah's extent are not given. The closing phrase is read as</text>
<text x="60.0" y="1038.7" font-size="11.5" fill="#5a524a">the text shown has it (kaf): a record lying with the vessels.</text>
<text x="700.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="953.0" font-size="11.5" fill="#5a524a">Best-supported, medium: Kh. Qumran (preferred, medium). Neither the reservoir name nor the eastern</text>
<text x="700.0" y="968.2" font-size="11.5" fill="#5a524a">fissure is established. Comparisons on file: tunnel openings east of Ilan–Amit basin 2, or a fissure</text>
<text x="700.0" y="983.4" font-size="11.5" fill="#5a524a">east of a settlement reservoir (entry21_feature_comparison.md).</text>
<text x="700.0" y="1006.5" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1023.5" font-size="11.5" fill="#5a524a">Kh. Qumran had a large reservoir and channel system, and natural cracks in the surrounding marl show</text>
<text x="700.0" y="1038.7" font-size="11.5" fill="#5a524a">1st c. BCE–1st c. CE activity; no source names any reservoir “Solomon's” (phase5_assessments.csv).</text>
<text x="700.0" y="1053.9" font-size="11.5" fill="#5a524a">Identify a period reservoir first, then test its east side (feature_constraints.csv).</text>
</svg>
