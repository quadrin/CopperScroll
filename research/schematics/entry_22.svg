<rect width="1400" height="1100" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 22 (V 5–7) — the fissure east of the Reservoir of Solomon</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="790.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: a fissure in Sekakah, east of the Reservoir of Solomon</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives a direction (east of the reservoir) but no distance; Sekakah's extent and the</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">reservoir's shape are not given. The fissure is drawn at one place in the east quarter.</text>
