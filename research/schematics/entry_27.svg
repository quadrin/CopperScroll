<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 27 (VI 11–13) — the resting place of the Queen</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; the building's form and size are not given. “West side” is drawn as the western quarter.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: a resting place (tomb), dig on its west side</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">משכן taken in the tomb sense the project translation gives, “resting place”.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">Inside or outside its walls on the west is not stated.</text>
<rect x="54.0" y="782.0" width="181.6" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="795.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading (tomb sense)</text>
