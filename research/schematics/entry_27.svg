<text x="263.0" y="361.0" font-size="12.5" fill="#2a2420" font-weight="700">resting place of the Queen</text>
<text x="263.0" y="376.6" font-size="12.5" fill="#2a2420">במשכן המלכא</text>
<path d="M220.0,473 L234.0,487 M234.0,473 L220.0,487" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="132.0" y="516.0" font-size="12" fill="#8e2e22" font-weight="700">dig 12 cubits ≈ 6 m</text>
<text x="132.0" y="531.0" font-size="12" fill="#8e2e22">27 talents</text>
<path d="M88,214 L96,246 L88,240 L80,246 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
