<circle cx="1028.0" cy="291.0" r="92.0" fill="none" stroke="#6f6a64" stroke-width="1.3"/>
<line x1="1028.0" y1="291.0" x2="1093.1" y2="225.9" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="1028.0" y1="291.0" x2="1093.1" y2="356.1" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="1028.0" y1="291.0" x2="962.9" y2="356.1" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="1028.0" y1="291.0" x2="962.9" y2="225.9" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="991.0" y="254.0" width="74.0" height="74.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M991.0,254.0 L1065.0,254.0 L1065.0,328.0 L991.0,328.0 L991.0,254.0" fill="none" stroke="#7d7264" stroke-width="5" stroke-linejoin="miter"/>
<path d="M991.0,278.7 L1065.0,278.7" fill="none" stroke="#7d7264" stroke-width="3" stroke-linejoin="miter"/>
<path d="M1015.7,254.0 L1015.7,278.7" fill="none" stroke="#7d7264" stroke-width="3" stroke-linejoin="miter"/>
<path d="M1040.3,254.0 L1040.3,278.7" fill="none" stroke="#7d7264" stroke-width="3" stroke-linejoin="miter"/>
<text x="1028.0" y="305.8" font-size="10.5" fill="#8d8780" text-anchor="middle" font-style="italic">court</text>
<path d="M965,292.0 L975,302.0 M975,292.0 L965,302.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1140.0" y="283.0" font-size="11.5" fill="#2a2420" font-weight="700">west side of the house,</text>
<text x="1140.0" y="299.0" font-size="11" fill="#8e2e22" font-weight="600">dig 12 cubits</text>
<rect x="890.0" y="460.0" width="470.0" height="350.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="484.0" font-size="14" fill="#2a2420" font-weight="700">Readings that leave the plan unchanged</text>
<rect x="904.0" y="782.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="906.0" y="510.0" font-size="11.5" fill="#2a2420" font-weight="700">Letters:</text>
<text x="986.0" y="510.0" font-size="11.5" fill="#5a524a">secure: Puech and Lefkovits print the same משכן המלכא.</text>
<text x="906.0" y="533.2" font-size="11.5" fill="#2a2420" font-weight="700">The queen:</text>
<text x="986.0" y="533.2" font-size="11.5" fill="#5a524a">not identified; the lexicon rates “the queen” medium.</text>
<text x="986.0" y="548.4" font-size="11.5" fill="#5a524a">Josephus's queen references all concern Helena of</text>
<text x="986.0" y="563.5" font-size="11.5" fill="#5a524a">Adiabene.</text>
<text x="906.0" y="586.7" font-size="11.5" fill="#2a2420" font-weight="700">Place:</text>
<text x="986.0" y="586.7" font-size="11.5" fill="#5a524a">the Jericho area or the Tombs of the Kings in</text>
<text x="986.0" y="601.9" font-size="11.5" fill="#5a524a">Jerusalem: placement only.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (VI 11–13)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the resting place of the Queen, on the west side, dig twelve cubits: 27 talents.”</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">A built tomb, in the translation's sense. The west side is the western quarter of the building;</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">inside or outside is open. Twelve cubits is a depth.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Atlas: possible only, low. The Jericho oasis (town or district) and the Tombs of the Kings in</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">Jerusalem (tomb of Helena of Adiabene), both possible (low).</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No phase-5 assessment or feature constraint is recorded for entry 27. Helena's monuments stood north</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">of Jerusalem (Josephus; landmark_lexicon_index.csv); no building is identified.</text>
</svg>
