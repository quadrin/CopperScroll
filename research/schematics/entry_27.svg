<rect x="678.0" y="330.0" width="40.0" height="180.0" fill="#f7f2e8" stroke="#7d7264" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M692,494.0 L704,506.0 M704,494.0 L692,506.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="648.0" y1="330.0" x2="648.0" y2="510.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="653.0" y1="330.0" x2="643.0" y2="330.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="653.0" y1="510.0" x2="643.0" y2="510.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="638.0" y="420.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 638.0 420.0)">12 cubits ≈ 6 m</text>
<text x="622.0" y="576.0" font-size="11" fill="#5a524a">Drawn outside the wall; it could</text>
<text x="622.0" y="589.8" font-size="11" fill="#5a524a">as well be inside. Taken as a</text>
<text x="622.0" y="603.5" font-size="11" fill="#5a524a">depth; 1 cubit ≈ 0.5 m.</text>
<rect x="890.0" y="100.0" width="470.0" height="350.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: a dwelling or enclosure</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">The files also allow משכן as a dwelling or enclosure</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">(no editor named); the atlas calls it the queen's residence.</text>
<rect x="904.0" y="422.0" width="218.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="435.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative sense · research files</text>
