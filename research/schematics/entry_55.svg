<text x="475.0" y="306.0" font-size="11.5" fill="#245b82" font-weight="700" text-anchor="middle">“in the reservoir”</text>
<text x="475.0" y="322.0" font-size="11" fill="#245b82" text-anchor="middle">drawn in this one; the text</text>
<text x="475.0" y="336.0" font-size="11" fill="#245b82" text-anchor="middle">does not say which</text>
