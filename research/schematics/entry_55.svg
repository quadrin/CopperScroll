<line x1="556.0" y1="504.0" x2="618.0" y2="464.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="622.0" y="460.0" font-size="12" fill="#8e2e22" font-weight="700">× on the right of it:</text>
<text x="622.0" y="475.0" font-size="12" fill="#8e2e22">vessels of offering,</text>
<text x="622.0" y="490.0" font-size="12" fill="#8e2e22">eleven(?)</text>
<line x1="557.0" y1="530.0" x2="618.0" y2="538.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="622.0" y="542.0" font-size="12" fill="#2a2420" font-weight="700">their record</text>
<text x="622.0" y="557.0" font-size="12" fill="#2a2420">beside them</text>
<text x="622.0" y="264.0" font-size="11" fill="#8d8780" font-weight="600">The precinct, the pier</text>
<text x="622.0" y="277.8" font-size="11" fill="#8d8780">and all sizes are</text>
<text x="622.0" y="291.5" font-size="11" fill="#8d8780">schematic. Rotate the</text>
<text x="622.0" y="305.2" font-size="11" fill="#8d8780">plan and the deposit</text>
<text x="622.0" y="319.0" font-size="11" fill="#8d8780">turns with the entrance.</text>
<text x="74.0" y="782.0" font-size="10.5" fill="#8d8780" font-style="italic">no measurement in the text</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Milik, Puech 2015: its smallest basin</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">לימומית: the smallest basin, which one can enter. The</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">atlas landmark follows this. Plates: not resolved.</text>
<rect x="904.0" y="302.0" width="231.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading · atlas landmark</text>
<rect x="938.0" y="189.0" width="90.0" height="80.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.4"/>
