<path d="M1154,237.8 q4.0,-4 8.0,0 t8.0,0 t8.0,0" fill="none" stroke="#5d8fb3" stroke-width="0.8" stroke-linejoin="round"/>
<path d="M1159,224.0 L1169,234.0 M1169,224.0 L1159,234.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1200.0" y="219.0" font-size="11" fill="#2a2420" font-weight="700">smallest basin</text>
<text x="1200.0" y="232.8" font-size="11" fill="#2a2420">deposit in it</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Lefkovits 2000: “the basin, three cubits”</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">A basin and a measure in place of “the smallest basin”.</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">What the 3 cubits measure is not stated in the files.</text>
<rect x="904.0" y="542.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<rect x="938.0" y="435.0" width="190.0" height="68.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.4"/>
<path d="M948,455.4 q19.0,-4 38.0,0 t38.0,0 t38.0,0" fill="none" stroke="#5d8fb3" stroke-width="0.8" stroke-linejoin="round"/>
<path d="M1063,462.0 L1073,472.0 M1073,462.0 L1063,472.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="1068.0" y1="489.0" x2="1128.0" y2="489.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="1068.0" y1="484.0" x2="1068.0" y2="494.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="1128.0" y1="484.0" x2="1128.0" y2="494.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="1098.0" y="485.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle"></text>
<text x="1148.0" y="459.0" font-size="11" fill="#8e2e22" font-weight="700">3 cubits ≈ 1.5 m from</text>
<text x="1148.0" y="472.8" font-size="11" fill="#8e2e22">the edge: one possible</text>
<text x="1148.0" y="486.5" font-size="11" fill="#8e2e22">sense, not to scale</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">The name: “two reservoirs” or Bethesda?</text>
<rect x="904.0" y="782.0" width="194.0" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the name, not the plan</text>
<text x="904.0" y="630.0" font-size="11.5" fill="#5a524a">Puech 2006 and Lefkovits: בית האשוחין, the house of the</text>
<text x="904.0" y="647.0" font-size="11.5" fill="#5a524a">two reservoirs. Milik 1962 emends to בית אשדתין,</text>
<text x="904.0" y="664.0" font-size="11.5" fill="#5a524a">Bet Eshdatain = Bethesda. The plates lean to ח, not ת,</text>
<text x="904.0" y="681.0" font-size="11.5" fill="#5a524a">so Milik's name needs at least one correction (Q26).</text>
<text x="904.0" y="698.0" font-size="11.5" fill="#5a524a">Allegro, Luria and Wolters read lw mymwt at XI 13 (no</text>
<text x="904.0" y="715.0" font-size="11.5" fill="#5a524a">gloss in the files). Either way the text describes a</text>
<text x="904.0" y="732.0" font-size="11.5" fill="#5a524a">double pool.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (XI 12–15)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the House of the Two Reservoirs, in the reservoir, as you go in, on the right of it: vessels of</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">offering, eleven(?). Their record beside them.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">Two reservoirs side by side, entered by steps; the deposit is in one of them, on the right of the way</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">in. No compass direction or distance is given, so orientation and sizes are arbitrary.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Best-supported, medium: Pools of Bethesda (St Anne's). Only Milik's emended name gives Bethesda, and</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">the Sisters of Sion twin pool nearby prevents a unique match on the feature alone.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">The plates lean to ח, not ת: the Bethesda name is weakened, the twin-pool description stands</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">(feature_constraints.csv). The small accessible basin is not established as a scroll feature, pending</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">the excavation reports (phase5_assessments.csv).</text>
</svg>
