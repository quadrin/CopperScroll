<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 55 (XI 12–15) — the house of the two pools</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up (orientation arbitrary: the text gives no compass direction). Generic twin reservoir; not the plan of any real pool.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: in the reservoir, on the right as you go in</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">Two reservoirs side by side; the deposit is in one of them (which one is not stated), on the</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">right-hand side of the way in. “Right” is relative to the person entering, not a compass point.</text>
<rect x="60.0" y="174.0" width="790.0" height="622.0" fill="#f7f3ec" stroke="#d6cfc4" stroke-width="0.8"/>
