<line x1="938.0" y1="204.0" x2="938.0" y2="238.0" stroke="#8a5a17" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="1198.0" y="190.0" font-size="11.5" fill="#5a524a">Puech rejects “Hyrcania”</text>
<text x="1198.0" y="204.4" font-size="11.5" fill="#5a524a">as too long for the gap.</text>
<text x="1198.0" y="218.8" font-size="11.5" fill="#5a524a">No Koḥlit pool, entrance</text>
<text x="1198.0" y="233.1" font-size="11.5" fill="#5a524a">or phase is identified.</text>
<rect x="890.0" y="330.0" width="470.0" height="220.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="354.0" font-size="14" fill="#2a2420" font-weight="700">Variant: “to Hyrcania” (Eshel 2002)</text>
<text x="904.0" y="374.0" font-size="11.5" fill="#5a524a">Hyrcania's northern aqueduct; the measure starts where</text>
<text x="904.0" y="390.0" font-size="11.5" fill="#5a524a">the trail meets it, west of Hyrcania. 41 cubits.</text>
