<text x="1223.0" y="422.0" font-size="11.5" fill="#5a524a">Eshel: the</text>
<text x="1223.0" y="436.4" font-size="11.5" fill="#5a524a">restoration assumes</text>
<text x="1223.0" y="450.8" font-size="11.5" fill="#5a524a">a geographical order</text>
<text x="1223.0" y="465.1" font-size="11.5" fill="#5a524a">in the list.</text>
<rect x="890.0" y="560.0" width="470.0" height="220.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="584.0" font-size="14" fill="#2a2420" font-weight="700">The figure: 14, 40 or 41 cubits</text>
<text x="904.0" y="604.0" font-size="11.5" fill="#5a524a">Only “four” survives; the editions restore the rest.</text>
<text x="904.0" y="620.0" font-size="11.5" fill="#5a524a">Same start, same scale; the deposit moves along the conduit.</text>
<rect x="904.0" y="752.0" width="88.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="765.0" font-size="10.5" fill="#5f574e" font-weight="600">Distance only</text>
<text x="912.0" y="642.0" font-size="11" fill="#8e2e22" font-weight="600">14 cubits ≈ 7 m · Puech</text>
<line x1="912.0" y1="654.0" x2="1038.0" y2="654.0" stroke="#8e2e22" stroke-width="1.2"/>
