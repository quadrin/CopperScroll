<text x="646.0" y="420.0" font-size="12" fill="#8e2e22" font-weight="700" text-anchor="end">silver, 55 talents</text>
<text x="300.0" y="324.0" font-size="12" fill="#245b82" font-weight="700">conduit · אמא</text>
<path d="M790,204 L798,236 L790,230 L782,236 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
