<text x="406.0" y="352.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle">41 cubits ≈ 20.5 m (restored)</text>
<line x1="652.0" y1="350.0" x2="652.0" y2="384.0" stroke="#b9b2a8" stroke-width="0.8" stroke-dasharray="3 3"/>
