<path d="M80.0,390.0 L744.0,390.0" fill="none" stroke="#cfe1ee" stroke-width="16" stroke-linejoin="round"/>
<line x1="682.0" y1="390.0" x2="722.0" y2="390.0" stroke="#245b82" stroke-width="1.4" marker-end="url(#ah-blue)"/>
<rect x="744.0" y="344.0" width="72.0" height="92.0" fill="#f6f3ee" stroke="#8d8780" stroke-width="1.3" rx="4" stroke-dasharray="5 4"/>
<text x="780.0" y="396.0" font-size="18" fill="#8d8780" font-weight="700" text-anchor="middle">◦◦</text>
<text x="780.0" y="462.0" font-size="11.5" fill="#8d8780" font-weight="700" text-anchor="middle">goal lost</text>
<text x="780.0" y="476.4" font-size="11.5" fill="#8d8780" text-anchor="middle">“comes in ◦◦”</text>
<line x1="160.0" y1="356.0" x2="160.0" y2="410.0" stroke="#8a5a17" stroke-width="1.4" stroke-dasharray="3 3"/>
