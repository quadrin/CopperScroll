<text x="975.0" y="650.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle"></text>
<text x="912.0" y="678.0" font-size="11" fill="#245b82" font-weight="600">40 cubits ≈ 20 m · Lefkovits</text>
<line x1="912.0" y1="690.0" x2="1272.0" y2="690.0" stroke="#245b82" stroke-width="1.2"/>
<line x1="912.0" y1="685.0" x2="912.0" y2="695.0" stroke="#245b82" stroke-width="1.2"/>
<line x1="1272.0" y1="685.0" x2="1272.0" y2="695.0" stroke="#245b82" stroke-width="1.2"/>
<text x="1092.0" y="686.0" font-size="11" fill="#245b82" font-weight="600" text-anchor="middle"></text>
<text x="912.0" y="714.0" font-size="11" fill="#2a2420" font-weight="600">41 cubits ≈ 20.5 m · Milik 1962, Eshel</text>
<line x1="912.0" y1="726.0" x2="1281.0" y2="726.0" stroke="#2a2420" stroke-width="1.2"/>
<line x1="912.0" y1="721.0" x2="912.0" y2="731.0" stroke="#2a2420" stroke-width="1.2"/>
<line x1="1281.0" y1="721.0" x2="1281.0" y2="731.0" stroke="#2a2420" stroke-width="1.2"/>
<text x="1096.5" y="722.0" font-size="11" fill="#2a2420" font-weight="600" text-anchor="middle"></text>
<rect x="890.0" y="790.0" width="470.0" height="220.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="814.0" font-size="14" fill="#2a2420" font-weight="700">Depth or distance?</text>
<text x="904.0" y="834.0" font-size="11.5" fill="#5a524a">Whether a bare number after “as you go in” is a depth is</text>
<text x="904.0" y="850.0" font-size="11.5" fill="#5a524a">disputed (Milik DJD; Lefkovits p. 161); Puech: distance.</text>
<rect x="904.0" y="982.0" width="113.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="995.0" font-size="10.5" fill="#5f574e" font-weight="600">Section, not plan</text>
<line x1="906.0" y1="886.0" x2="1098.0" y2="886.0" stroke="#7d7264" stroke-width="2"/>
<rect x="906.0" y="886.0" width="192.0" height="86.0" fill="url(#earth)" stroke="none" stroke-width="1.0" fill-opacity="0.7"/>
<text x="910.0" y="880.0" font-size="10.5" fill="#8d8780">surface</text>
<line x1="958.0" y1="890.0" x2="958.0" y2="966.0" stroke="#8e2e22" stroke-width="1.3" marker-end="url(#ah-red)"/>
<text x="968.0" y="936.0" font-size="11" fill="#8e2e22" font-weight="600">a depth below the entrance?</text>
<text x="1128.0" y="890.0" font-size="11.5" fill="#5a524a">If a depth, the deposit lies</text>
<text x="1128.0" y="906.0" font-size="11.5" fill="#5a524a">below, not along, the conduit.</text>
<text x="1128.0" y="922.0" font-size="11.5" fill="#5a524a">The text shown reads distance.</text>
<rect x="40.0" y="1030.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="1056.0" font-size="13" fill="#2a2420" font-weight="700">Text (IV 3–5)</text>
<text x="60.0" y="1073.0" font-size="11.5" fill="#5a524a">“In the conduit that comes in ◦◦, as you go in, forty-one cubits: silver, 55 talents.”</text>
<text x="60.0" y="1096.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="1113.2" font-size="11.5" fill="#5a524a">The goal of the conduit is lost. The 41 cubits (Milik's restoration) run along the conduit from where</text>
<text x="60.0" y="1128.4" font-size="11.5" fill="#5a524a">one enters it. No direction is given, so the orientation is arbitrary; open or covered is not stated.</text>
<text x="700.0" y="1056.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="1073.0" font-size="11.5" fill="#5a524a">Possible only, low (atlas). Candidates: Tell es-Sultan (possible, low; Koḥlit by Puech's context) and</text>
<text x="700.0" y="1088.2" font-size="11.5" fill="#5a524a">Hyrcania / Kh. el-Mird and its aqueducts (possible, low; Eshel). No place name survives here.</text>
<text x="700.0" y="1111.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1128.4" font-size="11.5" fill="#5a524a">Channels from the spring below Tell es-Sultan are undated; dated Hasmonean–Herodian conduits served</text>
<text x="700.0" y="1143.5" font-size="11.5" fill="#5a524a">the palaces to the south. Hyrcania's aqueducts are 1st c. BCE, but the link rests on Eshel's</text>
<text x="700.0" y="1158.7" font-size="11.5" fill="#5a524a">restoration (phase5_assessments.csv).</text>
</svg>
