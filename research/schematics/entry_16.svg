<text x="156.0" y="476.4" font-size="11.5" fill="#8a5a17">measured from here</text>
<line x1="160.0" y1="356.0" x2="652.0" y2="356.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="160.0" y1="351.0" x2="160.0" y2="361.0" stroke="#8e2e22" stroke-width="1.2"/>
