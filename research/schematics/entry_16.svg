<rect x="160.0" y="520.0" width="120.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="280.0" y="520.0" width="120.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="160.0" y="540.0" font-size="11" fill="#2a2420">0</text>
<text x="400.0" y="540.0" font-size="11" fill="#2a2420" text-anchor="middle">10 m</text>
<text x="160.0" y="556.0" font-size="10.5" fill="#8d8780">Drawn to scale along the conduit: 1 cubit taken as about 0.5 m</text>
<rect x="56.0" y="640.0" width="798.0" height="300.0" fill="#faf8f4" stroke="#d6cfc4" stroke-width="1" rx="6"/>
<text x="72.0" y="666.0" font-size="13" fill="#2a2420" font-weight="700">The words that carry the geometry</text>
<text x="72.0" y="700.0" font-size="11.5" fill="#2a2420" font-weight="700">in the conduit · אמא</text>
<text x="278.0" y="700.0" font-size="11.5" fill="#5a524a">a water conduit or channel (lexicon: high). Open or covered is not stated.</text>
<text x="72.0" y="728.0" font-size="11.5" fill="#2a2420" font-weight="700">that comes in ◦◦ · הבאה</text>
<text x="278.0" y="728.0" font-size="11.5" fill="#5a524a">the conduit's goal stood in the lacuna: Puech “to the pool(?)”,</text>
<text x="278.0" y="756.0" font-size="11.5" fill="#5a524a">Eshel “to Hyrcania”, Milik and Lefkovits leave it blank.</text>
<text x="72.0" y="794.0" font-size="11.5" fill="#2a2420" font-weight="700">as you go in · בביאתך</text>
<text x="278.0" y="794.0" font-size="11.5" fill="#5a524a">the measure starts where one enters; the entrance is not described.</text>
<text x="72.0" y="822.0" font-size="11.5" fill="#2a2420" font-weight="700">forty-one cubits</text>
<text x="278.0" y="822.0" font-size="11.5" fill="#5a524a">only “four” survives: 14 (Puech), 40 (Lefkovits), 41 (Milik 1962, Eshel).</text>
<text x="278.0" y="850.0" font-size="11.5" fill="#5a524a">Distance or depth is also disputed (Milik DJD; Lefkovits p. 161).</text>
<text x="72.0" y="922.0" font-size="11.5" fill="#8d8780" font-style="italic">No place name survives in this entry.</text>
<rect x="890.0" y="100.0" width="470.0" height="220.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: “to the pool(?)”, 14 cubits (Puech)</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Puech restores the goal as a pool and reads 14 cubits,</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">a distance (he excludes depth); Koḥlit from context.</text>
<rect x="904.0" y="292.0" width="243.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="305.0" font-size="10.5" fill="#5f574e" font-weight="600">Puech 2006, 2015 · alternative reading</text>
