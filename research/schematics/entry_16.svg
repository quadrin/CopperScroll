<rect width="1400" height="1200" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 16 (IV 3–5) — the entering conduit</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan; the text gives no direction, so the orientation is arbitrary. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="910.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: in the conduit, forty-one cubits as you go in</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives no direction, so the orientation is arbitrary. The conduit's goal is lost (◦◦).</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">41 cubits is Milik's restoration (only “four” survives), measured along the conduit from its entrance.</text>
<rect x="56.0" y="260.0" width="96.0" height="260.0" fill="url(#earth)" stroke="none" stroke-width="1.0" fill-opacity="0.8"/>
<text x="64.0" y="282.0" font-size="11.5" fill="#5a524a" font-style="italic">outside</text>
