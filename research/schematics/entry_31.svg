<text x="922.0" y="694.0" font-size="11.5" fill="#5a524a">Milik 1962; Eshel 2002; Puech 2015: the Hasmonean fortress on the</text>
<text x="922.0" y="709.2" font-size="11.5" fill="#5a524a">summit of Jebel Qarantal.</text>
<circle cx="912.0" cy="726.4" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="730.4" font-size="11.5" fill="#5a524a">Puech 2006: Doq north-west of Jericho, the spring area of ʿAin Duk.</text>
<circle cx="912.0" cy="747.5" r="2.2" fill="#5a524a" stroke="none" stroke-width="1.0"/>
<text x="922.0" y="751.5" font-size="11.5" fill="#5a524a">SWP: Kh. Abu Lahm.</text>
<text x="908.0" y="776.7" font-size="11.5" fill="#2a2420">These move the building on the map; the plan of the corner is the same.</text>
<rect x="40.0" y="910.0" width="1320.0" height="174.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Text (VII 11–13)</text>
<text x="60.0" y="953.0" font-size="11.5" fill="#5a524a">“At Doq, under the corner of the guard post, the eastern one, dig seven cubits: 22 talents.”</text>
<text x="60.0" y="976.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="993.2" font-size="11.5" fill="#5a524a">“The eastern one” goes with the corner: the corner lying in the east quarter (45°–135°) seen from the</text>
<text x="60.0" y="1008.4" font-size="11.5" fill="#5a524a">building's centre. Size, shape and turn of the building are not given; it is drawn turned 30°. The</text>
<text x="60.0" y="1023.5" font-size="11.5" fill="#5a524a">seven cubits are dug under that corner.</text>
<text x="700.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="953.0" font-size="11.5" fill="#5a524a">Best-supported, medium. Doq: Jebel Qarantal (preferred, medium); ʿAin Duk springs (possible, low).</text>
<text x="700.0" y="968.2" font-size="11.5" fill="#5a524a">The surviving name does not tell summit from spring (Q24); the exact installation and corner are</text>
<text x="700.0" y="983.4" font-size="11.5" fill="#5a524a">unidentified.</text>
<text x="700.0" y="1006.5" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1023.5" font-size="11.5" fill="#5a524a">A Hasmonean fortress with an aqueduct and rock-cut cisterns is reported on the summit; on Puech's</text>
<text x="700.0" y="1038.7" font-size="11.5" fill="#5a524a">“drying room” no such installation is reported (phase5_assessments.csv). The plates lean to hmšṭḥ,</text>
<text x="700.0" y="1053.9" font-size="11.5" fill="#5a524a">not decisively (feature_constraints.csv).</text>
</svg>
