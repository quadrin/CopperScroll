<text x="1128.0" y="210.0" font-size="11" fill="#5a524a" font-weight="700">drying floor or room · המשטח</text>
<text x="1128.0" y="223.8" font-size="11" fill="#5a524a">eastern corner: dig 7 cubits</text>
<text x="1128.0" y="237.5" font-size="11" fill="#5a524a">no such installation is reported</text>
<text x="1128.0" y="251.2" font-size="11" fill="#5a524a">at the summit fortress</text>
<rect x="890.0" y="386.0" width="470.0" height="252.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="410.0" font-size="14" fill="#2a2420" font-weight="700">A corner of the eastern guard post</text>
<text x="904.0" y="430.0" font-size="11.5" fill="#5a524a">Lefkovits's second syntax: “eastern” describes the post, so there</text>
<text x="904.0" y="446.0" font-size="11.5" fill="#5a524a">are several posts. Which corner of the eastern one is not fixed.</text>
