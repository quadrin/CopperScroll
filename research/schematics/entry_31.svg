<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 31 (VII 11–13) — under the eastern corner at Doq</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="790.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: under the eastern corner of the guard post (Milik, Lefkovits)</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">“The eastern one” is taken with the corner. For a single corner to be eastern, the building is drawn</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">turned so that one corner falls in the east quarter (45°–135°) seen from its centre.</text>
<text x="64.0" y="194.0" font-size="13" fill="#2a2420" font-weight="700">At Doq · דוק</text>
<text x="64.0" y="210.0" font-size="10.5" fill="#8d8780">where at Doq is not given; building size and turn are not given</text>
