 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 37 (VIII 14–16) — Shaveh's irrigated land</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan and section. The text gives no direction, so the plan has no north arrow. One arrangement the text allows; not a real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="695.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: the chamber in the enclosure of the Shaveh</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">“Enclosure” reads the letters בדור as the project text has them, which are Beyer’s; glossary: דור “enclosure”.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">“Chamber” is Puech’s emendation of the engraved בצויח. Position and size are not given.</text>
<rect x="54.0" y="767.0" width="101.0" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="780.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading</text>
<path d="M60.0,310.0 L200.0,370.0 L340.0,470.0 L490.0,600.0" fill="none" stroke="#d7cbb3" stroke-width="16" stroke-linejoin="round"/>
<path d="M60.0,310.0 L200.0,370.0 L340.0,470.0 L490.0,600.0" fill="none" stroke="#b8a888" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text x="70.0" y="284.0" font-size="12" fill="#7d6a4a" font-weight="700" font-style="italic">the Shaveh · השוא, a valley; course arbitrary</text>
<ellipse cx="290.0" cy="440.0" rx="130" ry="90" fill="#f4efe6" stroke="#7d7264" stroke-width="7"/>
<text x="290.0" y="384.0" font-size="13" fill="#2a2420" font-weight="700" text-anchor="middle">enclosure · דור</text>
<text x="290.0" y="400.0" font-size="10.5" fill="#8d8780" text-anchor="middle" font-style="italic">shape not given</text>
<rect x="283.0" y="439.0" width="34.0" height="34.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.6" stroke-dasharray="5 3"/>
<path d="M294,450 L306,462 M306,450 L294,462" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="324.0" y="452.0" font-size="12" fill="#2a2420" font-weight="700">chamber · צריח</text>
<text x="324.0" y="468.0" font-size="11" fill="#5a524a">“that is in it”</text>
<text x="170.0" y="568.0" font-size="11.5" fill="#8e2e22" font-weight="600">in the chamber, dig 11 cubits ≈ 5.5 m:</text>
<text x="170.0" y="582.4" font-size="11.5" fill="#8e2e22">silver, 70 talents</text>
<text x="60.0" y="749.0" font-size="11" fill="#8d8780">Plan not to scale; the section is to scale in depth. Dashed outline: below ground.</text>
<rect x="520.0" y="200.0" width="330.0" height="512.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="1" rx="4"/>
<text x="532.0" y="222.0" font-size="12.5" fill="#2a2420" font-weight="700">Section through the chamber</text>
<text x="532.0" y="238.0" font-size="11" fill="#8d8780">depth to scale; 1 cubit ≈ 0.5 m</text>
<text x="532.0" y="254.0" font-size="11" fill="#8d8780">chamber depth not given: drawn shallow</text>
<rect x="521.0" y="320.0" width="328.0" height="322.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="521.0" y1="320.0" x2="849.0" y2="320.0" stroke="#2a2420" stroke-width="1.4"/>
<rect x="534.0" y="294.0" width="12.0" height="26.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<rect x="824.0" y="294.0" width="12.0" height="26.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<text x="550.0" y="312.0" font-size="10.5" fill="#5a524a" font-style="italic">enclosure wall</text>
<rect x="618.6" y="326.0" width="80.0" height="34.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="704.6" y="348.0" font-size="10.5" fill="#3f3226" font-weight="600">chamber</text>
<rect x="646.6" y="360.0" width="24.0" height="242.0" fill="#fbf6ee" stroke="#8e2e22" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M652.6,588 L664.6,600 M664.6,588 L652.6,600" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="698.6" y1="360.0" x2="698.6" y2="602.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="703.6" y1="360.0" x2="693.6" y2="360.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="703.6" y1="602.0" x2="693.6" y2="602.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="688.6" y="481.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 688.6 481.0)"></text>
<text x="708.6" y="477.0" font-size="11.5" fill="#8e2e22" font-weight="700">dig 11 cubits</text>
<text x="708.6" y="491.4" font-size="11.5" fill="#8e2e22">≈ 5.5 m</text>
<text x="618.6" y="626.0" font-size="11" fill="#8e2e22" font-weight="600">silver, 70 talents</text>
<rect x="532.0" y="676.0" width="44.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="576.0" y="676.0" width="44.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="532.0" y="696.0" font-size="11" fill="#2a2420">0</text>
<text x="620.0" y="696.0" font-size="11" fill="#2a2420" text-anchor="middle">2 m</text>
<rect x="890.0" y="100.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Milik, Puech 2015: irrigated land · ברוי</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Puech: “the low irrigated part” of the Shaveh, the counterpart</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">of entry 36’s fallow ground (2015 p. 74).</text>
<rect x="904.0" y="297.0" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="310.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading · atlas title</text>
<path d="M912.0,186.0 L972.0,236.0 L992.0,258.0 L1042.0,260.0 L1062.0,238.0 L1122.0,190.0 L1122.0,279.0 L912.0,279.0 Z" fill="url(#earth)" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<path d="M912.0,186.0 L972.0,236.0 L992.0,258.0 L1042.0,260.0 L1062.0,238.0 L1122.0,190.0" fill="none" stroke="#2a2420" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="992.0" y1="258.0" x2="1042.0" y2="260.0" stroke="#5f8a52" stroke-width="5" opacity="0.7"/>
<text x="1017.0" y="250.0" font-size="10" fill="#5f8a52" font-weight="600" text-anchor="middle">irrigated</text>
<text x="1017.0" y="200.0" font-size="10" fill="#8d8780" text-anchor="middle">fallow slopes, entry 36</text>
<rect x="1008.0" y="266.0" width="18.0" height="12.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.2" stroke-dasharray="4 2"/>
<path d="M1013,268 L1021,276 M1021,268 L1013,276" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1140.0" y="186.0" font-size="11.5" fill="#5a524a">Low floor, irrigated; upper slope</text>
<text x="1140.0" y="200.4" font-size="11.5" fill="#5a524a">fallow. Irrigation needs water</text>
<text x="1140.0" y="214.8" font-size="11.5" fill="#5a524a">nearby: only the Kidron–Hinnom</text>
<text x="1140.0" y="229.1" font-size="11.5" fill="#5a524a">candidate has one reported</text>
<text x="1140.0" y="243.5" font-size="11.5" fill="#5a524a">(Wilson 1871).</text>
<rect x="890.0" y="335.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="359.0" font-size="14" fill="#2a2420" font-weight="700">Milik 1962, Puech earlier: a cippus</text>
<text x="904.0" y="379.0" font-size="11.5" fill="#5a524a">A boundary stone in place of the chamber (Milik p. 274).</text>
<text x="904.0" y="395.0" font-size="11.5" fill="#5a524a">The files do not choose between the two landmarks.</text>
<rect x="904.0" y="532.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="545.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<path d="M914.0,415.0 L1104.0,415.0 L1104.0,508.0 L914.0,508.0 Z" fill="url(#field)" stroke="#9aa77f" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M1003,475.5 L1004,446.5 Q1009,439.5 1014,446.5 L1015,475.5 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M1004,484.5 L1014,494.5 M1014,484.5 L1004,494.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1009.0" y="509.5" font-size="10.5" fill="#8e2e22" font-weight="600" text-anchor="middle">dig 11 cubits</text>
<text x="1130.0" y="425.0" font-size="11.5" fill="#5a524a">A marker standing in the irrigated</text>
<text x="1130.0" y="439.4" font-size="11.5" fill="#5a524a">land (Milik); the dig of eleven</text>
<text x="1130.0" y="453.8" font-size="11.5" fill="#5a524a">cubits starts at its foot. No</text>
<text x="1130.0" y="468.1" font-size="11.5" fill="#5a524a">chamber is involved.</text>
<rect x="890.0" y="570.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="594.0" font-size="14" fill="#2a2420" font-weight="700">Lefkovits 2000: Din, a place name · בדין</text>
<text x="904.0" y="614.0" font-size="11.5" fill="#5a524a">Lefkovits reads בדין, a place named Din (pp. 268–269):</text>
<text x="904.0" y="630.0" font-size="11.5" fill="#5a524a">no land type. Beyer’s bdwr is printed without a meaning.</text>
<rect x="904.0" y="767.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="780.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<path transform="translate(968.0,694.5) scale(1.467)" d="M-14,-6 C-15,-14 -5,-17 3,-16 C11,-15 16,-9 15,-1 C16,8 10,15 1,15 C-8,16 -16,10 -15,3 C-17,0 -14,-3 -14,-6 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="0.95"/>
<circle cx="968.0" cy="694.5" r="1.8" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="965.0" y="689.5" width="14.0" height="14.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.6" stroke-dasharray="5 3"/>
<path d="M968,692.5 L976,700.5 M976,692.5 L968,700.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="968.0" y="734.5" font-size="11" fill="#2a2420" font-weight="700" text-anchor="middle">Din</text>
<text x="1028.0" y="656.0" font-size="11.5" fill="#5a524a">The chamber lies in a named place;</text>
<text x="1028.0" y="670.4" font-size="11.5" fill="#5a524a">nothing ties it to fallow or watered</text>
<text x="1028.0" y="684.8" font-size="11.5" fill="#5a524a">ground, or to entry 36.</text>
<rect x="40.0" y="815.0" width="1320.0" height="169.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Text (VIII 14–16)</text>
<text x="60.0" y="858.0" font-size="11.5" fill="#5a524a">“In the enclosure of the Shaveh, in the chamber that is in it, dig eleven cubits: silver, 70</text>
<text x="60.0" y="873.2" font-size="11.5" fill="#5a524a">talents.”</text>
<text x="60.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.4" font-size="11.5" fill="#5a524a">An enclosure in the Shaveh with a chamber inside it. The text gives no direction, size or position,</text>
<text x="60.0" y="928.5" font-size="11.5" fill="#5a524a">so the layout is arbitrary and has no north arrow. The eleven cubits are drawn as a depth below the</text>
<text x="60.0" y="943.7" font-size="11.5" fill="#5a524a">chamber floor; the chamber’s own depth is not given.</text>
<text x="700.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="858.0" font-size="11.5" fill="#5a524a">Atlas: best-supported, low. Candidates: Valley of Shaveh / King’s Valley (which valley is</text>
<text x="700.0" y="873.2" font-size="11.5" fill="#5a524a">unresolved), preferred, low; el-Baqʿa plain SW of the Old City, possible, low.</text>
<text x="700.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="913.4" font-size="11.5" fill="#5a524a">phase5_assessments.csv: irrigated gardens are described below the Siloam pools, where the Tyropoeon,</text>
<text x="700.0" y="928.5" font-size="11.5" fill="#5a524a">Hinnom and Kidron meet (Wilson 1871 pp. 21–22), undated; none at el-Baqʿa. Both landmark words are</text>
<text x="700.0" y="943.7" font-size="11.5" fill="#5a524a">disputed and the valley is unfixed, so the verdict stays low.</text>
</svg>
