<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 58 (XII 6–7) — at the mouth of the spring of Beth Sham</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up by convention, with a side-view inset. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="708.1" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Main reading (all editions): the deposit at the mouth of the spring</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text names one feature, the mouth of the spring · פי המבוע, and gives no direction,</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">distance or depth. The drawing is kept minimal: any spring with a defined outlet fits.</text>
