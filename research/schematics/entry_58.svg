<text x="1134.0" y="230.0" font-size="11" fill="#5a524a">the deposit at the fountain's</text>
<text x="1134.0" y="243.8" font-size="11" fill="#5a524a">orifice, inside a built front.</text>
<text x="1134.0" y="257.5" font-size="11" fill="#5a524a">The “main fountain” he has in</text>
<text x="1134.0" y="271.2" font-size="11" fill="#5a524a">mind is known only from writers</text>
<text x="1134.0" y="285.0" font-size="11" fill="#5a524a">of the 4th–12th c. (DJD III</text>
<text x="1134.0" y="298.8" font-size="11" fill="#5a524a">pp. 261–262).</text>
<rect x="890.0" y="459.1" width="470.0" height="349.1" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="483.1" font-size="14" fill="#2a2420" font-weight="700">The name: Beth Sham, Beth Shean or Beth Shem?</text>
<text x="904.0" y="503.1" font-size="11.5" fill="#5a524a">The letters are agreed; only the place is disputed.</text>
<rect x="904.0" y="780.1" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="793.1" font-size="10.5" fill="#5f574e" font-weight="600">Changes the place, not the plan</text>
<text x="908.0" y="527.0" font-size="11.5" fill="#5a524a">• Milik 1960: Bet-Shan, Beth Shean. Milik 1962: Bet Šam.</text>
<text x="908.0" y="546.2" font-size="11.5" fill="#5a524a">• Puech 2015: Beth Shean with a final mem; or Beth Shem(esh), “House of</text>
<text x="908.0" y="561.4" font-size="11.5" fill="#5a524a">the Name”, or an unknown Beth Shem.</text>
<text x="908.0" y="580.6" font-size="11.5" fill="#5a524a">• Greenfield disputes Beth Shean (via Lefkovits p. 414).</text>
<text x="908.0" y="599.8" font-size="11.5" fill="#5a524a">• Every other source spells Beth Shean with nun; the scroll's final mem</text>
<text x="908.0" y="614.9" font-size="11.5" fill="#5a524a">is the open problem (Q16).</text>
<rect x="40.0" y="828.1" width="1320.0" height="155.9" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="854.1" font-size="13" fill="#2a2420" font-weight="700">Text (XII 6–7)</text>
<text x="60.0" y="871.1" font-size="11.5" fill="#5a524a">“At the mouth of the spring of Beth Sham: vessels of silver and vessels of gold of offering, and</text>
<text x="60.0" y="886.3" font-size="11.5" fill="#5a524a">silver; in all, six hundred talents.”</text>
<text x="60.0" y="909.5" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="926.5" font-size="11.5" fill="#5a524a">“The mouth of the spring” in all editions: a flowing spring with a defined outlet. Nothing else is</text>
<text x="60.0" y="941.6" font-size="11.5" fill="#5a524a">given, no direction, distance or depth, so the deposit is drawn at the outlet itself and the setting</text>
<text x="60.0" y="956.8" font-size="11.5" fill="#5a524a">is generic.</text>
<text x="700.0" y="854.1" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="871.1" font-size="11.5" fill="#5a524a">Best-supported, medium: Beth Shean / Scythopolis (Beisan), on reading בית שם as Beth Shean. No</text>
<text x="700.0" y="886.3" font-size="11.5" fill="#5a524a">evidence selects the particular spring (atlas-data.json).</text>
