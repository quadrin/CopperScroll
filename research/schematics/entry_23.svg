<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 23 (V 8–11) — from the Trench of Solomon to the great heap</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="790.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: sixty cubits from the trench to the great heap of stones</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives a distance but no direction, and does not say where on the trench the count starts.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">Here the 60 cubits run east from one point on the trench, and the digging is at the heap.</text>
