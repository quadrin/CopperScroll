<text x="904.0" y="662.0" font-size="11.5" fill="#5a524a">Puech takes מעל near the channel as possibly “upstream of”.</text>
<text x="904.0" y="678.0" font-size="11.5" fill="#5a524a">One arrangement: the 60 cubits follow the channel's course upstream.</text>
