<rect x="40.0" y="910.0" width="1320.0" height="174.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Text (V 8–11)</text>
<text x="60.0" y="953.0" font-size="11.5" fill="#5a524a">“From the Trench of Solomon as far as the great heap of stones, sixty cubits; dig three cubits:</text>
<text x="60.0" y="968.2" font-size="11.5" fill="#5a524a">silver, 23 talents.”</text>
<text x="60.0" y="991.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="1008.4" font-size="11.5" fill="#5a524a">The sixty cubits run straight from one point on the trench to the heap, and the three cubits are dug</text>
<text x="60.0" y="1023.5" font-size="11.5" fill="#5a524a">at the heap. Direction, starting point and measuring path are not given. 1 cubit ≈ 0.5 m; the</text>
<text x="60.0" y="1038.7" font-size="11.5" fill="#5a524a">project's working range 0.445–0.525 m gives 26.7–31.5 m.</text>
<text x="700.0" y="936.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="953.0" font-size="11.5" fill="#5a524a">Possible only, low: Kh. Qumran (possible, low). No origin or endpoint is identified for the distance,</text>
<text x="700.0" y="968.2" font-size="11.5" fill="#5a524a">and entry order alone does not make a continuous route from entry 22 (atlas caution).</text>
<text x="700.0" y="991.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1008.4" font-size="11.5" fill="#5a524a">No phase-5 assessment row is recorded. feature_constraints.csv: review the letter division before</text>
