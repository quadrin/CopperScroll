<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 8 (II 5–6) — the underground chamber in the court of Mattiyah</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan and section, north up by convention. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project text: a chamber under the court of Mattiyah, a cistern in it</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives no direction, distance or depth: nothing here is to scale.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">As the translation punctuates it, the chamber holds wood and their record; the cistern the rest.</text>
<rect x="54.0" y="782.0" width="355.2" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="795.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading: engraved letters, the court of Mattiyah</text>
<text x="60.0" y="196.0" font-size="12" fill="#2a2420" font-weight="700">Plan</text>
<rect x="80.0" y="220.0" width="370.0" height="440.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M80.0,220.0 L450.0,220.0 L450.0,660.0 L80.0,660.0 L80.0,220.0" fill="none" stroke="#7d7264" stroke-width="6" stroke-linejoin="miter"/>
<text x="98.0" y="248.0" font-size="12.5" fill="#2a2420" font-weight="700">court of Mattiyah · חצר מתיה</text>
<text x="98.0" y="264.0" font-size="10.5" fill="#5a524a" font-style="italic">open court; its size and other rooms are not given</text>
<rect x="130.0" y="330.0" width="270.0" height="230.0" fill="#e9dfcc" stroke="#3f3226" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="142.0" y="352.0" font-size="12" fill="#3f3226" font-weight="700">underground chamber · צריח</text>
<text x="142.0" y="367.0" font-size="10.5" fill="#3f3226" font-style="italic">under the court floor; access not given</text>
<path d="M150,398 L162,410 M162,398 L150,410" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="170.0" y="408.0" font-size="11.5" fill="#8e2e22" font-weight="700">wood, and their record</text>
<circle cx="310.0" cy="480.0" r="44.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M304,474 L316,486 M316,474 L304,486" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="280.0" y1="510.0" x2="170.0" y2="600.0" stroke="#245b82" stroke-width="0.8"/>
<text x="120.0" y="614.0" font-size="12" fill="#245b82" font-weight="700">cistern · בור, in the chamber</text>
<text x="120.0" y="630.0" font-size="12" fill="#8e2e22" font-weight="700">× vessels, and silver, seventy talents</text>
<path d="M420,244 L428,276 L420,270 L412,276 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="420.0" y="238.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="490.0" y="196.0" font-size="12" fill="#2a2420" font-weight="700">Section (not to scale)</text>
<rect x="490.0" y="290.0" width="356.0" height="380.0" fill="url(#rockfill)" stroke="#a49a8b" stroke-width="1"/>
<line x1="490.0" y1="290.0" x2="846.0" y2="290.0" stroke="#7d7264" stroke-width="4"/>
<rect x="490.0" y="220.0" width="18.0" height="70.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<text x="516.0" y="278.0" font-size="10.5" fill="#5a524a" font-style="italic">court surface</text>
<rect x="540.0" y="360.0" width="276.0" height="130.0" fill="#efe6d6" stroke="#3f3226" stroke-width="2"/>
<rect x="566.0" y="292.0" width="26.0" height="68.0" fill="none" stroke="#3f3226" stroke-width="1" stroke-dasharray="3 3"/>
<text x="600.0" y="330.0" font-size="10.5" fill="#3f3226" font-style="italic">access: not given</text>
<text x="552.0" y="382.0" font-size="11.5" fill="#3f3226" font-weight="700">underground chamber · צריח</text>
<path d="M574,474 L586,486 M586,474 L574,486" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="594.0" y="484.0" font-size="11.5" fill="#8e2e22" font-weight="700">wood, and their record</text>
<rect x="762.0" y="488.0" width="16.0" height="6.0" fill="#dfe9f0" stroke="none" stroke-width="1.0"/>
<path d="M762,492 C760,522.0 705.0,528.0 705.0,582.0 L705.0,612 L835.0,612 L835.0,582.0 C835.0,528.0 780,522.0 778,492 Z" fill="#dfe9f0" stroke="#245b82" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M764,594 L776,606 M776,594 L764,606" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="690.0" y="530.0" font-size="11.5" fill="#245b82" font-weight="700" text-anchor="end">cistern · בור</text>
<text x="690.0" y="544.4" font-size="11.5" fill="#245b82" text-anchor="end">“a cistern in it”</text>
<line x1="762.0" y1="598.0" x2="694.0" y2="590.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="690.0" y="594.0" font-size="11.5" fill="#8e2e22" font-weight="700" text-anchor="end">vessels, and silver,</text>
<text x="690.0" y="608.4" font-size="11.5" fill="#8e2e22" text-anchor="end">seventy talents</text>
<text x="498.0" y="660.0" font-size="11" fill="#a49a8b" font-style="italic">rock</text>
<text x="490.0" y="694.0" font-size="11" fill="#8d8780">Depths, sizes and how one enters the chamber are</text>
<text x="490.0" y="707.8" font-size="11" fill="#8d8780">not given.</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: the court of the wood stores</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Milik, Høgenhaven and Puech's printed text emend מ to ב:</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">a court of the wood stores, as in m. Middot.</text>
<rect x="904.0" y="302.0" width="187.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading (emended)</text>
<rect x="906.0" y="174.0" width="200.0" height="114.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M906.0,174.0 L1106.0,174.0 L1106.0,288.0 L906.0,288.0 L906.0,174.0" fill="none" stroke="#7d7264" stroke-width="4" stroke-linejoin="miter"/>
<rect x="908.0" y="176.0" width="40.0" height="28.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<rect x="1064.0" y="176.0" width="40.0" height="28.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<rect x="908.0" y="258.0" width="40.0" height="28.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<rect x="1064.0" y="258.0" width="40.0" height="28.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<rect x="1064.0" y="258.0" width="40.0" height="28.0" fill="#e2cfa8" stroke="#8a5a17" stroke-width="1.4"/>
<text x="1084.0" y="276.0" font-size="9.5" fill="#8a5a17" font-weight="700" text-anchor="middle">wood</text>
<rect x="968.0" y="204.0" width="76.0" height="46.0" fill="#e9dfcc" stroke="#3f3226" stroke-width="1.1" stroke-dasharray="4 3"/>
<circle cx="1018.0" cy="228.0" r="12.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.1" stroke-dasharray="3 2"/>
<path d="M1014,224 L1022,232 M1022,224 L1014,232" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M978,214 L986,222 M986,214 L978,222" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1124.0" y="188.0" font-size="11" fill="#5a524a">“Wood” becomes part of the court's</text>
<text x="1124.0" y="201.8" font-size="11" fill="#5a524a">name: corner rooms, one a wood</text>
<text x="1124.0" y="215.5" font-size="11" fill="#5a524a">store. The chamber and cistern stay;</text>
<text x="1124.0" y="229.2" font-size="11" fill="#5a524a">the chamber holds only the record.</text>
<text x="1124.0" y="243.0" font-size="11" fill="#5a524a">Puech's commentary prefers מתיה.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Variant: a tower, not an underground chamber</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">The atlas allows “a chamber or tower” for צריח; the files</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">record no editor who reads the word differently.</text>
<rect x="904.0" y="542.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Atlas sense (tower)</text>
<rect x="906.0" y="476.0" width="210.0" height="58.0" fill="url(#rockfill)" stroke="none" stroke-width="1.0"/>
<line x1="906.0" y1="476.0" x2="1116.0" y2="476.0" stroke="#7d7264" stroke-width="3"/>
<rect x="968.0" y="414.0" width="70.0" height="62.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="3"/>
<text x="1003.0" y="442.0" font-size="10.5" fill="#2a2420" font-weight="700" text-anchor="middle">tower</text>
<path d="M980,464.0 L988,472.0 M988,464.0 L980,472.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M1002,478.0 C1000,491.0 984.0,493.6 984.0,517.0 L984.0,530.0 L1036.0,530.0 L1036.0,517.0 C1036.0,493.6 1020,491.0 1018,478.0 Z" fill="#dfe9f0" stroke="#245b82" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M1006,518.0 L1014,526.0 M1014,518.0 L1006,526.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1134.0" y="428.0" font-size="11" fill="#5a524a">The cistern lies in the floor of</text>
<text x="1134.0" y="441.8" font-size="11" fill="#5a524a">a tower standing in the court,</text>
<text x="1134.0" y="455.5" font-size="11" fill="#5a524a">not under the court. Both</text>
<text x="1134.0" y="469.2" font-size="11" fill="#5a524a">deposits keep their places.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">One hiding place or two?</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Wise divides the entry into two items (Lefkovits item 8,</text>
<text x="904.0" y="640.0" font-size="11.5" fill="#5a524a">pp. 118–125, n. 12); the other editions keep one.</text>
<rect x="904.0" y="782.0" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the count, not the plan</text>
<rect x="912.0" y="660.0" width="120.0" height="56.0" fill="#e9dfcc" stroke="#3f3226" stroke-width="1.2" stroke-dasharray="5 3"/>
<circle cx="1002.0" cy="702.0" r="16.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.1" stroke-dasharray="3 2"/>
<path d="M928,676.0 L936,684.0 M936,676.0 L928,684.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M998,698.0 L1006,706.0 M1006,698.0 L998,706.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="972.0" y="740.0" font-size="10.5" fill="#5a524a" text-anchor="middle">chamber and its cistern</text>
<text x="1058.0" y="668.0" font-size="11" fill="#5a524a">Two deposits either way. Where Wise draws</text>
<text x="1058.0" y="681.8" font-size="11" fill="#5a524a">the line is not recorded in the files.</text>
<text x="1058.0" y="695.5" font-size="11" fill="#5a524a">“Their record” is the bare word וכתבן,</text>
<text x="1058.0" y="709.2" font-size="11" fill="#5a524a">not the fuller phrase that follows offering</text>
<text x="1058.0" y="723.0" font-size="11" fill="#5a524a">vessels elsewhere (deeper analysis §6).</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (II 5–6)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the underground chamber that is in the court of Mattiyah: wood, and their record; a cistern in</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">it: vessels, and silver, seventy talents.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">The chamber is cut under the court floor and the cistern opens in the chamber floor. As the</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">translation punctuates it, wood and their record lie in the chamber, the vessels and silver in the</text>
<text x="60.0" y="958.7" font-size="11.5" fill="#5a524a">cistern. Access, sizes and depths are not given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low. Candidate: Temple enclosure (Temple Mount), possible, low. The atlas describes “a</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">cistern in a courtyard, with a chamber or tower nearby”; no feature is identified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">“Stores” is an emendation of the engraved letters; the wood-store court is known only from texts (m.</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">Middot), while undated rock-cut cisterns and chambers are reported under the platform</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">(phase5_assessments.csv).</text>
</svg>
