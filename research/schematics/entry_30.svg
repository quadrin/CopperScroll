<text x="100.0" y="520.0" font-size="12" fill="#2a2420" font-weight="700">House of Haqqoṣ · בית הקצ</text>
<text x="100.0" y="535.0" font-size="12" fill="#2a2420">the priestly family Haqqoṣ</text>
<text x="296.6" y="270.0" font-size="12" fill="#245b82" font-weight="700">cool room · המקרא</text>
<line x1="324.6" y1="276.0" x2="324.6" y2="310.0" stroke="#245b82" stroke-width="0.8"/>
