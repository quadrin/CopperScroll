<rect x="725.0" y="382.0" width="28.0" height="156.0" fill="#fbfaf7" stroke="#7d7264" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M732.0,519 L746.0,533 M746.0,519 L732.0,533" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="773.0" y1="538.0" x2="773.0" y2="382.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="768.0" y1="538.0" x2="778.0" y2="538.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="768.0" y1="382.0" x2="778.0" y2="382.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="783.0" y="460.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(-90.0 783.0 460.0)">6 cubits ≈ 3 m</text>
<text x="634.0" y="598.0" font-size="12" fill="#8e2e22" font-weight="700">six jars of silver</text>
<text x="634.0" y="613.0" font-size="12" fill="#8e2e22">Puech reads “bars”</text>
<text x="634.0" y="646.0" font-size="11" fill="#8d8780">Depth taken from the cave</text>
<text x="634.0" y="659.8" font-size="11" fill="#8d8780">floor; the text does not</text>
<text x="634.0" y="673.5" font-size="11" fill="#8d8780">say where the dig starts.</text>
<rect x="636.0" y="740.0" width="52.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="688.0" y="740.0" width="52.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="636.0" y="760.0" font-size="11" fill="#2a2420">0</text>
<text x="740.0" y="760.0" font-size="11" fill="#2a2420" text-anchor="middle">2 m</text>
<text x="636.0" y="776.0" font-size="10.5" fill="#8d8780">Section to scale: 1 cubit ≈ 0.5 m</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: “in its vicinity” (Milik)</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Milik reads “in its vicinity”: the cave is only near the</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">House of Haqqoṣ, and there is no cool room.</text>
<rect x="904.0" y="302.0" width="175.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Milik · alternative reading</text>
<circle cx="968.0" cy="237.0" r="52.0" fill="none" stroke="#8a5a17" stroke-width="1.1" stroke-dasharray="4 4"/>
<rect x="944.0" y="219.0" width="48.0" height="36.0" fill="#f4efe6" stroke="#7d7264" stroke-width="3"/>
<path d="M1008.0,193.0 L1012.4,195.3 L1016.0,198.4 L1018.7,203.0 L1017.7,208.6 L1013.0,211.7 L1008.0,211.9 L1003.4,211.0 L998.8,208.3 L996.8,203.0 L999.2,197.9 L1003.5,195.3 L1008.0,193.8 Z" fill="#efe6d6" stroke="#3f3226" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="1015.4" cy="195.6" r="3.2" fill="#fbfaf7" stroke="none" stroke-width="1.0"/>
<line x1="1015.4" y1="195.6" x2="1020.7" y2="190.3" stroke="#3f3226" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<path d="M1005.5,199.5 L1012.5,206.5 M1012.5,199.5 L1005.5,206.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1048.0" y="188.0" font-size="11.5" fill="#5a524a">Puech 2015 n. 260: this segmentation</text>
<text x="1048.0" y="202.4" font-size="11.5" fill="#5a524a">assumes a cave close to the preceding</text>
<text x="1048.0" y="216.8" font-size="11.5" fill="#5a524a">conduit or reservoir (entry 29); with</text>
<text x="1048.0" y="231.1" font-size="11.5" fill="#5a524a">the cool room that link is not needed.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Variant: a “summer house”</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Allegro, Beyer, Lefkovits 2000 and Schiffman read “summer</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">house”; Puech 2015 abandons it for the family Haqqoṣ.</text>
<rect x="904.0" y="542.0" width="181.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Same plan · identity changes</text>
<rect x="918.0" y="445.0" width="90.0" height="64.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M918.0,445.0 L1008.0,445.0 L1008.0,509.0 L918.0,509.0 L918.0,445.0" fill="none" stroke="#7d7264" stroke-width="4" stroke-linejoin="miter"/>
<path d="M973.8,445.0 L973.8,461.0" fill="none" stroke="#7d7264" stroke-width="2" stroke-linejoin="miter"/>
<path d="M973.8,493.0 L973.8,509.0" fill="none" stroke="#7d7264" stroke-width="2" stroke-linejoin="miter"/>
<path d="M973.8,477.0 L984.1,477.0" fill="none" stroke="#7d7264" stroke-width="2" stroke-linejoin="miter"/>
<path d="M997.7,477.0 L1008.0,477.0" fill="none" stroke="#7d7264" stroke-width="2" stroke-linejoin="miter"/>
<rect x="976.8" y="448.0" width="28.2" height="26.0" fill="#e6eff5" stroke="none" stroke-width="1.0"/>
<rect x="983.7" y="461.6" width="14.4" height="10.9" fill="#bcd6e8" stroke="#245b82" stroke-width="1.2"/>
<path d="M1030.0,451.0 L1034.4,453.3 L1038.0,456.4 L1040.7,461.0 L1039.7,466.6 L1035.0,469.7 L1030.0,469.9 L1025.4,469.0 L1020.8,466.3 L1018.8,461.0 L1021.2,455.9 L1025.5,453.3 L1030.0,451.8 Z" fill="#efe6d6" stroke="#3f3226" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="1033.6" cy="451.1" r="3.2" fill="#fbfaf7" stroke="none" stroke-width="1.0"/>
<line x1="1033.6" y1="451.1" x2="1036.2" y2="444.1" stroke="#3f3226" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<path d="M1027.5,457.5 L1034.5,464.5 M1034.5,457.5 L1027.5,464.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1068.0" y="428.0" font-size="11.5" fill="#5a524a">The building becomes a kind of house,</text>
<text x="1068.0" y="442.4" font-size="11.5" fill="#5a524a">not a named estate: the family-name</text>
<text x="1068.0" y="456.8" font-size="11.5" fill="#5a524a">anchor disappears. Tell el-Qos rests</text>
<text x="1068.0" y="471.1" font-size="11.5" fill="#5a524a">on that name and is now weak.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<rect x="904.0" y="782.0" width="94.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Plan unchanged</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Jars or bars: כדין “pitchers” (Lefkovits; the text shown)</text>
<text x="904.0" y="638.4" font-size="11.5" fill="#5a524a">or בדין “bars” (Puech 2006 and 2015). Deposit only.</text>
<text x="904.0" y="652.8" font-size="11.5" fill="#5a524a">Cool room: the lexicon rates the meaning low; Puech's</text>
<text x="904.0" y="667.1" font-size="11.5" fill="#5a524a">mem is “assured”, the whole “probable rather than sure”.</text>
<text x="904.0" y="681.5" font-size="11.5" fill="#5a524a">Puech also records a “springs” reading, too long for the gap.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (VII 8–10)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the cave that is next to the cool room of the House of Haqqoṣ, dig six cubits: six jars of</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">silver.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">A generic house with a cool room; the cave lies next to that room, on a side the text does not give</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">(drawn east). “Dig six cubits” is measured down from the cave floor.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, medium (atlas). Candidates: the Jericho oasis, town or district (possible, medium);</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">Tell el-Qos (weak, low; lowered in phase 5, Milik's choice from the name).</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">Hasmonean–Herodian Jericho had palaces with pools, baths and aqueducts, and cliff caves in use, so</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">both landmark types existed; no source identifies a house of Haqqoṣ. Tell el-Qos is described only as</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">a heap of stones (phase5_assessments.csv).</text>
</svg>
