<text x="452.0" y="417.0" font-size="12" fill="#8e2e22" font-weight="700">cave · מערה</text>
<text x="452.0" y="432.0" font-size="12" fill="#8e2e22">dig six cubits:</text>
<text x="452.0" y="447.0" font-size="12" fill="#8e2e22">six jars of silver</text>
<text x="424.0" y="586.0" font-size="11" fill="#8d8780">“next to”: the side is not given</text>
<path d="M80,204 L88,236 L80,230 L72,236 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="80.0" y="198.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="56.0" y="790.0" font-size="11" fill="#8d8780">House, room and cave schematic; not to scale.</text>
<rect x="620.0" y="182.0" width="238.0" height="614.0" fill="#f8f2e8" stroke="#8a5a17" stroke-width="1.2" rx="6"/>
<text x="634.0" y="206.0" font-size="13" fill="#2a2420" font-weight="700">In the cave (section)</text>
<text x="634.0" y="224.0" font-size="11.5" fill="#5a524a">“dig six cubits”</text>
<line x1="512.0" y1="355.0" x2="620.0" y2="292.0" stroke="#8a5a17" stroke-width="1.1" stroke-dasharray="5 4"/>
