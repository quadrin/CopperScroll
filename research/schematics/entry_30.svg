<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 30 (VII 8–10) — the cave next to the cool room of the House of Haqqoṣ</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: a cave next to the cool room, dig six cubits</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives no direction: the cave is drawn east of the cool room, a drawing choice.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">The house plan is generic; no House of Haqqoṣ has been identified.</text>
