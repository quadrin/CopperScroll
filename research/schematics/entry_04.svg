<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Mound · תל: Puech's tell; Eshel's “ruins” of Koḥlit.</text>
<text x="904.0" y="638.4" font-size="11.5" fill="#5a524a">Store · אוצר: treasury or storehouse; no other reading.</text>
<text x="904.0" y="652.8" font-size="11.5" fill="#5a524a">ΧΑΓ: Greek letters, agreed; proposed names rated weak.</text>
<text x="904.0" y="667.1" font-size="11.5" fill="#5a524a">Koḥlit: Tell es-Sultan (Puech, a hypothesis), a spring on</text>
<text x="904.0" y="681.5" font-size="11.5" fill="#5a524a">Mount Carmel (Milik), Transjordan, the Samarian desert.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (I 9–12)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the mound of Koḥlit: vessels of offering, jugs and ephods. All of it is of the offering and of</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">the seventh-year store, and second tithe rendered unfit(?). Its opening is at the edge of the</text>
<text x="60.0" y="903.4" font-size="11.5" fill="#5a524a">conduit, on the north, six cubits as far as the rock cleft of the immersion.” ΧΑΓ</text>
<text x="60.0" y="926.5" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">The conduit crosses the mound's north slope; the opening sits on its north edge. The six cubits run</text>
<text x="60.0" y="958.7" font-size="11.5" fill="#5a524a">from the opening to the cleft; no bearing is given, so the cleft is drawn on a 6-cubit circle.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low (atlas). Candidate: Tell es-Sultan (Old Jericho, Elisha's spring), possible, low,</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">Puech's hypothesis. Koḥlit remains unidentified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">The mound exists and was an old ruin-mound by the 1st century; channels from the spring below it are</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">undated; dated Hasmonean–Herodian aqueducts and baths lie south of the tell; no immersion</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">installation is reported at the tell (phase5_assessments.csv).</text>
</svg>
