<text x="74.0" y="698.0" font-size="12.5" fill="#2a2420" font-weight="700">Also in this entry, with no position given: drawn apart, not placed</text>
<text x="74.0" y="716.0" font-size="11.5" fill="#5a524a">They may lie anywhere in or near the complex; the text links them only by sequence.</text>
