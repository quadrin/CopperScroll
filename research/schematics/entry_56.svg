<rect x="40.0" y="930.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="956.0" font-size="13" fill="#2a2420" font-weight="700">Text (XI 16–XII 3)</text>
<text x="60.0" y="973.0" font-size="11.5" fill="#5a524a">“In the entrance of the [ledge] of the western resting chamber, a platform(?) on ◦ […]: nine hundred;</text>
<text x="60.0" y="988.2" font-size="11.5" fill="#5a524a">of gold, 5 talents; sixty talents. Its entrance is from the west. Under the black stone: juglets.</text>
<text x="60.0" y="1003.4" font-size="11.5" fill="#5a524a">Under the threshold of the cistern: 42 talents.”</text>
<text x="60.0" y="1026.5" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="1043.5" font-size="11.5" fill="#5a524a">One entry. The ledge is drawn as steps before the chamber's west door, with the platform at its</text>
<text x="60.0" y="1058.7" font-size="11.5" fill="#5a524a">entrance; “western” implies another chamber. The stone and cistern are not placed.</text>
<text x="700.0" y="956.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="973.0" font-size="11.5" fill="#5a524a">Possible only, low. Candidates kept for comparison: Pools of Bethesda (St Anne's) and Kidron valley,</text>
<text x="700.0" y="988.2" font-size="11.5" fill="#5a524a">east slope (Silwan necropolis). No landmark is uniquely identified.</text>
<text x="700.0" y="1011.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="1028.4" font-size="11.5" fill="#5a524a">No phase-5 assessment or feature constraint is recorded. The lexicon rates בית המשכב low–medium and</text>
<text x="700.0" y="1043.5" font-size="11.5" fill="#5a524a">טיף low; Wolters says the original and two facsimiles support כוזין, juglets (readings.json,</text>
<text x="700.0" y="1058.7" font-size="11.5" fill="#5a524a">e56-juglets).</text>
</svg>
