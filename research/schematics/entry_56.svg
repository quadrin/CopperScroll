<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 56 (XI 16–XII 3) — the burial chamber</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="810.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: one entry; the first deposit at the western chamber</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The platform at the entrance of the ledge holds the first group; the chamber is entered from the</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">west. The black stone and the cistern have no stated position, so they are drawn apart (below).</text>
