<text x="1181.5" y="515.0" font-size="11" fill="#245b82" font-weight="600" text-anchor="middle">19 cubits ≈ 9 m</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">One hiding place or two?</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Milik and others split the channel into its own entry;</text>
<text x="904.0" y="640.0" font-size="11.5" fill="#5a524a">Puech and Lefkovits keep one entry.</text>
<rect x="904.0" y="782.0" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the count, not the plan</text>
<circle cx="968.0" cy="715.0" r="16.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="968.0" cy="715.0" r="3.2" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<path d="M967,714.0 L977,724.0 M977,714.0 L967,724.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
