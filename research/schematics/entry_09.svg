<text x="1008.0" y="701.0" font-size="11.5" fill="#5a524a">Two deposits either way: vessels in the</text>
<text x="1008.0" y="717.0" font-size="11.5" fill="#5a524a">cistern, ten talents in its channel. The ΔΙ</text>
<text x="1008.0" y="733.0" font-size="11.5" fill="#5a524a">letters close the line in all editions.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (II 7–9)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the cistern that is opposite the East Gate, nineteen cubits away: in it are vessels, and in its</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">channel(?): ten talents.” ΔΙ.</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">The East Gate of the Temple enclosure (all editions; Thiering's Qumran door not adopted). The</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">distance is measured from the gate to the cistern. The channel feeds the cistern; its course is not</text>
<text x="60.0" y="958.7" font-size="11.5" fill="#5a524a">given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">East Gate of the Temple enclosure: best-supported, medium. The gate is placed by texts (Middot; Neh</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">3:29); the scroll's cistern has not been identified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">Warren's plans show no recorded cistern within about 18 m of the Golden Gate; the nearest (No. 15) is</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">30 m away. Only open mouths were recorded, under 30–40 ft of debris (feature_constraints.csv).</text>
</svg>
