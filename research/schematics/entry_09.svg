<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Variant: 15 cubits (Puech)</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">The editions differ on the number; the files give no preference.</text>
