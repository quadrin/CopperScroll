<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Main reading: one entry, the cistern inside the enclosure</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The wall runs north–south; the court is to the west, the Kidron slope to the east.</text>
