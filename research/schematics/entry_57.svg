<text x="904.0" y="592.6" font-size="14" fill="#2a2420" font-weight="700">Letters that differ, a feature that does not</text>
<text x="904.0" y="612.6" font-size="11.5" fill="#5a524a">All editions keep a pit or shaft with a step or steps.</text>
<rect x="904.0" y="764.9" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="777.9" font-size="10.5" fill="#5f574e" font-weight="600">Changes the letters, not the plan</text>
<text x="908.0" y="636.6" font-size="11.5" fill="#5a524a">• Pit: šyt, Milik and most editions; šwḥ(h), Puech 2015; šyḥ, Allegro,</text>
<text x="908.0" y="651.8" font-size="11.5" fill="#5a524a">as in the text shown.</text>
<text x="908.0" y="670.0" font-size="11.5" fill="#5a524a">• Step: engraved המעלה, corrected to המעלא; “the step (or steps)”.</text>
<text x="908.0" y="688.2" font-size="11.5" fill="#5a524a">• Name: the scroll's letters are גויזין; Lefkovits and the text shown</text>
<text x="908.0" y="703.3" font-size="11.5" fill="#5a524a">print גריזין.</text>
<rect x="40.0" y="812.9" width="1320.0" height="171.1" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="838.9" font-size="13" fill="#2a2420" font-weight="700">Text (XII 4–5)</text>
<text x="60.0" y="855.9" font-size="11.5" fill="#5a524a">“On Mount Gerizim, under the steps of the upper pit: one chest and all its vessels, and silver: 61</text>
<text x="60.0" y="871.1" font-size="11.5" fill="#5a524a">talents.”</text>
<text x="60.0" y="894.3" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="911.3" font-size="11.5" fill="#5a524a">All editions: a step or steps belonging to an “upper” pit, which implies at least one other pit</text>
<text x="60.0" y="926.5" font-size="11.5" fill="#5a524a">(Lefkovits p. 412). The steps are drawn as a flight cut down one side of the pit, with the deposit</text>
<text x="60.0" y="941.6" font-size="11.5" fill="#5a524a">under them; the other pit is drawn lower on the slope. No distance, depth or direction is given.</text>
<text x="700.0" y="838.9" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="855.9" font-size="11.5" fill="#5a524a">Best-supported, medium: Mount Gerizim (Jebel et-Tur), anchored by the mountain's name. No specific</text>
<text x="700.0" y="871.1" font-size="11.5" fill="#5a524a">step or pit is identified (atlas-data.json).</text>
<text x="700.0" y="894.3" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="911.3" font-size="11.5" fill="#5a524a">Magen reports three Hellenistic staircases and a mansion with a courtyard cistern on the summit;</text>
<text x="700.0" y="926.5" font-size="11.5" fill="#5a524a">after the destruction of about 110 BCE they stood as ruins, with no use reported in the 1st c. CE</text>
<text x="700.0" y="941.6" font-size="11.5" fill="#5a524a">(phase5_assessments.csv). The 58/59 CE coin from locus 5178 is tied to no feature</text>
<text x="700.0" y="956.8" font-size="11.5" fill="#5a524a">(gerizim_locus5178_followup).</text>
</svg>
