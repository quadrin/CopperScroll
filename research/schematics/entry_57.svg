<text x="1148.0" y="206.0" font-size="11" fill="#5a524a">the deposit lies under the pit's</text>
<text x="1148.0" y="219.8" font-size="11" fill="#5a524a">entrance or mouth; no steps</text>
<text x="1148.0" y="233.5" font-size="11" fill="#5a524a">are needed.</text>
<rect x="890.0" y="334.3" width="470.0" height="224.3" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="358.3" font-size="14" fill="#2a2420" font-weight="700">“Upper”: one pit above another?</text>
<text x="904.0" y="378.3" font-size="11.5" fill="#5a524a">“Upper” needs a second pit but not where it is: higher on the</text>
<text x="904.0" y="394.3" font-size="11.5" fill="#5a524a">slope (main plan) or a pit over a lower pit, one below the other.</text>
