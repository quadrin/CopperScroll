<path d="M974,460.30666666666673 L982,468.30666666666673 M982,460.30666666666673 L974,468.30666666666673" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1068.0" y="452.3" font-size="10.5" fill="#2a2420" font-weight="600">upper pit</text>
<text x="1060.0" y="498.3" font-size="10.5" fill="#5a524a">lower pit</text>
<text x="1148.0" y="442.3" font-size="11" fill="#5a524a">the steps go down the upper pit;</text>
<text x="1148.0" y="456.1" font-size="11" fill="#5a524a">the deposit is still under them.</text>
<text x="1148.0" y="469.8" font-size="11" fill="#5a524a">Records give no preference.</text>
