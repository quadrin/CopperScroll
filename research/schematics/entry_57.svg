<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Allegro: under the entrance, not the steps</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Allegro reads “entrance”; Puech rejects it, and Milik,</text>
