<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 14 (III 11–13) — the Millo tomb</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up, with a section at the tomb. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="695.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: a tomb in ha-Melaḥ, on its east side, toward its north</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">ha-Melaḥ · מלח drawn as a walled platform with fill (Milik 1962; Puech 2006: the Millo, the Esplanade).</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">Tomb drawn inside the east wall, in the north part; the records say “in or at” the platform.</text>
<rect x="54.0" y="767.0" width="212.6" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="780.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading (atlas placement)</text>
<rect x="100.0" y="230.0" width="360.0" height="390.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<path d="M100.0,230.0 L460.0,230.0 L460.0,620.0 L100.0,620.0 L100.0,230.0" fill="none" stroke="#7d7264" stroke-width="12" stroke-linejoin="miter"/>
<rect x="106.0" y="236.0" width="348.0" height="120.0" fill="#c98a2e" stroke="none" stroke-width="1.0" fill-opacity="0.16"/>
<rect x="334.0" y="236.0" width="120.0" height="378.0" fill="#2b6c99" stroke="none" stroke-width="1.0" fill-opacity="0.12"/>
<text x="116.0" y="256.0" font-size="12" fill="#8a5a17" font-weight="700">north side · בצפנו</text>
<text x="440.0" y="500.0" font-size="12" fill="#245b82" font-weight="700" text-anchor="middle" transform="rotate(90 440.0 500.0)">east side · ממזרחו</text>
<text x="220.0" y="530.0" font-size="13" fill="#2a2420" font-weight="700" text-anchor="middle">ha-Melaḥ · מלח</text>
<text x="220.0" y="546.2" font-size="13" fill="#2a2420" text-anchor="middle">retaining walls and fill</text>
<text x="280.0" y="642.0" font-size="11" fill="#8d8780" text-anchor="middle" font-style="italic">size and shape not given</text>
<rect x="381.0" y="289.0" width="34.0" height="14.0" fill="#6d5846" stroke="#3f3226" stroke-width="1.2" rx="2"/>
<path d="M393,291 L403,301 M403,291 L393,301" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="368.0" y="288.0" font-size="12.5" fill="#2a2420" font-weight="700" text-anchor="end">tomb · קבר</text>
<text x="368.0" y="306.0" font-size="11.5" fill="#8e2e22" font-weight="600" text-anchor="end">13 talents; Puech reads 14</text>
<text x="368.0" y="320.4" font-size="11.5" fill="#8e2e22" text-anchor="end">dig 3 cubits under the dead(?)</text>
<path d="M72,244 L80,276 L72,270 L64,276 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="72.0" y="238.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<rect x="500.0" y="200.0" width="350.0" height="380.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="1" rx="4"/>
<text x="512.0" y="222.0" font-size="12.5" fill="#2a2420" font-weight="700">Section at the tomb</text>
<text x="512.0" y="238.0" font-size="11" fill="#8d8780">depth to scale; 1 cubit ≈ 0.5 m</text>
<text x="512.0" y="254.0" font-size="11" fill="#8d8780">tomb form not given: drawn as a simple grave</text>
<rect x="501.0" y="310.0" width="348.0" height="190.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="501.0" y1="310.0" x2="849.0" y2="310.0" stroke="#2a2420" stroke-width="1.4"/>
<text x="512.0" y="302.0" font-size="11" fill="#5a524a" font-style="italic">surface</text>
<rect x="587.0" y="310.0" width="120.0" height="34.0" fill="#f3ece0" stroke="#3f3226" stroke-width="1.3"/>
<rect x="602.0" y="323.5" width="90.0" height="13.0" fill="#cdbfa5" stroke="#3f3226" stroke-width="1" rx="6"/>
<circle cx="610.0" cy="330.0" r="7.0" fill="#cdbfa5" stroke="#3f3226" stroke-width="1"/>
<text x="717.0" y="334.0" font-size="11" fill="#3f3226" font-weight="600">the dead(?) · המת</text>
