<path d="M641.0,436 L653.0,448 M653.0,436 L641.0,448" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="687.0" y1="330.0" x2="687.0" y2="450.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="692.0" y1="330.0" x2="682.0" y2="330.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="692.0" y1="450.0" x2="682.0" y2="450.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="677.0" y="390.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 677.0 390.0)"></text>
<text x="697.0" y="398.0" font-size="11.5" fill="#8e2e22" font-weight="700">dig 3 cubits</text>
<text x="697.0" y="412.4" font-size="11.5" fill="#8e2e22">≈ 1.5 m</text>
<text x="607.0" y="476.0" font-size="11" fill="#8e2e22" font-weight="600">13 talents</text>
<rect x="512.0" y="544.0" width="40.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="552.0" y="544.0" width="40.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="512.0" y="564.0" font-size="11" fill="#2a2420">0</text>
<text x="592.0" y="564.0" font-size="11" fill="#2a2420" text-anchor="middle">1 m</text>
<rect x="890.0" y="100.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Milik 1962, Puech 2006: under the slab · מדף</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">A slab over a bone pit (Milik, DJD); Puech: “under the slab(?)”.</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">The lexicon rates “slab” low.</text>
<rect x="904.0" y="297.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="310.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<rect x="918.0" y="204.0" width="170.0" height="77.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="918.0" y1="204.0" x2="1088.0" y2="204.0" stroke="#2a2420" stroke-width="1.2"/>
<rect x="958.0" y="196.0" width="90.0" height="8.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<rect x="973.0" y="204.0" width="60.0" height="26.0" fill="#e9dfcf" stroke="#3f3226" stroke-width="1"/>
<text x="1003.0" y="190.0" font-size="10.5" fill="#2a2420" font-weight="600" text-anchor="middle">slab</text>
<text x="1003.0" y="222.0" font-size="9.5" fill="#3f3226" text-anchor="middle">bones</text>
<path d="M998,256.0 L1008,266.0 M1008,256.0 L998,266.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="1058.0" y1="204.0" x2="1058.0" y2="261.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="1063.0" y1="204.0" x2="1053.0" y2="204.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="1063.0" y1="261.0" x2="1053.0" y2="261.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="1048.0" y="232.5" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 1048.0 232.5)"></text>
<text x="1094.0" y="236.5" font-size="10.5" fill="#8e2e22" font-weight="600">3 cubits</text>
<text x="1154.0" y="188.0" font-size="11.5" fill="#5a524a">Three cubits run down from</text>
<text x="1154.0" y="202.4" font-size="11.5" fill="#5a524a">the slab, not from a body.</text>
<text x="1154.0" y="216.8" font-size="11.5" fill="#5a524a">The plan position on the east</text>
<text x="1154.0" y="231.1" font-size="11.5" fill="#5a524a">and north sides is unchanged.</text>
<rect x="890.0" y="335.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="359.0" font-size="14" fill="#2a2420" font-weight="700">Lefkovits: “its north” is the grave’s own north</text>
<text x="904.0" y="379.0" font-size="11.5" fill="#5a524a">The suffix is masculine: it can refer to the pit or grave</text>
<text x="904.0" y="395.0" font-size="11.5" fill="#5a524a">(leads_on_old_plans §1). Lefkovits: “below the corpse”.</text>
<rect x="904.0" y="532.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="545.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<rect x="933.0" y="447.5" width="120.0" height="44.0" fill="#6d5846" stroke="#3f3226" stroke-width="1.4" rx="3"/>
<rect x="933.0" y="417.5" width="120.0" height="30.0" fill="#c98a2e" stroke="none" stroke-width="1.0" fill-opacity="0.2"/>
<path d="M988,428.5 L998,438.5 M998,428.5 L988,438.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="993.0" y="474.5" font-size="11" fill="#f3ece0" font-weight="600" text-anchor="middle">grave</text>
<path d="M918,447.5 L926,479.5 L918,473.5 L910,479.5 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="918.0" y="441.5" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="1083.0" y="423.0" font-size="11.5" fill="#5a524a">The deposit lies on the grave’s north</text>
<text x="1083.0" y="437.4" font-size="11.5" fill="#5a524a">side; “on its east side” could then</text>
<text x="1083.0" y="451.8" font-size="11.5" fill="#5a524a">still place the tomb in ha-Melaḥ.</text>
<text x="1083.0" y="466.1" font-size="11.5" fill="#5a524a">The files do not settle the suffix.</text>
<rect x="890.0" y="570.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="594.0" font-size="14" fill="#2a2420" font-weight="700">ha-Melaḥ as a named place</text>
<text x="904.0" y="614.0" font-size="11.5" fill="#5a524a">Lefkovits 2000 (conditional): the City of Salt. Research notes:</text>
<text x="904.0" y="630.0" font-size="11.5" fill="#5a524a">a tomb east of a Jericho-district site, in its north part.</text>
<rect x="904.0" y="767.0" width="156.8" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="780.0" font-size="10.5" fill="#7a2f22" font-weight="600">Not adopted in the atlas</text>
<path d="M966.0,702.5 L1005.6,662.9 A56,56 0 0,1 1005.6,742.1 Z" fill="#2b6c99" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.12"/>
<path d="M966.0,702.5 L926.4,662.9 A56,56 0 0,1 1005.6,662.9 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.14"/>
<circle cx="966.0" cy="702.5" r="56.0" fill="none" stroke="#6f6a64" stroke-width="1.3"/>
<line x1="966.0" y1="702.5" x2="1005.6" y2="662.9" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="966.0" y1="702.5" x2="1005.6" y2="742.1" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="966.0" y1="702.5" x2="926.4" y2="742.1" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="966.0" y1="702.5" x2="926.4" y2="662.9" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<path transform="translate(966.0,702.5) scale(0.733)" d="M-14,-6 C-15,-14 -5,-17 3,-16 C11,-15 16,-9 15,-1 C16,8 10,15 1,15 C-8,16 -16,10 -15,3 C-17,0 -14,-3 -14,-6 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.91"/>
<circle cx="966.0" cy="702.5" r="1.8" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="991.6" y="681.1" width="16.0" height="7.0" fill="#6d5846" stroke="#3f3226" stroke-width="1.2" rx="2"/>
<path d="M1005.622644336068,672.6225228891133 L1013.622644336068,680.6225228891133 M1013.622644336068,672.6225228891133 L1005.622644336068,680.6225228891133" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1048.0" y="658.0" font-size="11.5" fill="#5a524a">At Kh. Qumran the main cemetery is</text>
<text x="1048.0" y="672.4" font-size="11.5" fill="#5a524a">east of the site (leads_on_old_plans</text>
<text x="1048.0" y="686.8" font-size="11.5" fill="#5a524a">§3); untested for this tomb. The</text>
<text x="1048.0" y="701.1" font-size="11.5" fill="#5a524a">follow-up (§2) calls a tomb at the</text>
<text x="1048.0" y="715.5" font-size="11.5" fill="#5a524a">Temple platform implausible: purity.</text>
<rect x="40.0" y="815.0" width="1320.0" height="169.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Text (III 11–13)</text>
<text x="60.0" y="858.0" font-size="11.5" fill="#5a524a">“In the tomb that is in ha-Melaḥ, on its east side, on its north side, cubits under the dead(?): dig</text>
<text x="60.0" y="873.2" font-size="11.5" fill="#5a524a">three: 13 talents.”</text>
<text x="60.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.4" font-size="11.5" fill="#5a524a">ha-Melaḥ read as the Esplanade (Milik; Puech 2006). “East side” and “north side” are taken as parts</text>
<text x="60.0" y="928.5" font-size="11.5" fill="#5a524a">of ha-Melaḥ, so the tomb sits in its north-east part; the text gives no size or distance. Three</text>
<text x="60.0" y="943.7" font-size="11.5" fill="#5a524a">cubits are measured down from the dead, as the project text reads המת.</text>
<text x="700.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="858.0" font-size="11.5" fill="#5a524a">Atlas: possible only, low. Candidate: Temple enclosure (Temple Mount), possible, low. Milik’s site</text>
<text x="700.0" y="873.2" font-size="11.5" fill="#5a524a">list names Alexander Jannaeus’s tomb. The follow-up asks for a Jericho-area alternative; the atlas</text>
<text x="700.0" y="888.4" font-size="11.5" fill="#5a524a">has none yet.</text>
<text x="700.0" y="911.5" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.5" font-size="11.5" fill="#5a524a">phase5_assessments.csv (JER, entries 3–14): a tomb by the esplanade is known only from texts</text>
<text x="700.0" y="943.7" font-size="11.5" fill="#5a524a">(Josephus, Middot, 11QTemple, as cited by Milik, Puech and Høgenhaven), so it cannot be checked on</text>
<text x="700.0" y="958.9" font-size="11.5" fill="#5a524a">the ground; the entry stays possible, low.</text>
</svg>
