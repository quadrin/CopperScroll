 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 19 (IV 11–12) — the eastern pit north of Koḥlit</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: the easternmost of the pits north of Koḥlit</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives no distance from Koḥlit and no depth; the ring marks direction only.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">“North of” = the 90° quarter centred on north of the site.</text>
<path d="M330.0,520.0 L163.8,353.8 A235,235 0 0,1 496.2,353.8 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.14"/>
<circle cx="330.0" cy="520.0" r="235.0" fill="none" stroke="#6f6a64" stroke-width="1.3"/>
<line x1="330.0" y1="520.0" x2="496.2" y2="353.8" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="330.0" y1="520.0" x2="496.2" y2="686.2" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="330.0" y1="520.0" x2="163.8" y2="686.2" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="330.0" y1="520.0" x2="163.8" y2="353.8" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<path transform="translate(330.0,520.0) scale(1.600)" d="M-14,-6 C-15,-14 -5,-17 3,-16 C11,-15 16,-9 15,-1 C16,8 10,15 1,15 C-8,16 -16,10 -15,3 C-17,0 -14,-3 -14,-6 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="0.87"/>
<circle cx="330.0" cy="520.0" r="1.8" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<text x="330.0" y="612.0" font-size="12" fill="#2a2420" font-weight="700" text-anchor="middle">Koḥlit · כחלת</text>
<text x="330.0" y="627.0" font-size="12" fill="#2a2420" text-anchor="middle">location not established</text>
<line x1="330.0" y1="546.0" x2="330.0" y2="596.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="330.0" y="311.0" font-size="12" fill="#8a5a17" font-weight="700" text-anchor="middle">NORTH quarter · 315°–45°</text>
<text x="551.0" y="524.0" font-size="11.5" fill="#8d8780" text-anchor="end">East</text>
<text x="109.0" y="524.0" font-size="11.5" fill="#8d8780">West</text>
<text x="330.0" y="741.0" font-size="11.5" fill="#8d8780" text-anchor="middle">South</text>
<text x="499.2" y="707.2" font-size="10.5" fill="#8d8780">ring: direction only, no distance</text>
<circle cx="256.0" cy="362.0" r="8.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<circle cx="316.0" cy="364.0" r="8.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<circle cx="390.0" cy="358.0" r="9.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<path d="M386,354 L398,366 M398,354 L386,366" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="400.0" y1="350.0" x2="512.0" y2="324.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="516.0" y="314.0" font-size="12" fill="#8e2e22" font-weight="700">the eastern pit · השית המזרחית</text>
<text x="516.0" y="329.0" font-size="12" fill="#8e2e22">silver, 70 talents</text>
<text x="286.0" y="394.0" font-size="11" fill="#8a5a17" text-anchor="middle">other pit(s), implied</text>
<text x="286.0" y="407.8" font-size="11" fill="#8a5a17" text-anchor="middle">by “the eastern”</text>
<line x1="250.0" y1="334.0" x2="370.0" y2="334.0" stroke="#8a5a17" stroke-width="1.2" marker-end="url(#ah-ochre)"/>
<text x="310.0" y="328.0" font-size="11" fill="#8a5a17" text-anchor="middle">east</text>
<path d="M80,204 L88,236 L80,230 L72,236 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="80.0" y="198.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="630.0" y="400.0" font-size="13" fill="#2a2420" font-weight="700">How the words are drawn</text>
<text x="630.0" y="426.0" font-size="11.5" fill="#5a524a">“north of Koḥlit”: the pits lie in the</text>
<text x="630.0" y="440.4" font-size="11.5" fill="#5a524a">quarter north of the site's centre.</text>
<text x="630.0" y="454.8" font-size="11.5" fill="#5a524a"></text>
<text x="630.0" y="469.1" font-size="11.5" fill="#5a524a">“the eastern pit”: the easternmost of</text>
<text x="630.0" y="483.5" font-size="11.5" fill="#5a524a">two or more pits there; how many, and</text>
<text x="630.0" y="497.9" font-size="11.5" fill="#5a524a">how far apart, is not given.</text>
<text x="630.0" y="512.2" font-size="11.5" fill="#5a524a"></text>
<text x="630.0" y="526.6" font-size="11.5" fill="#5a524a">Pit · שית: an open pit or shaft; the</text>
<text x="630.0" y="541.0" font-size="11.5" fill="#5a524a">lexicon rates the meaning medium.</text>
<text x="630.0" y="555.4" font-size="11.5" fill="#5a524a"></text>
<text x="630.0" y="569.8" font-size="11.5" fill="#5a524a">No digging depth is given.</text>
<text x="56.0" y="790.0" font-size="11" fill="#8d8780">Site, pits and quarter schematic; not to scale.</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: no place name (Allegro)</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Allegro reads בחלה, “hole”, where Puech and Milik</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">read Koḥlit: the pits lie north of a hole.</text>
<rect x="904.0" y="302.0" width="187.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Allegro · alternative reading</text>
<path d="M968.0,232.0 L928.4,192.4 A56,56 0 0,1 1007.6,192.4 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.14"/>
<circle cx="968.0" cy="232.0" r="56.0" fill="none" stroke="#6f6a64" stroke-width="1.3"/>
<line x1="968.0" y1="232.0" x2="1007.6" y2="192.4" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="232.0" x2="1007.6" y2="271.6" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="232.0" x2="928.4" y2="271.6" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="232.0" x2="928.4" y2="192.4" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<circle cx="968.0" cy="232.0" r="6.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<circle cx="955.0" cy="196.3" r="4.5" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<circle cx="983.0" cy="194.9" r="4.5" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<path d="M979.9842637366365,191.9126458173285 L987.9842637366365,199.9126458173285 M987.9842637366365,191.9126458173285 L979.9842637366365,199.9126458173285" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="968.0" y="252.0" font-size="10.5" fill="#5a524a" text-anchor="middle">hole</text>
<text x="1048.0" y="188.0" font-size="11.5" fill="#5a524a">The geometry is the same; only the</text>
<text x="1048.0" y="202.4" font-size="11.5" fill="#5a524a">anchor changes, from a named place</text>
<text x="1048.0" y="216.8" font-size="11.5" fill="#5a524a">to a hole. Puech and Milik keep kḥlt.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Possible link: entry 60 in the same quarter</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Entry 60 is also “north of Koḥlit”: a pit with tombs at</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">its mouth. The two could be one area (readings note).</text>
<rect x="904.0" y="542.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Possible, not assumed</text>
<path d="M968.0,474.0 L927.0,433.0 A58,58 0 0,1 1009.0,433.0 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.14"/>
<circle cx="968.0" cy="474.0" r="58.0" fill="none" stroke="#6f6a64" stroke-width="1.3"/>
<line x1="968.0" y1="474.0" x2="1009.0" y2="433.0" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="474.0" x2="1009.0" y2="515.0" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="474.0" x2="927.0" y2="515.0" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="968.0" y1="474.0" x2="927.0" y2="433.0" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<path transform="translate(968.0,474.0) scale(0.600)" d="M-14,-6 C-15,-14 -5,-17 3,-16 C11,-15 16,-9 15,-1 C16,8 10,15 1,15 C-8,16 -16,10 -15,3 C-17,0 -14,-3 -14,-6 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="2.33"/>
<circle cx="968.0" cy="474.0" r="1.8" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<circle cx="984.3" cy="437.5" r="4.5" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<path d="M981.269465723032,434.45818169429594 L989.269465723032,442.45818169429594 M989.269465723032,434.45818169429594 L981.269465723032,442.45818169429594" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="993.3" y="441.5" font-size="10.5" fill="#8e2e22" font-weight="700">19</text>
<circle cx="955.0" cy="434.1" r="4.5" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<rect x="938.2" y="426.1" width="15.6" height="6.0" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(20 946.0 429.1)"/>
<rect x="955.2" y="423.1" width="15.6" height="6.0" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(-15 963.0 426.1)"/>
<rect x="940.2" y="439.1" width="15.6" height="6.0" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(0 948.0 442.1)"/>
<text x="939.0" y="452.1" font-size="10.5" fill="#3f3226" font-weight="700" text-anchor="end">60</text>
<text x="1048.0" y="428.0" font-size="11.5" fill="#5a524a">Entry 60 (already drawn with entry 11)</text>
<text x="1048.0" y="442.4" font-size="11.5" fill="#5a524a">has tombs at its pit's mouth; entry 19</text>
<text x="1048.0" y="456.8" font-size="11.5" fill="#5a524a">names none. Koḥlit itself is unplaced.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<rect x="904.0" y="782.0" width="94.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Plan unchanged</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Pit · שית / שיח: one lemma; meaning rated medium.</text>
<text x="904.0" y="638.4" font-size="11.5" fill="#5a524a">Koḥlit: kḥlt in Puech and Milik; secure at IV 11–12.</text>
<text x="904.0" y="652.8" font-size="11.5" fill="#5a524a">The figure, 70 talents, is not disputed in the records.</text>
<text x="904.0" y="667.1" font-size="11.5" fill="#5a524a">Koḥlit proposals: Tell es-Sultan (Puech, a hypothesis),</text>
<text x="904.0" y="681.5" font-size="11.5" fill="#5a524a">Mount Carmel (Milik), Transjordan, the Samarian desert.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (IV 11–12)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the eastern pit that is north of Koḥlit: silver, 70 talents.”</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">“North of Koḥlit” is the 90° quarter centred on north of the site. “The eastern pit” is the</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">easternmost of two or more pits there. The distance from Koḥlit, the pits' form and any digging depth</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">are not given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low (atlas). Candidate: Tell es-Sultan (Old Jericho, Elisha's spring), possible, low,</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">Puech's hypothesis. Koḥlit remains unidentified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No source consulted reports pits north of Tell es-Sultan; what lies there is a large cemetery with</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">tombs down to the Roman period (Sala p. 117) and Qumran-type graves. Shaft graves are not the same as</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">a pit (phase5_assessments.csv).</text>
</svg>
