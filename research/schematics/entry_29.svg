 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 29 (VII 3–7) — the conduit and the great northern reservoir</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: in the conduit, 24 cubits from the northern reservoir</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The starting side is in a gap; Puech restores the “large” side, taken here as a long side.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">The right angle is a drawing choice. “Northern” implies another reservoir. Sizes are arbitrary.</text>
<rect x="290.0" y="200.0" width="360.0" height="120.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.8"/>
<path d="M310,274.4 q22,-5 44,0 t44,0 t44,0" fill="none" stroke="#5d8fb3" stroke-width="0.9" stroke-linejoin="round"/>
<text x="470.0" y="250.0" font-size="12.5" fill="#245b82" font-weight="700" text-anchor="middle">the great northern reservoir</text>
<text x="470.0" y="265.6" font-size="12.5" fill="#245b82" text-anchor="middle">האשיח הצפוני הגדול</text>
<text x="662.0" y="216.0" font-size="11.5" fill="#5a524a">“on its four sides […]”</text>
<text x="662.0" y="232.0" font-size="11" fill="#8d8780">the measure starts at a side</text>
<rect x="680.0" y="570.0" width="170.0" height="96.0" fill="#eef4f8" stroke="#245b82" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="680.0" y="686.0" font-size="11" fill="#8d8780">another reservoir, implied by</text>
<text x="680.0" y="699.8" font-size="11" fill="#8d8780">“northern”; its place is not given</text>
<path d="M80.0,690.0 L420.0,690.0 L470.0,650.0 L470.0,322.0" fill="none" stroke="#245b82" stroke-width="14.4" stroke-linejoin="round"/>
<path d="M80.0,690.0 L420.0,690.0 L470.0,650.0 L470.0,322.0" fill="none" stroke="#cfe1ee" stroke-width="12" stroke-linejoin="round"/>
<text x="80.0" y="722.0" font-size="11.5" fill="#245b82" font-weight="700">conduit of Qi◦ […] · אמא</text>
<text x="80.0" y="736.4" font-size="11.5" fill="#245b82">name damaged: “collection of the waters” (Puech),</text>
<text x="80.0" y="750.8" font-size="11.5" fill="#245b82">qy[ṣyṣ] (Milik), Kidron or Cypros (Eshel)</text>
<text x="80.0" y="774.0" font-size="11" fill="#8d8780">Flow direction is not established by the wording.</text>
<path d="M463,601 L477,615 M477,601 L463,615" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="452.0" y="612.0" font-size="12.5" fill="#8e2e22" font-weight="700" text-anchor="end">400 talents</text>
<line x1="504.0" y1="608.0" x2="504.0" y2="320.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="499.0" y1="608.0" x2="509.0" y2="608.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="499.0" y1="320.0" x2="509.0" y2="320.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="514.0" y="464.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(-90.0 514.0 464.0)">24 cubits ≈ 12 m</text>
<line x1="478.0" y1="608.0" x2="510.0" y2="608.0" stroke="#b9b2a8" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="500.0" y1="320.0" x2="510.0" y2="320.0" stroke="#b9b2a8" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="528.0" y="350.0" font-size="11" fill="#8e2e22">measured at right angles</text>
<text x="528.0" y="365.0" font-size="11" fill="#8e2e22">from a long (here south) side</text>
<path d="M80,204 L88,236 L80,230 L72,236 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="80.0" y="198.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<rect x="600.0" y="430.0" width="120.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="720.0" y="430.0" width="120.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="600.0" y="450.0" font-size="11" fill="#2a2420">0</text>
<text x="840.0" y="450.0" font-size="11" fill="#2a2420" text-anchor="middle">10 m</text>
<text x="600.0" y="466.0" font-size="10.5" fill="#8d8780">Scale for the 24-cubit line only</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Puech 2015: 24 or 27 cubits from the side</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Puech restores “of Jericho(?)” and the “large” side as start;</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">he prefers 24 and records Wolters' 27 in his apparatus.</text>
<rect x="904.0" y="302.0" width="169.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Puech 2015 · distance only</text>
<rect x="918.0" y="176.0" width="150.0" height="30.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.8"/>
<text x="993.0" y="196.0" font-size="10.5" fill="#245b82" text-anchor="middle">reservoir</text>
<line x1="968.0" y1="206.0" x2="968.0" y2="268.4" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="973.0" y1="206.0" x2="963.0" y2="206.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="973.0" y1="268.4" x2="963.0" y2="268.4" stroke="#8e2e22" stroke-width="1.2"/>
<text x="958.0" y="237.2" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 958.0 237.2)"></text>
<line x1="1018.0" y1="206.0" x2="1018.0" y2="276.2" stroke="#245b82" stroke-width="1.2"/>
<line x1="1023.0" y1="206.0" x2="1013.0" y2="206.0" stroke="#245b82" stroke-width="1.2"/>
<line x1="1023.0" y1="276.2" x2="1013.0" y2="276.2" stroke="#245b82" stroke-width="1.2"/>
<text x="1008.0" y="241.1" font-size="11" fill="#245b82" font-weight="600" text-anchor="middle" transform="rotate(90.0 1008.0 241.1)"></text>
<text x="962.0" y="270.4" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="end">24 ≈ 12 m</text>
<text x="1026.0" y="278.2" font-size="11" fill="#245b82" font-weight="600">27 ≈ 13.5 m</text>
<text x="1118.0" y="186.0" font-size="11.5" fill="#5a524a">Jericho is entirely a restoration.</text>
<text x="1118.0" y="200.4" font-size="11.5" fill="#5a524a">The atlas tests the northern pool</text>
<text x="1118.0" y="214.8" font-size="11.5" fill="#5a524a">of the Jericho Pools Complex: far</text>
<text x="1118.0" y="229.1" font-size="11.5" fill="#5a524a">side about 15.7 m, not decisive.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Eshel 2002: Hyrcania, 24 cubits north</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Kidron = Hyrcania's southern aqueduct; the reservoir is the</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">northern member of a double pool; 24 cubits north of it.</text>
<rect x="904.0" y="542.0" width="206.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Eshel 2002 · alternative reading</text>
<rect x="958.0" y="472.0" width="56.0" height="34.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.8"/>
<rect x="958.0" y="508.0" width="56.0" height="22.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.8"/>
<text x="986.0" y="500.0" font-size="9.5" fill="#245b82" font-weight="700" text-anchor="middle">N pool</text>
<path d="M906.0,532.0 L954.0,524.0" fill="none" stroke="#245b82" stroke-width="6.4" stroke-linejoin="round"/>
<path d="M906.0,532.0 L954.0,524.0" fill="none" stroke="#cfe1ee" stroke-width="4" stroke-linejoin="round"/>
<line x1="976.0" y1="489.0" x2="976.0" y2="432.6" stroke="#8e2e22" stroke-width="1.2"/>
<path d="M972.5,423.1 L979.5,430.1 M979.5,423.1 L972.5,430.1" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="1000.0" y1="472.0" x2="1000.0" y2="415.6" stroke="#8a5a17" stroke-width="1.2"/>
<path d="M996.5,406.1 L1003.5,413.1 M1003.5,406.1 L996.5,413.1" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="968.0" y="455.0" font-size="10" fill="#8e2e22" font-weight="600" text-anchor="end">24</text>
<text x="1024.0" y="446.0" font-size="10.5" fill="#8e2e22" font-weight="600">from centre</text>
<text x="1024.0" y="460.0" font-size="10.5" fill="#8a5a17" font-weight="600">or from rim</text>
<text x="1098.0" y="426.0" font-size="11.5" fill="#5a524a">The unchosen origin moves the spot by</text>
<text x="1098.0" y="440.4" font-size="11.5" fill="#5a524a">about the whole 24 cubits. Eshel also</text>
<text x="1098.0" y="454.8" font-size="11.5" fill="#5a524a">keeps “left” as an alternative to north.</text>
<text x="1098.0" y="469.1" font-size="11.5" fill="#5a524a">Puech: Kidron is too long for the gap.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Project test: 24 cubits as a side length</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Research notes also test 24 cubits as each side, or the</text>
<text x="904.0" y="640.0" font-size="11.5" fill="#5a524a">perimeter, of the reservoir: a size, not a distance.</text>
<rect x="904.0" y="782.0" width="194.0" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#7a2f22" font-weight="600">Test model · fails at Hyrcania</text>
<rect x="928.0" y="664.0" width="86.4" height="86.4" fill="#bcd6e8" stroke="#245b82" stroke-width="1.8"/>
<line x1="928.0" y1="762.4" x2="1014.4" y2="762.4" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="928.0" y1="757.4" x2="928.0" y2="767.4" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="1014.4" y1="757.4" x2="1014.4" y2="767.4" stroke="#8e2e22" stroke-width="1.2"/>
<text x="971.2" y="758.4" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle"></text>
<text x="1022.4" y="766.4" font-size="10.5" fill="#8e2e22" font-weight="600">24</text>
<text x="1058.0" y="666.0" font-size="11.5" fill="#5a524a">At Hyrcania the northern pool's sides</text>
<text x="1058.0" y="680.4" font-size="11.5" fill="#5a524a">(15–19 m) miss 10.7–12.6 m, and its</text>
<text x="1058.0" y="694.8" font-size="11.5" fill="#5a524a">perimeter misses too. The test does not</text>
<text x="1058.0" y="709.1" font-size="11.5" fill="#5a524a">touch the offset readings above.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (VII 3–7)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the conduit of Qi◦ […] the great northern reservoir, on its four sides […] measure twenty-four</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">cubits: four hundred talents.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">The deposit lies in the conduit, 24 cubits from the reservoir. The starting side is lost in the gap:</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">drawn from a long side (Puech restores the “large” side), at right angles (a drawing choice). Flow</text>
<text x="60.0" y="958.7" font-size="11.5" fill="#5a524a">and sizes are not given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low (atlas). Candidates, all possible, low: the Hasmonean–Herodian palaces at Jericho</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">(provisional: the northern pool of the Pools Complex), ʿAin Duk springs, Tell es-Sultan, Hyrcania.</text>
<text x="700.0" y="903.4" font-size="11.5" fill="#5a524a">Jericho is only Puech's restoration.</text>
<text x="700.0" y="926.5" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">Inconclusive (entry29_jericho_pools/README.md): the northern pool's far-side offset, about 15.7 m,</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">misses 24 cubits but not robustly; 27 fits both pools; Herod later joined the two. Hyrcania gives no</text>
<text x="700.0" y="973.9" font-size="11.5" fill="#5a524a">fixed origin.</text>
</svg>
