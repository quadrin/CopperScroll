<text x="434.0" y="218.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="488.0" y="196.0" font-size="12" fill="#2a2420" font-weight="700">Section through the cave (not to scale)</text>
<path d="M598.0,570.0 L598.0,350.0 L658.0,290.0 L846.0,260.0 L846.0,660.0 L598.0,660.0 Z" fill="url(#rockfill)" stroke="#a49a8b" stroke-width="1.2" stroke-linejoin="round"/>
