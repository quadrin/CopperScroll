<text x="178.0" y="344.0" font-size="12" fill="#3f3226" font-weight="700" text-anchor="middle">2</text>
<text x="178.0" y="372.0" font-size="12" fill="#3f3226" font-weight="700" text-anchor="middle">1</text>
<text x="198.0" y="374.0" font-size="10.5" fill="#3f3226" font-style="italic">← ledges, from the floor up</text>
<path d="M324,300 L336,312 M336,300 L324,312" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="336.0" y1="312.0" x2="382.0" y2="390.0" stroke="#8e2e22" stroke-width="0.8"/>
