<text x="782.0" y="466.0" font-size="11.5" fill="#3f3226" font-weight="700">3</text>
<path d="M794,436 L806,448 M806,436 L794,448" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="766.0" y="444.0" font-size="11.5" fill="#8e2e22" font-weight="700" text-anchor="end">65 ingots of gold ×</text>
<line x1="704.0" y1="550.0" x2="698.0" y2="596.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="608.0" y="610.0" font-size="11.5" fill="#3f3226" font-weight="700">ledges · רובד, numbered from the floor</text>
<text x="648.0" y="560.0" font-size="10.5" fill="#5a524a" font-style="italic">cave floor</text>
<line x1="580.0" y1="554.0" x2="624.0" y2="554.0" stroke="#2a2420" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<text x="492.0" y="594.0" font-size="10.5" fill="#5a524a" font-style="italic">ground</text>
<text x="488.0" y="694.0" font-size="11" fill="#8d8780">The cave's size, the ledges' heights and</text>
<text x="488.0" y="707.8" font-size="11" fill="#8d8780">which wall carries them are not given.</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: stepped, protruding stone courses</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Schiffman (2002): רובד means stepped, protruding courses</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">of stone. The third course is a built course in a wall.</text>
<rect x="904.0" y="302.0" width="187.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative sense (Schiffman)</text>
<rect x="928.0" y="268.0" width="150.0" height="20.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<text x="934.0" y="282.0" font-size="10.5" fill="#3f3226" font-weight="700">1</text>
<rect x="942.0" y="248.0" width="136.0" height="20.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<text x="948.0" y="262.0" font-size="10.5" fill="#3f3226" font-weight="700">2</text>
<rect x="956.0" y="228.0" width="122.0" height="20.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<text x="962.0" y="242.0" font-size="10.5" fill="#3f3226" font-weight="700">3</text>
<rect x="970.0" y="208.0" width="108.0" height="20.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<rect x="984.0" y="188.0" width="94.0" height="20.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.2"/>
<path d="M962,220.0 L970,228.0 M970,220.0 L962,228.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="906.0" y1="288.0" x2="1108.0" y2="288.0" stroke="#3f3226" stroke-width="1.6"/>
<text x="1088.0" y="282.0" font-size="10" fill="#5a524a" font-style="italic">cave floor</text>
<text x="1134.0" y="192.0" font-size="11" fill="#5a524a">Elevation of a built face: each</text>
<text x="1134.0" y="205.8" font-size="11" fill="#5a524a">course protrudes beyond the one</text>
<text x="1134.0" y="219.5" font-size="11" fill="#5a524a">above, like steps; the × sits on</text>
<text x="1134.0" y="233.2" font-size="11" fill="#5a524a">the third course from the bottom.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Variant: a pavement or terrace</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Phase 2 lexicon: “pavement, terrace” (medium; m. Middot 3:6,</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">4:4; m. Yoma 4:3). The third level of a terraced floor.</text>
<rect x="904.0" y="542.0" width="175.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative sense (lexicon)</text>
<path d="M906.0,528.0 L906.0,512.0 L968.0,512.0 L968.0,494.0 L1028.0,494.0 L1028.0,476.0 L1098.0,476.0 L1098.0,528.0 Z" fill="#d9cdb5" stroke="#3f3226" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="906.0" y="418.0" width="192.0" height="58.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1"/>
<text x="928.0" y="508.0" font-size="10.5" fill="#3f3226" font-weight="700">1</text>
<text x="990.0" y="490.0" font-size="10.5" fill="#3f3226" font-weight="700">2</text>
<text x="1054.0" y="472.0" font-size="10.5" fill="#3f3226" font-weight="700">3</text>
<path d="M1070,466.0 L1078,474.0 M1078,466.0 L1070,474.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1002.0" y="434.0" font-size="10.5" fill="#5a524a" text-anchor="middle" font-style="italic">cave</text>
<text x="1134.0" y="432.0" font-size="11" fill="#5a524a">Section: the floor rises in</text>
<text x="1134.0" y="445.8" font-size="11" fill="#5a524a">three paved levels; the ×</text>
<text x="1134.0" y="459.5" font-size="11" fill="#5a524a">lies on the third, not on a</text>
<text x="1134.0" y="473.2" font-size="11" fill="#5a524a">shelf in the wall.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">The house's name and the Greek letters are read in</text>
<text x="904.0" y="640.0" font-size="11.5" fill="#5a524a">several ways; none moves the cave or the ledge.</text>
<rect x="904.0" y="782.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="904.0" y="664.0" font-size="11.5" fill="#5a524a">House: המדה, house of tribute (Puech); המרה (Milik 1962;</text>
<text x="904.0" y="680.0" font-size="11.5" fill="#5a524a">1960 Bet ha-Mareh); המדח (text shown); חמדה.</text>
<text x="904.0" y="696.0" font-size="11.5" fill="#5a524a">Høgenhaven: a washer's house, in the Temple area.</text>
<text x="904.0" y="712.0" font-size="11.5" fill="#5a524a">ΘΕ (Puech, Lefkovits, Milik) or ΞΕ = 65 (Ullendorff,</text>
<text x="904.0" y="728.0" font-size="11.5" fill="#5a524a">Muchowski): the plate check supports Θ.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (II 3–4)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the cave of the old House of Washing(?), on the third ledge: sixty-five ingots of gold. ΘΕ”</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">The cave belongs to, and is entered from, the old house. Its ledges step up along one wall and are</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">counted from the floor; the deposit lies on the third. Which wall, how high, the cave's size and any</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">direction are not given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low. Candidate: Temple enclosure (Temple Mount), possible, low. The house name is not</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">anchored in any ancient text, and the lexicon rates it low.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">The assessment lists a cave of “the old house of MDH/MRH” with a third platform or course and records</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">the key word four ways; the block stays possible, low because it fails on readings, not on</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">archaeology (phase5_assessments.csv).</text>
</svg>
