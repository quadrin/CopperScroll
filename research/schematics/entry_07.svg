<text x="402.0" y="418.4" font-size="11.5" fill="#8e2e22" text-anchor="end">on the third ledge · ברובד השלישי</text>
<text x="276.0" y="462.0" font-size="12.5" fill="#2a2420" font-weight="700" text-anchor="middle">cave · מערה</text>
<text x="276.0" y="478.0" font-size="10.5" fill="#5a524a" text-anchor="middle" font-style="italic">floor</text>
<rect x="110.0" y="540.0" width="300.0" height="130.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
