<text x="126.0" y="592.0" font-size="12" fill="#2a2420" font-weight="700">the old House of Washing(?)</text>
<text x="126.0" y="607.0" font-size="12" fill="#2a2420">בית המדח הישן · name read four ways</text>
<text x="126.0" y="636.0" font-size="10.5" fill="#5a524a" font-style="italic">the cave is entered from the house here</text>
