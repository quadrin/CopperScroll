<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 6 (II 1–2) — the cistern of ha-Melaḥ under the steps</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan and section, north up by convention. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Main reading: a cistern beneath a flight of steps</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives no direction, distance or depth: nothing here is to scale.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">“ha-Melaḥ” is kept as a name; the drawing does not depend on its meaning.</text>
<text x="60.0" y="196.0" font-size="12" fill="#2a2420" font-weight="700">Plan</text>
<rect x="60.0" y="210.0" width="400.0" height="470.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<text x="74.0" y="232.0" font-size="12" fill="#2a2420" font-weight="700">at ha-Melaḥ · המלח</text>
<text x="74.0" y="247.0" font-size="10.5" fill="#5a524a" font-style="italic">a place or structure; the meaning is open</text>
