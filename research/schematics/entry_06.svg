<text x="687.0" y="612.0" font-size="11.5" fill="#8e2e22" font-weight="700">41 talents</text>
<text x="595.0" y="562.0" font-size="12" fill="#245b82" font-weight="700">cistern · בור</text>
<text x="500.0" y="536.0" font-size="11" fill="#5a524a">foot</text>
<text x="842.0" y="318.0" font-size="11" fill="#5a524a" text-anchor="end">head of the steps</text>
<line x1="623.0" y1="430.0" x2="553.0" y2="360.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="549.0" y="354.0" font-size="12" fill="#2a2420" font-weight="700" text-anchor="end">the steps · המעלות</text>
<text x="496.0" y="692.0" font-size="11" fill="#a49a8b" font-style="italic">rock or fill</text>
<text x="490.0" y="730.0" font-size="11" fill="#8d8780">Where the cistern's mouth is, and how far below the</text>
<text x="490.0" y="743.8" font-size="11" fill="#8d8780">steps it lies, the text does not say.</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: the Millo or an esplanade</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Atlas: “the Millo or an esplanade”. Milik and Puech take</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">the word at III 8, 11 as the Temple Esplanade.</text>
<rect x="904.0" y="302.0" width="175.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading (atlas)</text>
<rect x="904.0" y="264.0" width="230.0" height="24.0" fill="url(#rockfill)" stroke="none" stroke-width="1.0"/>
<rect x="1018.0" y="180.0" width="116.0" height="84.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="1018.0" y1="180.0" x2="1018.0" y2="264.0" stroke="#7d7264" stroke-width="6"/>
<path d="M934.0,264.0 L934.0,250.3 L947.3,250.3 L947.3,236.7 L960.7,236.7 L960.7,223.0 L974.0,223.0 L974.0,209.3 L987.3,209.3 L987.3,195.7 L1000.7,195.7 L1000.7,182.0 L1014.0,182.0 L1014.0,264.0 Z" fill="#e7dfd0" stroke="#7d7264" stroke-width="1.2" stroke-linejoin="round"/>
<ellipse cx="978.0" cy="276.0" rx="30" ry="10" fill="#dfe9f0" stroke="#245b82" stroke-width="1.2"/>
<path d="M974,272.0 L982,280.0 M982,272.0 L974,280.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1076.0" y="200.0" font-size="10.5" fill="#5a524a" text-anchor="middle" font-style="italic">terrace fill</text>
<text x="1026.0" y="258.0" font-size="10" fill="#7d7264" font-weight="600">retaining wall</text>
<text x="1150.0" y="188.0" font-size="11" fill="#5a524a">Steps climb the face of a</text>
<text x="1150.0" y="201.8" font-size="11" fill="#5a524a">terrace or embankment; the</text>
<text x="1150.0" y="215.5" font-size="11" fill="#5a524a">cistern lies under them, at</text>
<text x="1150.0" y="229.2" font-size="11" fill="#5a524a">its foot. Puech's sense:</text>
<text x="1150.0" y="243.0" font-size="11" fill="#5a524a">“le terrassement, l'esplanade”.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Variant: “salt”, or the City of Salt</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Puech 2002: “salt”. Lefkovits pp. 104, 183: Melah may be the</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">City of Salt near Secacah. Leads note §3: stepped pools.</text>
<rect x="904.0" y="542.0" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading (conditional)</text>
<rect x="918.0" y="420.0" width="180.0" height="104.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.6"/>
<rect x="920.0" y="422.0" width="176.0" height="9.0" fill="#e7dfd0" stroke="#7d7264" stroke-width="0.7" fill-opacity="0.9"/>
<rect x="920.0" y="431.0" width="176.0" height="9.0" fill="#e7dfd0" stroke="#7d7264" stroke-width="0.7" fill-opacity="0.8200000000000001"/>
