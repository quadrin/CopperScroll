<text x="1008.0" y="516.0" font-size="10.5" fill="#245b82" text-anchor="middle" font-style="italic">basin</text>
<path d="M1004.0,450.0 L1012.0,458.0 M1012.0,450.0 L1004.0,458.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="1110.0" y1="424.0" x2="1110.0" y2="482.0" stroke="#2a2420" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<text x="1122.0" y="453.0" font-size="10.5" fill="#2a2420" font-weight="600" text-anchor="middle" transform="rotate(90 1122.0 453.0)">down</text>
<text x="1160.0" y="428.0" font-size="11" fill="#5a524a">Steps lead down into a</text>
<text x="1160.0" y="441.8" font-size="11" fill="#5a524a">stepped cistern; the × lies</text>
<text x="1160.0" y="455.5" font-size="11" fill="#5a524a">under them. Kh. Qumran's</text>
<text x="1160.0" y="469.2" font-size="11" fill="#5a524a">stepped pools are cited as</text>
<text x="1160.0" y="483.0" font-size="11" fill="#5a524a">background knowledge only.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">The sum and the Greek letters are read differently or</text>
<text x="904.0" y="640.0" font-size="11.5" fill="#5a524a">explained differently; neither moves the cistern.</text>
<rect x="904.0" y="782.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="904.0" y="664.0" font-size="11.5" fill="#5a524a">41 talents: the numeral signs in the text shown add up to</text>
<text x="904.0" y="680.0" font-size="11.5" fill="#5a524a">41 (20 + 20 + 1); the files give 42 for Puech, Lefkovits</text>
<text x="904.0" y="696.0" font-size="11.5" fill="#5a524a">and Milik.</text>
<text x="904.0" y="712.0" font-size="11.5" fill="#5a524a">ΗΝ: read by every edition; 58 on standard values. The files</text>
<text x="904.0" y="728.0" font-size="11.5" fill="#5a524a">rule out Ullendorff's numeral readings (Phase 4).</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (II 1–2)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the cistern of ha-Melaḥ that is under the steps: 41 talents. ΗΝ”</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">A flight of steps with the cistern beneath it. Which way the steps run, their length, the cistern's</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">size and its mouth are not given; ha-Melaḥ names the place or structure and does not fix the layout.</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">No depth is given for the deposit.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low. Candidate: Tyropoeon valley, Jerusalem (possible, low; Phase 3 site index). The</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">lexicon rates the word low: “Esplanade? Millo? salt”.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No row in phase5_assessments.csv or feature_constraints.csv covers entry 6 (not recorded). The leads</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">note §3 cites stepped pools at Kh. Qumran only as background knowledge, and finds no cisterns named</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">at ʿAin el-Ghuweir.</text>
</svg>
