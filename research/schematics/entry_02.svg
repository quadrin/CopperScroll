<line x1="934.0" y1="272.0" x2="934.0" y2="288.0" stroke="#7d7264" stroke-width="0.9"/>
<line x1="950.0" y1="272.0" x2="950.0" y2="288.0" stroke="#7d7264" stroke-width="0.9"/>
<line x1="966.0" y1="272.0" x2="966.0" y2="288.0" stroke="#7d7264" stroke-width="0.9"/>
<line x1="982.0" y1="272.0" x2="982.0" y2="288.0" stroke="#7d7264" stroke-width="0.9"/>
<line x1="906.0" y1="260.0" x2="1010.0" y2="326.0" stroke="#b33a2a" stroke-width="1.6"/>
<line x1="1010.0" y1="260.0" x2="906.0" y2="326.0" stroke="#b33a2a" stroke-width="1.6"/>
<text x="1038.0" y="274.0" font-size="11.5" fill="#5a524a">A name where the editions read</text>
<text x="1038.0" y="288.4" font-size="11.5" fill="#5a524a">בנפש בנדבך השלשי: no monument,</text>
<text x="1038.0" y="302.8" font-size="11.5" fill="#5a524a">no course, so no plan at all.</text>
<rect x="890.0" y="460.0" width="470.0" height="350.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="484.0" font-size="14" fill="#2a2420" font-weight="700">Readings that leave the plan unchanged</text>
<rect x="904.0" y="782.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="906.0" y="510.0" font-size="11.5" fill="#2a2420" font-weight="700">Monument:</text>
<text x="990.0" y="510.0" font-size="11.5" fill="#5a524a">נפש, funerary monument; meaning rated high in the</text>
<text x="990.0" y="525.2" font-size="11.5" fill="#5a524a">lexicon.</text>
<text x="906.0" y="548.4" font-size="11.5" fill="#2a2420" font-weight="700">Course:</text>
<text x="990.0" y="548.4" font-size="11.5" fill="#5a524a">נדבך, a course of masonry (rated medium; Ezra 6:4, m.</text>
<text x="990.0" y="563.5" font-size="11.5" fill="#5a524a">Middot 3:7). No editor in the files reads it</text>
<text x="990.0" y="578.7" font-size="11.5" fill="#5a524a">differently.</text>
<text x="906.0" y="601.9" font-size="11.5" fill="#2a2420" font-weight="700">Setting:</text>
<text x="990.0" y="601.9" font-size="11.5" fill="#5a524a">Puech groups the entry with entry 1 in the Valley of</text>
<text x="990.0" y="617.1" font-size="11.5" fill="#5a524a">Achor; the files also keep the Kidron monuments.</text>
<text x="990.0" y="632.3" font-size="11.5" fill="#5a524a">Placement only.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (I 5–6)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the funerary monument, in the third course of stones: ingots of gold, 100.” Line I 6 then begins</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">entry 3: “In the great cistern that is in the court …”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">A built monument of coursed stone. “Third” is counted up from the ground and the face is unknown; the</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">text says neither. Size, shape and setting are generic.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Atlas: possible only, low. Wadi Nuweiʿimeh (Valley of Achor) and the Kidron monuments in Jerusalem</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">(Absalom, Bene Ḥezir, Zechariah), both possible (low).</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No phase-5 assessment or feature constraint is recorded for entry 2. The site index keeps both places</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">for comparison only; no monument is identified (atlas-data.json).</text>
</svg>
