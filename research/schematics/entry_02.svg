<text x="623.0" y="316.0" font-size="10.5" fill="#8d8780" text-anchor="middle">upper part not described</text>
<text x="484.0" y="587.0" font-size="11.5" fill="#8d8780" text-anchor="end">1</text>
<text x="484.0" y="553.0" font-size="11.5" fill="#8d8780" text-anchor="end">2</text>
<text x="484.0" y="519.0" font-size="11.5" fill="#2a2420" font-weight="700" text-anchor="end">3</text>
<text x="468.0" y="485.0" font-size="10.5" fill="#8d8780" text-anchor="end">course</text>
<line x1="752.0" y1="515.0" x2="778.0" y2="515.0" stroke="#8a5a17" stroke-width="0.8"/>
<text x="782.0" y="511.0" font-size="12" fill="#8a5a17" font-weight="700">third course</text>
<text x="782.0" y="526.0" font-size="12" fill="#8a5a17">בנדבך השלשי</text>
<line x1="661.0" y1="523.0" x2="693.0" y2="648.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="697.0" y="652.0" font-size="12" fill="#8e2e22" font-weight="700">ingots of gold, 100</text>
<text x="438.0" y="646.0" font-size="10.5" fill="#8d8780">ground</text>
<text x="438.0" y="674.0" font-size="11" fill="#5a524a">Counted up from the ground: an assumption; the text does not say.</text>
<rect x="890.0" y="100.0" width="470.0" height="350.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Reported reading: a personal name</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">News reports quote Gibson 2025/26 for this line; the files</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">have not read the article (deeper_analysis §9).</text>
<rect x="904.0" y="422.0" width="150.6" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="435.0" font-size="10.5" fill="#7a2f22" font-weight="600">Unverified; not adopted</text>
<text x="912.0" y="192.0" font-size="12.5" fill="#2a2420" font-weight="600" font-style="italic">“Ben Rabbah, of Beit Shalisha:</text>
<text x="912.0" y="210.0" font-size="12.5" fill="#2a2420" font-weight="600" font-style="italic">100 ingots of gold”</text>
<rect x="918.0" y="304.0" width="80.0" height="16.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1.1"/>
<line x1="934.0" y1="304.0" x2="934.0" y2="320.0" stroke="#7d7264" stroke-width="0.9"/>
