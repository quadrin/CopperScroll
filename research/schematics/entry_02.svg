<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 2 (I 5–6) — the funerary monument</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan and elevation. The text gives no direction or distance: only the monument and its third course of stones.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: in the funerary monument, its third course</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">A built monument of coursed stone; the deposit lies within the third course.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">Left: plan, north up. Right: elevation of one face (which face is not stated).</text>
<rect x="54.0" y="782.0" width="101.0" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="795.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading</text>
<rect x="143.0" y="285.0" width="190.0" height="190.0" fill="url(#rockfill)" stroke="#2a2420" stroke-width="2"/>
<rect x="159.0" y="301.0" width="158.0" height="158.0" fill="none" stroke="#7d7264" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="143.0" y="255.0" font-size="12.5" fill="#2a2420" font-weight="700">funerary monument · נפש</text>
<text x="143.0" y="270.6" font-size="12.5" fill="#2a2420">plan; size and shape not given</text>
