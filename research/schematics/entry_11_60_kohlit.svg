<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
  <title>Koḥlit, entries 11 and 60: schematic plan of a qualifying site</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a4a3a"/>
    </marker>
    <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5671f"/>
    </marker>
    <pattern id="ground" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f6f2ea"/>
      <circle cx="2" cy="2" r="0.7" fill="#e3dccf"/>
    </pattern>
    <g id="grave">
      <rect x="-9" y="-3.5" width="18" height="7" rx="1.5" fill="#6d5846" stroke="#3f3226" stroke-width="0.8"/>
    </g>
    <g id="graveBig">
      <rect x="-20" y="-7" width="40" height="14" rx="2" fill="#8a7461" stroke="#3f3226" stroke-width="1.2"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#3f3226" stroke-width="0.8" stroke-dasharray="3 2"/>
    </g>
  </defs>

  <rect width="1400" height="920" fill="#fbfaf7"/>

  <!-- Title -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#2a2420">What a qualifying “Koḥlit” would look like — entries 11 and 60</text>
  <text x="40" y="74" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement that meets the pre-registered conditions; not a reconstruction of any real site.</text>

  <!-- ============ MAIN PLAN ============ -->
  <!-- centre C = (430,470); 1 km = 320 px -->
  <!-- quadrant wedges -->
  <path d="M430,470 L203.7,243.7 A320,320 0 0,1 656.3,243.7 Z" fill="#c98a2e" fill-opacity="0.13" stroke="none"/>
  <path d="M430,470 L656.3,243.7 A320,320 0 0,1 656.3,696.3 Z" fill="#2b6c99" fill-opacity="0.12" stroke="none"/>

  <!-- rings -->
  <circle cx="430" cy="470" r="320" fill="none" stroke="#6f6a64" stroke-width="1.6"/>
  <circle cx="430" cy="470" r="160" fill="none" stroke="#8d8780" stroke-width="1.2" stroke-dasharray="2 5"/>

  <!-- quadrant boundary lines (45°, 135°, 225°, 315°) -->
  <g stroke="#8d8780" stroke-width="1" stroke-dasharray="6 5">
    <line x1="430" y1="470" x2="203.7" y2="243.7"/>
    <line x1="430" y1="470" x2="656.3" y2="243.7"/>
    <line x1="430" y1="470" x2="656.3" y2="696.3"/>
    <line x1="430" y1="470" x2="203.7" y2="696.3"/>
  </g>

  <!-- quadrant labels -->
  <text x="430" y="176" font-size="14" font-weight="700" fill="#8a5a17" text-anchor="middle">NORTH quarter · 315°–45°</text>
  <text x="430" y="194" font-size="12.5" fill="#8a5a17" text-anchor="middle">the pit (C2) and its graves (C3)</text>
  <text x="764" y="470" font-size="14" font-weight="700" fill="#245b82" text-anchor="middle" transform="rotate(90 764 470)">EAST quarter · 45°–135°</text>
  <text x="784" y="470" font-size="12.5" fill="#245b82" text-anchor="middle" transform="rotate(90 784 470)">the pool (C1)</text>
  <text x="142" y="474" font-size="12.5" fill="#9a948c" text-anchor="middle">West</text>
  <text x="142" y="490" font-size="11" fill="#9a948c" text-anchor="middle">not used</text>
  <text x="430" y="770" font-size="12.5" fill="#9a948c" text-anchor="middle">South · not used</text>

  <!-- ring labels -->
  <text x="555" y="780" font-size="12.5" fill="#5f5953">1 km limit</text>
  <text x="497" y="636" font-size="11.5" fill="#7a746d">0.5 km (sensitivity run)</text>

  <!-- loose-version graves scattered in north quarter -->
  <g opacity="0.85">
    <use href="#grave" x="318" y="262"/>
    <use href="#grave" x="356" y="214" transform="rotate(-20 356 214)"/>
    <use href="#grave" x="532" y="222" transform="rotate(10 532 222)"/>
    <use href="#grave" x="574" y="306"/>
    <use href="#grave" x="372" y="352" transform="rotate(15 372 352)"/>
  </g>
  <text x="150" y="376" font-size="12" fill="#5b4636">Loose version: any graves</text>
  <text x="150" y="391" font-size="12" fill="#5b4636">in the north quarter count</text>
  <line x1="296" y1="372" x2="362" y2="355" stroke="#5b4636" stroke-width="0.8"/>

  <!-- the site (settlement / tell) -->
  <path d="M398,452 C396,430 418,420 436,424 C458,428 470,440 468,458 C470,478 458,500 436,502 C414,506 394,492 396,474 C392,466 398,460 398,452 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.6"/>
  <path d="M410,456 C412,442 426,436 438,440 C452,444 458,454 456,464 C456,478 446,488 434,488 C420,488 410,478 410,466 Z" fill="none" stroke="#a49a8b" stroke-width="1"/>
  <circle cx="430" cy="470" r="2.6" fill="#2a2420"/>
  <text x="352" y="536" font-size="15" font-weight="700" fill="#2a2420">Koḥlit</text>
  <text x="352" y="553" font-size="12" fill="#5a524a">settlement with Hellenistic or Roman</text>
  <text x="352" y="568" font-size="12" fill="#5a524a">occupation · bearings and distances are</text>
  <text x="352" y="583" font-size="12" fill="#5a524a">measured from its recorded centre point (•)</text>
  <line x1="382" y1="522" x2="414" y2="498" stroke="#5a524a" stroke-width="0.8"/>

  <!-- the pool (C1), east -->
  <rect x="566" y="452" width="56" height="36" fill="#bcd6e8" stroke="#245b82" stroke-width="2"/>
  <path d="M572,476 q6,-4 12,0 t12,0 t12,0 t12,0" fill="none" stroke="#5d8fb3" stroke-width="1"/>
  <!-- northern corner -->
  <circle cx="622" cy="452" r="6" fill="none" stroke="#b33a2a" stroke-width="2"/>
  <line x1="618" y1="448" x2="626" y2="456" stroke="#b33a2a" stroke-width="2"/>
  <line x1="626" y1="448" x2="618" y2="456" stroke="#b33a2a" stroke-width="2"/>
  <text x="566" y="508" font-size="13" font-weight="700" fill="#245b82">C1 · pool</text>
  <text x="566" y="523" font-size="11.5" fill="#245b82">open basin or reservoir</text>
  <text x="592" y="402" font-size="11.5" fill="#8e2e22">“in the northern corner,</text>
  <text x="592" y="416" font-size="11.5" fill="#8e2e22">dig four cubits”: the entry</text>
  <text x="592" y="430" font-size="11.5" fill="#8e2e22">11 deposit (not a condition)</text>
  <line x1="640" y1="434" x2="626" y2="447" stroke="#8e2e22" stroke-width="0.8"/>
  <line x1="470" y1="470" x2="560" y2="470" stroke="#245b82" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- the pit (C2), north -->
  <circle cx="430" cy="300" r="24" fill="none" stroke="#a5671f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="430" cy="300" r="8" fill="#2f241a" stroke="#a5671f" stroke-width="2"/>
  <g>
    <rect x="418" y="283" width="9" height="4" rx="1" fill="#6d5846"/>
    <rect x="436" y="310" width="9" height="4" rx="1" fill="#6d5846"/>
    <rect x="440" y="290" width="4" height="9" rx="1" fill="#6d5846"/>
  </g>
  <text x="462" y="352" font-size="13" font-weight="700" fill="#8a5a17">C2 · pit</text>
  <text x="462" y="367" font-size="11.5" fill="#8a5a17">cistern, shaft, chamber or</text>
  <text x="462" y="381" font-size="11.5" fill="#8a5a17">cave — not a tomb</text>
  <line x1="460" y1="345" x2="438" y2="312" stroke="#8a5a17" stroke-width="0.8"/>
  <line x1="430" y1="430" x2="430" y2="312" stroke="#a5671f" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowN)"/>

  <!-- leader to inset -->
  <path d="M454,300 C600,300 700,250 836,250" fill="none" stroke="#a5671f" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- north arrow -->
  <g transform="translate(78,150)">
    <path d="M0,-34 L11,8 L0,0 L-11,8 Z" fill="#2a2420"/>
    <text x="0" y="-42" font-size="16" font-weight="700" fill="#2a2420" text-anchor="middle">N</text>
    <text x="0" y="28" font-size="11" fill="#5a524a" text-anchor="middle">grid north</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(60,820)">
    <rect x="0" y="0" width="160" height="7" fill="#2a2420"/>
    <rect x="160" y="0" width="160" height="7" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
    <text x="0" y="24" font-size="11.5" fill="#2a2420">0</text>
    <text x="160" y="24" font-size="11.5" fill="#2a2420" text-anchor="middle">0.5</text>
    <text x="320" y="24" font-size="11.5" fill="#2a2420" text-anchor="middle">1 km</text>
    <text x="0" y="44" font-size="11" fill="#7a746d">Rings to scale; site, pool, pit and graves enlarged.</text>
  </g>

  <!-- ============ INSET: at the pit's mouth ============ -->
  <rect x="836" y="104" width="524" height="380" rx="6" fill="url(#ground)" stroke="#a5671f" stroke-width="1.4"/>
  <text x="856" y="132" font-size="15" font-weight="700" fill="#2a2420">At the pit's mouth (enlarged)</text>
  <text x="856" y="150" font-size="12" fill="#5a524a">Entry 60: “in the pit north of Koḥlit … with tombs at its mouth”</text>

  <!-- 10 m circle: centre (1098,318), r=120 px = 10 m -->
  <circle cx="1098" cy="318" r="120" fill="#ffffff" fill-opacity="0.35" stroke="#a5671f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <!-- pit opening -->
  <ellipse cx="1098" cy="318" rx="30" ry="22" fill="#4a3a2b" stroke="#2f241a" stroke-width="2"/>
  <ellipse cx="1098" cy="322" rx="20" ry="13" fill="#21180f"/>
  <text x="1098" y="364" font-size="12" font-weight="700" fill="#2a2420" text-anchor="middle">opening</text>
  <text x="1098" y="380" font-size="11" fill="#6a625a" text-anchor="middle">deposit: copy of the list</text>
  <!-- opening faces north (optional) -->
  <line x1="1098" y1="294" x2="1098" y2="214" stroke="#a5671f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowN)"/>
  <text x="1110" y="226" font-size="11.5" fill="#8a5a17">faces north (Milik) or</text>
  <text x="1110" y="240" font-size="11.5" fill="#8a5a17">“hidden” (Puech) —</text>
  <text x="1110" y="254" font-size="11.5" fill="#8a5a17">recorded, not required</text>
  <!-- graves within 10 m -->
  <use href="#graveBig" x="1010" y="262" transform="rotate(-8 1010 262)"/>
  <use href="#graveBig" x="1006" y="372" transform="rotate(6 1006 372)"/>
  <use href="#graveBig" x="1150" y="410" transform="rotate(-4 1150 410)"/>
  <use href="#graveBig" x="1186" y="300"/>
  <text x="1238" y="300" font-size="11.5" fill="#3f3226">grave</text>
  <!-- 10 m scale -->
  <line x1="1098" y1="438" x2="1218" y2="438" stroke="#2a2420" stroke-width="2"/>
  <line x1="1098" y1="432" x2="1098" y2="444" stroke="#2a2420" stroke-width="2"/>
  <line x1="1218" y1="432" x2="1218" y2="444" stroke="#2a2420" stroke-width="2"/>
  <text x="1158" y="458" font-size="12" font-weight="700" fill="#2a2420" text-anchor="middle">10 m</text>
  <text x="856" y="438" font-size="12" font-weight="700" fill="#5b4636">C3 strict version:</text>
  <text x="856" y="454" font-size="12" fill="#5b4636">graves within 10 m of</text>
  <text x="856" y="470" font-size="12" fill="#5b4636">the opening (dashed circle)</text>

  <!-- ============ CONDITIONS PANEL ============ -->
  <rect x="836" y="504" width="524" height="350" rx="6" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.2"/>
  <text x="856" y="532" font-size="15" font-weight="700" fill="#2a2420">Conditions (all must hold)</text>

  <rect x="856" y="546" width="12" height="12" fill="#2b6c99" fill-opacity="0.35" stroke="#245b82"/>
  <text x="876" y="557" font-size="12.5" font-weight="700" fill="#245b82">C1 Pool to the east</text>
  <text x="876" y="573" font-size="12" fill="#3d3631">Open pool or reservoir, ≥3 m across or called a pool (not a covered</text>
  <text x="876" y="588" font-size="12" fill="#3d3631">cistern). Bearing 45°–135°, within 1 km. A pool in the site's own</text>
  <text x="876" y="603" font-size="12" fill="#3d3631">eastern part also counts (Lefkovits: “in the east of”).</text>

  <rect x="856" y="619" width="12" height="12" fill="#c98a2e" fill-opacity="0.4" stroke="#8a5a17"/>
  <text x="876" y="630" font-size="12.5" font-weight="700" fill="#8a5a17">C2 Pit to the north</text>
  <text x="876" y="646" font-size="12" fill="#3d3631">Cistern, pit, shaft, chamber or cave with a surface opening, not a</text>
  <text x="876" y="661" font-size="12" fill="#3d3631">tomb. Bearing 315°–45°, within 1 km.</text>

  <rect x="856" y="677" width="12" height="12" fill="#6d5846"/>
  <text x="876" y="688" font-size="12.5" font-weight="700" fill="#5b4636">C3 Graves at its mouth</text>
  <text x="876" y="704" font-size="12" fill="#3d3631">Strict: within 10 m of the opening. Loose: anywhere in the north</text>
  <text x="876" y="719" font-size="12" fill="#3d3631">quarter. Dropped in the “buried” reading of entry 60 (branch B).</text>

  <text x="876" y="746" font-size="12.5" font-weight="700" fill="#2a2420">Dating</text>
  <text x="876" y="762" font-size="12" fill="#3d3631">Each feature dated to 135 CE or earlier, or undated. A feature fails</text>
  <text x="876" y="777" font-size="12" fill="#3d3631">only if securely dated later.</text>

  <text x="876" y="804" font-size="12.5" font-weight="700" fill="#2a2420">Silence</text>
  <text x="876" y="820" font-size="12" fill="#3d3631">A feature a survey doesn't mention is unknown, never a fail.</text>
  <text x="876" y="836" font-size="12" fill="#3d3631">Sensitivity runs: 0.5 km and 2 km limits.</text>

  <!-- ============ FOOTER: the texts ============ -->
  <text x="40" y="884" font-size="12" fill="#3d3631"><tspan font-weight="700">Entry 11 (II 13–15):</tspan> “In the pool that is east of Koḥlit, in the northern corner, dig four cubits: 22 talents.”</text>
  <text x="40" y="904" font-size="12" fill="#3d3631"><tspan font-weight="700">Entry 60 (XII 10–13):</tspan> “In the pit that is on the north side of Koḥlit, its opening to the north, with tombs at its mouth: a copy of this document, and its explanation …”</text>
</svg>
