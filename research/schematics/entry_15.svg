<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 15 (IV 1–2) — the great cistern in Koḥlit and its pillar</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: the pillar on the north side of the great cistern</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The text gives no measurement, depth or distance; all sizes are generic.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">“Its north side” is drawn as the cistern's north quarter, with the pillar inside the cistern.</text>
