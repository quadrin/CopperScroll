<text x="1048.0" y="186.0" font-size="11.5" fill="#5a524a">The cistern lies in the quarter north</text>
<text x="1048.0" y="200.4" font-size="11.5" fill="#5a524a">of the site; the pillar stays on the</text>
<text x="1048.0" y="214.8" font-size="11.5" fill="#5a524a">cistern's own north side. Both the name</text>
<text x="1048.0" y="229.1" font-size="11.5" fill="#5a524a">and the direction are restored here.</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Variant: no place name (Milik)</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Milik 1962 read only the letters …QH at IV 1.</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">The cistern and its pillar remain; the setting is open.</text>
<rect x="904.0" y="542.0" width="144.4" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Milik 1962 · no Koḥlit</text>
<circle cx="968.0" cy="481.0" r="34.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="968.0" cy="481.0" r="3.2" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="961.0" y="452.5" width="14.0" height="9.0" fill="#e7dfd0" stroke="#3f3226" stroke-width="1.8"/>
<path d="M964.5,453.5 L971.5,460.5 M971.5,453.5 L964.5,460.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1014.0" y="485.0" font-size="22" fill="#8d8780" font-weight="700">?</text>
<text x="1048.0" y="426.0" font-size="11.5" fill="#5a524a">The files call the Koḥlit link here</text>
<text x="1048.0" y="440.4" font-size="11.5" fill="#5a524a">conditional. A project note adds,</text>
<text x="1048.0" y="454.8" font-size="11.5" fill="#5a524a">as speculation, that a Temple cistern</text>
<text x="1048.0" y="469.1" font-size="11.5" fill="#5a524a">with rock piers could then fit.</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<rect x="904.0" y="782.0" width="94.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Plan unchanged</text>
<text x="904.0" y="624.0" font-size="11.5" fill="#5a524a">Sum: 14 is shown. Puech restores more signs, “[20+20+(?)]”,</text>
<text x="904.0" y="638.4" font-size="11.5" fill="#5a524a">in the lacuna before it; Lefkovits gives another figure.</text>
<text x="904.0" y="652.8" font-size="11.5" fill="#5a524a">ΣΚ: Greek letters; the first letter is disputed (Milik °Κ,</text>
<text x="904.0" y="667.1" font-size="11.5" fill="#5a524a">Puech {Ι}ΣΚ). The last Greek group; 16–20 have none.</text>
<text x="904.0" y="681.5" font-size="11.5" fill="#5a524a">“Great cistern” recurs at entry 3, so the phrase is not unique.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (IV 1–2)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the great cistern that is in Koḥlit, in the pillar on its north side: 14 talents.” ΣΚ</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">Koḥlit is a generic settlement with the cistern inside it. “Its north side” is the cistern's north</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">quarter; the pillar is drawn as a pier inside the cistern there. No size, depth or distance is given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low (atlas). Candidate: Tell es-Sultan (Old Jericho, Elisha's spring), possible, low.</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">The name here is Puech's restoration; Milik read only …QH. The cistern is not identified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No source consulted reports a large cistern at or north of Tell es-Sultan; the only pillar SWP</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">mentions is a Byzantine column shaft among ruins beside the tell (p. 223), unrelated to any cistern</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">(phase5_assessments.csv).</text>
</svg>
