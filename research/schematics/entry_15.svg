<text x="649.0" y="394.0" font-size="12" fill="#8e2e22" font-weight="700" text-anchor="middle">pillar · עמוד</text>
<text x="649.0" y="446.0" font-size="12" fill="#8e2e22" font-weight="700" text-anchor="middle">14 talents</text>
<text x="649.0" y="298.0" font-size="12" fill="#8a5a17" font-weight="700" text-anchor="middle">the cistern's north side</text>
<text x="649.0" y="616.0" font-size="12" fill="#245b82" font-weight="700" text-anchor="middle">great cistern · הבור הגדול</text>
<text x="454.0" y="764.0" font-size="11" fill="#8d8780">Cistern underground (dashed). Pillar drawn as a rock pier inside it;</text>
<text x="454.0" y="779.0" font-size="11" fill="#8d8780">it could stand at the rim. The text says only “in the pillar on its north side”.</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Variant: “north(?) of Koḥlit” (Puech)</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Puech 2006 restores “[north(?) of Ko]ḥlit”,</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">“with near certainty”. The text shown has “in Koḥlit”.</text>
