<text x="684.0" y="470.0" font-size="11.5" fill="#8e2e22" font-weight="700">41 talents</text>
<text x="606.0" y="530.0" font-size="11.5" fill="#3f3226" font-weight="700">tomb · קבר under the rock</text>
<text x="494.0" y="324.0" font-size="11" fill="#8a5a17" font-weight="600">entrance at the foot</text>
<text x="494.0" y="338.0" font-size="10.5" fill="#8d8780">(side not given)</text>
<line x1="524.0" y1="344.0" x2="562.0" y2="468.0" stroke="#8a5a17" stroke-width="0.8"/>
<rect x="60.0" y="680.0" width="790.0" height="116.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="74.0" y="702.0" font-size="12.5" fill="#2a2420" font-weight="700">What the line gives</text>
<text x="74.0" y="726.0" font-size="11.5" fill="#2a2420" font-weight="700">Landmark</text>
<text x="224.0" y="726.0" font-size="11.5" fill="#5a524a">a tomb · קבר, under a rock “knife”(?) · הסכין (or Puech's colonnades, right)</text>
<text x="74.0" y="745.0" font-size="11.5" fill="#2a2420" font-weight="700">Direction, distance</text>
<text x="224.0" y="745.0" font-size="11.5" fill="#5a524a">none given</text>
<text x="74.0" y="764.0" font-size="11.5" fill="#2a2420" font-weight="700">Depth</text>
<text x="224.0" y="764.0" font-size="11.5" fill="#5a524a">none given; the deposit is inside the tomb</text>
<text x="74.0" y="783.0" font-size="11.5" fill="#2a2420" font-weight="700">Deposit</text>
<text x="224.0" y="783.0" font-size="11.5" fill="#5a524a">41 talents (no object named)</text>
<rect x="890.0" y="100.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Puech 2006: under the colonnades · סבין</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">The tomb lies under a roofed colonnade (galleries).</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">The atlas title follows this; the lexicon rates it low.</text>
<rect x="904.0" y="302.0" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="315.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading · atlas title</text>
<rect x="948.0" y="202.0" width="200.0" height="54.0" fill="#f4efe6" stroke="#7d7264" stroke-width="1.3" stroke-dasharray="5 3"/>
