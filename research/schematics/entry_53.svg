<text x="80.0" y="244.0" font-size="11.5" fill="#2a2420" font-weight="700">rock “knife”(?) · הסכין</text>
<text x="80.0" y="258.4" font-size="11.5" fill="#2a2420">solid line = its crest</text>
<line x1="172.0" y1="266.0" x2="160.0" y2="406.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="180.0" y="510.0" font-size="11.5" fill="#3f3226" font-weight="700">tomb · קבר cut beneath the rock</text>
<text x="180.0" y="524.4" font-size="11.5" fill="#3f3226">dashed = below the rock surface</text>
<line x1="245.0" y1="462.0" x2="245.0" y2="492.0" stroke="#8a5a17" stroke-width="1.2" marker-end="url(#ah-ochre)"/>
