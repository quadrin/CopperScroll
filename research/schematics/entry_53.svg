<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 53 (XI 8) — the gallery tomb</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up (orientation arbitrary: the text gives no direction). One arrangement the text allows; not a real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: a tomb cut under the rock called “the knife”(?)</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">The only spatial word is “under”. No direction, distance, depth or entrance side is given,</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">so the plan is generic: the chamber lies beneath the rock, entered from its foot.</text>
<rect x="60.0" y="174.0" width="400.0" height="492.0" fill="#f7f3ec" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="72.0" y="194.0" font-size="11" fill="#8d8780" font-weight="700">PLAN</text>
<path d="M432,200 L440,232 L432,226 L424,232 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="432.0" y="194.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<path d="M100.0,440.0 L180.0,348.0 L290.0,318.0 L400.0,325.0 L370.0,370.0 L280.0,435.0 L180.0,480.0 Z" fill="url(#rockfill)" stroke="#a49a8b" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M100.0,440.0 L230.0,385.0 L400.0,325.0" fill="none" stroke="#2a2420" stroke-width="2.2" stroke-linejoin="round"/>
