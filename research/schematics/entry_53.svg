<g transform="rotate(0 1058.0 233.0)"><rect x="1041.0" y="216.0" width="34" height="34" fill="#efe6d6" stroke="#3f3226" stroke-width="1.6" stroke-dasharray="6 3"/><rect x="1053.9" y="250.0" width="8.2" height="11.9" fill="#efe6d6" stroke="#3f3226" stroke-width="1.4" stroke-dasharray="4 3"/></g>
<path d="M1053,228.0 L1063,238.0 M1063,228.0 L1053,238.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1164.0" y="215.0" font-size="11" fill="#2a2420" font-weight="700">colonnade</text>
<text x="1164.0" y="228.8" font-size="11" fill="#2a2420">(roof dashed)</text>
<text x="1164.0" y="247.0" font-size="11" fill="#3f3226" font-weight="700">tomb below,</text>
<text x="1164.0" y="260.8" font-size="11" fill="#3f3226">dashed</text>
<rect x="890.0" y="340.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="364.0" font-size="14" fill="#2a2420" font-weight="700">Milik: compared with הסובב, a ledge</text>
<text x="904.0" y="384.0" font-size="11.5" fill="#5a524a">Milik compares the word with the ledge round the altar</text>
<text x="904.0" y="400.0" font-size="11.5" fill="#5a524a">(m. Middot 3:1). The files give no placement for it.</text>
<rect x="904.0" y="542.0" width="249.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="555.0" font-size="10.5" fill="#5f574e" font-weight="600">Comparison only · no placement recorded</text>
<rect x="958.0" y="423.0" width="120.0" height="92.0" fill="#f4efe6" stroke="#7d7264" stroke-width="1.4"/>
<rect x="978.0" y="439.0" width="80.0" height="60.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.4"/>
<g transform="rotate(0 1018.0 507.0)"><rect x="1007.0" y="496.0" width="22" height="22" fill="#efe6d6" stroke="#3f3226" stroke-width="1.6" stroke-dasharray="6 3"/><rect x="1015.4" y="518.0" width="5.3" height="7.7" fill="#efe6d6" stroke="#3f3226" stroke-width="1.4" stroke-dasharray="4 3"/></g>
<path d="M1014,503.0 L1022,511.0 M1022,503.0 L1014,511.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1094.0" y="443.0" font-size="11" fill="#2a2420" font-weight="700">surrounding ledge</text>
<text x="1094.0" y="456.8" font-size="11" fill="#2a2420">(the outer band)</text>
<text x="1094.0" y="487.0" font-size="11" fill="#3f3226" font-weight="700">tomb under the ledge:</text>
<text x="1094.0" y="500.8" font-size="11" fill="#3f3226">one arrangement only</text>
<rect x="890.0" y="580.0" width="470.0" height="230.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="604.0" font-size="14" fill="#2a2420" font-weight="700">Which word does the text show?</text>
<rect x="904.0" y="782.0" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">Neither reading changes “under”</text>
<text x="904.0" y="630.0" font-size="11.5" fill="#5a524a">The text shown has הסכין with kaf, not Puech's סבין;</text>
<text x="904.0" y="647.0" font-size="11.5" fill="#5a524a">the project translation follows “knife”(?), the sense</text>
<text x="904.0" y="664.0" font-size="11.5" fill="#5a524a">other readers give (unnamed in the files).</text>
<text x="904.0" y="681.0" font-size="11.5" fill="#5a524a"></text>
<text x="904.0" y="698.0" font-size="11.5" fill="#5a524a">On every reading the tomb lies under the landmark;</text>
<text x="904.0" y="715.0" font-size="11.5" fill="#5a524a">only the kind of landmark changes: a rock, a roofed</text>
<text x="904.0" y="732.0" font-size="11.5" fill="#5a524a">colonnade, or a ledge.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (XI 8)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">In the tomb that is under the rock “knife”(?): 41 talents.</text>
<text x="60.0" y="896.2" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.2" font-size="11.5" fill="#5a524a">A tomb cut beneath a rock outcrop that the text calls “the knife”. The text gives no direction,</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">distance, depth or entrance side; orientation and sizes are arbitrary.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low. Candidates kept for comparison: Southern wall (Huldah Gates / Royal Stoa) and</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">Kidron valley, east slope (Silwan necropolis). No landmark is uniquely identified.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No phase-5 assessment or feature constraint is recorded. The lexicon rates סבין “galleries” low</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">(landmark_lexicon_index.csv); phase 1 lists 53 as textually secure and places it after the Zadok</text>
<text x="700.0" y="958.7" font-size="11.5" fill="#5a524a">group, entries 50–52 (phase1_summary.md).</text>
</svg>
