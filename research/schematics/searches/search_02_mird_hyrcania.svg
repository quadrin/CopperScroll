<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
<title>Past search schematic 02: Kh. Mird (Hyrcania): what was looked at and what was dug</title>
<defs>
 <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2420"/></marker>
 <marker id="ah-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a17"/></marker>
 <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#245b82"/></marker>
 <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e2e22"/></marker>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#efe3cf"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a5a17" stroke-width="1.2"/></pattern>
 <pattern id="rockfill" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e7dfd0"/><circle cx="2" cy="2" r="0.8" fill="#a49a8b"/><circle cx="6" cy="6" r="0.6" fill="#a49a8b"/></pattern>
 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Past searches 02 — Kh. Mird (Hyrcania): what was looked at and what was dug</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up, NOT to scale: positions follow the reports' directions; the distances they give are written on the drawing.</text>
<rect x="40.0" y="100.0" width="900.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Site plan (schematic)</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">Blue = dug or cleared (who, when). Ochre dashed = looked at or measured only.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">Grey = no digging recorded. Red = the scroll's wording that searchers tested here.</text>
<path d="M278,540 C268,410 388,330 498,335 C618,340 678,440 668,540 C658,640 548,690 448,685 C338,680 283,620 278,540 Z" fill="url(#rockfill)" stroke="#a49a8b" stroke-width="1.2" stroke-linejoin="round"/>
<text x="293.0" y="380.0" font-size="10.5" fill="#8d8780">conical hill c. 250 m above the plain on the E</text>
<rect x="373.0" y="420.0" width="190.0" height="160.0" fill="#f4efe6" stroke="#7d7264" stroke-width="4"/>
<rect x="418.0" y="460.0" width="100.0" height="80.0" fill="#fbfaf7" stroke="#7d7264" stroke-width="1.2"/>
<text x="468.0" y="504.0" font-size="11" fill="#8d8780" text-anchor="middle">court</text>
<text x="468.0" y="410.0" font-size="11" fill="#2a2420" font-weight="700" text-anchor="middle">Herodian fortress, later the monastery of Kastellion</text>
<rect x="443.0" y="450.0" width="22.0" height="100.0" fill="none" stroke="#245b82" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="491.0" y="450.0" width="22.0" height="100.0" fill="none" stroke="#245b82" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="465.0" y1="552.0" x2="413.0" y2="594.0" stroke="#245b82" stroke-width="0.8"/>
<text x="377.0" y="608.0" font-size="10.5" fill="#8a5a17" font-weight="600">two vaults under the summit, running N–S;</text>
<text x="377.0" y="621.1" font-size="10.5" fill="#8a5a17">court vault c. 12 × 5.2 × 8 m (Wright). Allegro went</text>
<text x="377.0" y="634.2" font-size="10.5" fill="#8a5a17">down by ladder: in 1959–60 (1964 book) or</text>
<text x="377.0" y="647.4" font-size="10.5" fill="#8a5a17">1962–63 (Search in the Desert).</text>
<circle cx="523.0" cy="566.0" r="9.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="523.0" cy="566.0" r="3.2" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<line x1="531.0" y1="572.0" x2="686.0" y2="612.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="690.0" y="616.0" font-size="10.5" fill="#2a2420" font-weight="600">large cistern near the S end: manuscripts</text>
<text x="690.0" y="629.1" font-size="10.5" fill="#2a2420">found here by the Louvain party, 1952</text>
<rect x="379.0" y="426.0" width="44.0" height="34.0" fill="#1f6fae" stroke="#1f6fae" stroke-width="1.2" fill-opacity="0.18"/>
<text x="401.0" y="447.0" font-size="10.5" fill="#1f6fae" font-weight="700" text-anchor="middle">A</text>
<rect x="513.0" y="540.0" width="44.0" height="34.0" fill="#1f6fae" stroke="#1f6fae" stroke-width="1.2" fill-opacity="0.18"/>
<text x="535.0" y="561.0" font-size="10.5" fill="#1f6fae" font-weight="700" text-anchor="middle">B</text>
<rect x="423.0" y="464.0" width="24.0" height="24.0" fill="#1f6fae" stroke="#1f6fae" stroke-width="1.2" fill-opacity="0.18"/>
<text x="435.0" y="480.0" font-size="10.5" fill="#1f6fae" font-weight="700" text-anchor="middle">C-1</text>
<rect x="353.0" y="480.0" width="22.0" height="40.0" fill="#1f6fae" stroke="#1f6fae" stroke-width="1.2" fill-opacity="0.18"/>
<text x="364.0" y="504.0" font-size="10.5" fill="#1f6fae" font-weight="700" text-anchor="middle">W-1</text>
<text x="508.0" y="300.0" font-size="10.5" fill="#1f6fae" font-weight="600">2023 Hebrew University season (May–June):</text>
<text x="508.0" y="313.1" font-size="10.5" fill="#1f6fae">areas A, B, C-1, W-1, on the summit only</text>
<line x1="668.0" y1="380.0" x2="682.0" y2="390.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="406.0" x2="682.0" y2="416.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="432.0" x2="682.0" y2="442.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="458.0" x2="682.0" y2="468.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="484.0" x2="682.0" y2="494.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="510.0" x2="682.0" y2="520.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="536.0" x2="682.0" y2="546.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="562.0" x2="682.0" y2="572.0" stroke="#a49a8b" stroke-width="1.6"/>
<line x1="668.0" y1="588.0" x2="682.0" y2="598.0" stroke="#a49a8b" stroke-width="1.6"/>
<text x="690.0" y="460.0" font-size="11" fill="#2a2420" font-weight="700">East side: steep bluff</text>
<text x="690.0" y="476.0" font-size="10.5" fill="#8a5a17">No ancient steps described (Wright 1961).</text>
<text x="690.0" y="489.1" font-size="10.5" fill="#8a5a17">1962–63: Allegro's architect found no room</text>
<text x="690.0" y="502.2" font-size="10.5" fill="#8a5a17">for steps here (looked at only).</text>
<text x="690.0" y="536.0" font-size="10.5" fill="#b33a2a" font-weight="600">Entry 1 tested here by Allegro:</text>
<text x="690.0" y="549.1" font-size="10.5" fill="#b33a2a">“under the steps that go in toward</text>
<text x="690.0" y="562.2" font-size="10.5" fill="#b33a2a">the east, forty cubits”</text>
<path d="M68.0,210.0 L178.0,380.0 L228.0,460.0 L238.0,480.0 L373.0,490.0" fill="none" stroke="#245b82" stroke-width="6.4" stroke-linejoin="round"/>
<path d="M68.0,210.0 L178.0,380.0 L228.0,460.0 L238.0,480.0 L373.0,490.0" fill="none" stroke="#cfe1ee" stroke-width="4" stroke-linejoin="round"/>
<line x1="278.5" y1="483.0" x2="305.5" y2="485.0" stroke="#245b82" stroke-width="1.4" marker-end="url(#ah-blue)"/>
<rect x="216.0" y="472.0" width="44.0" height="16.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.3"/>
<text x="88.0" y="200.0" font-size="10.5" fill="#245b82">aqueduct from the NW, towards el-Muntar</text>
<text x="88.0" y="213.1" font-size="10.5" fill="#245b82">(c. 2 km on the PEF map)</text>
<text x="88.0" y="514.0" font-size="10.5" fill="#8a5a17" font-weight="600">Herodian bridge across the neck;</text>
<text x="88.0" y="527.1" font-size="10.5" fill="#8a5a17">plastered channel c. 50 cm wide</text>
<text x="88.0" y="540.2" font-size="10.5" fill="#8a5a17">(measured 1960)</text>
<rect x="192.0" y="420.0" width="20.0" height="20.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.2"/>
<rect x="218.0" y="420.0" width="20.0" height="20.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.2"/>
<text x="60.0" y="418.0" font-size="10.5" fill="#245b82">two square</text>
<text x="60.0" y="431.1" font-size="10.5" fill="#245b82">quarried cisterns</text>
<text x="60.0" y="444.2" font-size="10.5" fill="#245b82">just N of the</text>
<text x="60.0" y="457.4" font-size="10.5" fill="#245b82">bridge →</text>
<path d="M348.0,240.0 L448.0,226.0 L558.0,234.0 L698.0,224.0" fill="none" stroke="#d7cbb3" stroke-width="16" stroke-linejoin="round"/>
<path d="M348.0,240.0 L448.0,226.0 L558.0,234.0 L698.0,224.0" fill="none" stroke="#b8a888" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text x="588.0" y="216.0" font-size="11" fill="#245b82" font-weight="600" font-style="italic">Wadi Abu Sha'le</text>
<line x1="428.0" y1="236.0" x2="428.0" y2="292.0" stroke="#1f6fae" stroke-width="6"/>
<line x1="498.0" y1="222.0" x2="492.0" y2="192.0" stroke="#1f6fae" stroke-width="4" stroke-dasharray="4 3"/>
<text x="168.0" y="290.0" font-size="10.5" fill="#1f6fae" font-weight="600">W stepped tunnel (S cliff, runs S):</text>
<text x="168.0" y="303.1" font-size="10.5" fill="#1f6fae">cleared 30 m by Bedouin before 1960</text>
<text x="514.0" y="190.0" font-size="10.5" fill="#1f6fae" font-weight="600">E stepped tunnel (N face): mouth</text>
<text x="514.0" y="203.1" font-size="10.5" fill="#1f6fae">“hurriedly cleared” 1960</text>
<text x="168.0" y="324.0" font-size="10.5" fill="#1f6fae">Gutfeld: one tunnel dug 2000–04, a dead end</text>
<text x="168.0" y="337.1" font-size="10.5" fill="#1f6fae">(BAR 2006 abstract; “both” per the 2023 report)</text>
<rect x="836.0" y="647.7" width="12.0" height="4.6" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(0 842.0 650.0)"/>
<rect x="852.0" y="657.7" width="12.0" height="4.6" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(48 858.0 660.0)"/>
<rect x="822.0" y="661.7" width="12.0" height="4.6" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(-42 828.0 664.0)"/>
<rect x="842.0" y="673.7" width="12.0" height="4.6" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(18 848.0 676.0)"/>
<rect x="860.0" y="641.7" width="12.0" height="4.6" fill="#6d5846" stroke="#3f3226" stroke-width="0.6" rx="1" transform="rotate(72 866.0 644.0)"/>
<line x1="653.0" y1="675.0" x2="812.0" y2="658.0" stroke="#8d8780" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#ah-ink)"/>
<text x="732.5" y="684.5" font-size="10.5" fill="#5a524a" text-anchor="middle">c. 0.5 km E</text>
<text x="762.0" y="696.0" font-size="10.5" fill="#8a5a17" font-weight="600">Herodian graves, opened by Bedouin;</text>
<text x="762.0" y="709.1" font-size="10.5" fill="#8a5a17">recorded 1960, finds from one</text>
<rect x="142.0" y="678.0" width="32.0" height="32.0" fill="#1f6fae" stroke="#1f6fae" stroke-width="1.4" fill-opacity="0.25" transform="rotate(45 158.0 694.0)"/>
<line x1="303.0" y1="620.0" x2="180.0" y2="672.0" stroke="#8d8780" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#ah-ink)"/>
<text x="166.5" y="647.0" font-size="10.5" fill="#5a524a">c. 300 m SW</text>
<text x="188.0" y="696.0" font-size="10.5" fill="#1f6fae" font-weight="600">the “monument” on a crag: cleared round the base</text>
<text x="188.0" y="709.1" font-size="10.5" fill="#1f6fae">and through the middle in April 1960; no chamber</text>
<text x="188.0" y="722.2" font-size="10.5" fill="#1f6fae">or deposit (Wright). See sheet 03.</text>
<text x="188.0" y="742.0" font-size="10.5" fill="#b33a2a" font-weight="600">Entry 2 tested here by Allegro: “in the</text>
<text x="188.0" y="755.1" font-size="10.5" fill="#b33a2a">funerary monument, in the third course”</text>
<path d="M898,204 L906,236 L898,230 L890,236 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="898.0" y="198.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="898.0" y="260.0" font-size="10" fill="#8d8780" text-anchor="middle">not to scale</text>
<rect x="960.0" y="100.0" width="400.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="974.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Who did what, when</text>
<text x="974.0" y="144.0" font-size="11.5" fill="#5a524a">Only fieldwork the sources report. Dates as stated.</text>
<text x="978.0" y="168.0" font-size="12" fill="#2a2420" font-weight="700">1952</text>
<text x="1056.0" y="168.0" font-size="11" fill="#5a524a">Louvain party (de Langhe): manuscripts from</text>
<text x="1056.0" y="182.5" font-size="11" fill="#5a524a">a cistern near the S end.</text>
<text x="978.0" y="205.0" font-size="12" fill="#1f6fae" font-weight="700">Apr 1960</text>
<text x="1056.0" y="205.0" font-size="11" fill="#5a524a">Allegro's “Copper Scroll Expedition”</text>
<text x="1056.0" y="219.6" font-size="11" fill="#5a524a">(Wright: first half of April 1960; Allegro:</text>
<text x="1056.0" y="234.1" font-size="11" fill="#5a524a">“winter of 1959-60”). Wright surveyed and</text>
<text x="1056.0" y="248.6" font-size="11" fill="#5a524a">planned the ruin; no digging on the summit.</text>
<text x="1056.0" y="263.1" font-size="11" fill="#5a524a">Monument cleared; graves recorded; E tunnel</text>
<text x="1056.0" y="277.6" font-size="11" fill="#5a524a">mouth cleared.</text>
<text x="978.0" y="300.2" font-size="12" fill="#8a5a17" font-weight="700">1960</text>
<text x="1056.0" y="300.2" font-size="11" fill="#5a524a">Metal and cavity detectors reached about 18</text>
<text x="1056.0" y="314.7" font-size="11" fill="#5a524a">in (0.46 m); the rock's natural magnetism</text>
<text x="1056.0" y="329.2" font-size="11" fill="#5a524a">masked metal (Allegro 1964; “signals</text>
<text x="1056.0" y="343.7" font-size="11" fill="#5a524a">everywhere”, 1966).</text>
<text x="978.0" y="366.2" font-size="12" fill="#8a5a17" font-weight="700">1962–63</text>
<text x="1056.0" y="366.2" font-size="11" fill="#5a524a">Dead Sea Scrolls Fund day visit: court vault</text>
<text x="1056.0" y="380.8" font-size="11" fill="#5a524a">entered by ladder; east side checked for</text>
<text x="1056.0" y="395.3" font-size="11" fill="#5a524a">steps. No digging. (The 1964 book puts the</text>
<text x="1056.0" y="409.8" font-size="11" fill="#5a524a">ladder descent in 1959–60.)</text>
<text x="978.0" y="432.3" font-size="12" fill="#1f6fae" font-weight="700">2000–04</text>
<text x="1056.0" y="432.3" font-size="11" fill="#5a524a">Gutfeld clears a stepped tunnel to a dead</text>
<text x="1056.0" y="446.8" font-size="11" fill="#5a524a">end (BAR 2006, abstract only).</text>
<text x="978.0" y="469.4" font-size="12" fill="#1f6fae" font-weight="700">2016</text>
<text x="1056.0" y="469.4" font-size="11" fill="#5a524a">A trial square in the NW of the summit.</text>
<text x="978.0" y="491.9" font-size="12" fill="#1f6fae" font-weight="700">2023</text>
<text x="1056.0" y="491.9" font-size="11" fill="#5a524a">Hebrew University season, areas A, B, C-1,</text>
<text x="1056.0" y="506.4" font-size="11" fill="#5a524a">W-1. Not dug: the cisterns, the monument,</text>
<text x="1056.0" y="520.9" font-size="11" fill="#5a524a">the cemetery, the tunnels.</text>
<text x="978.0" y="549.4" font-size="12.5" fill="#2a2420" font-weight="700">What no source reports</text>
<text x="978.0" y="567.4" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="567.4" font-size="11" fill="#5a524a">Any digging at the foot of the east side, or a</text>
<text x="990.0" y="582.0" font-size="11" fill="#5a524a">search “forty cubits” from any steps.</text>
<text x="978.0" y="601.5" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="601.5" font-size="11" fill="#5a524a">The depth reached at the monument, or whether</text>
<text x="990.0" y="616.0" font-size="11" fill="#5a524a">bedrock was reached.</text>
<text x="978.0" y="635.5" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="635.5" font-size="11" fill="#5a524a">Any work in the cisterns north of the bridge.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Sources</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">Wright with Milik, Biblica 42 (1961) 1–27; Allegro, The Treasure of the Copper Scroll, 2nd ed. (1964)</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">pp. 55–61; Search in the Desert (1966) pp. 111–120; Haber &amp; Gutfeld 2024; Gutfeld, BAR 32.5 (2006),</text>
<text x="60.0" y="903.4" font-size="11.5" fill="#5a524a">abstract.</text>
<text x="60.0" y="926.5" font-size="13" fill="#2a2420" font-weight="700">How it was drawn</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">Directions and distances from the texts: monument c. 300 m SW (Palestine grid refs 1848/1252 and</text>
<text x="60.0" y="958.7" font-size="11.5" fill="#5a524a">1845/1250 give c. 360 m WSW), graves c. 0.5 km E, tunnels due N, aqueduct from the NW.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Scroll entries</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Allegro tied entries 1 and 2 to Hyrcania. The repo lists Hyrcania as possible for entries 16, 29 and</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">35 instead. This sheet records searches; it does not identify any entry with the site.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What it shows</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">Only the monument and the tunnels were cleared with a scroll in mind, and neither has a published</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">depth. Detectors reached about half a metre. The east-side “steps” were only looked for.</text>
</svg>
