 <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e2e22"/></marker>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#efe3cf"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a5a17" stroke-width="1.2"/></pattern>
 <pattern id="rockfill" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e7dfd0"/><circle cx="2" cy="2" r="0.8" fill="#a49a8b"/><circle cx="6" cy="6" r="0.6" fill="#a49a8b"/></pattern>
 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Past searches 03 — the “monument” SW of Kh. Mird, Allegro's candidate for entry 2</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Plan to scale (from the stated dimensions) and a schematic section. What the April 1960 clearance examined, and what no source records.</text>
<rect x="40.0" y="100.0" width="900.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Plan and section</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">Blue = cleared in April 1960 (Wright). Grey dashed = not described. Red = the scroll's wording.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">Dimensions: Wright “slightly more than 10 metres” a side; Allegro “some thirty-three feet”.</text>
<g transform="rotate(-45 233.0 385.0)"><rect x="131.4" y="283.4" width="203.2" height="203.2" fill="#1f6fae" fill-opacity="0.10" stroke="#1f6fae" stroke-width="1" stroke-dasharray="5 3"/><rect x="150.6" y="270.6" width="164.8" height="32.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1.2"/><rect x="150.6" y="302.6" width="164.8" height="164.8" fill="url(#earth)" stroke="#7d7264" stroke-width="5"/><rect x="218.6" y="302.6" width="28.8" height="164.8" fill="#1f6fae" fill-opacity="0.18" stroke="#1f6fae" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M233.0,349.8 L253.8,349.0 L263.5,367.4 L261.9,385.0 L263.5,402.6 L253.8,421.0 L233.0,420.2 L218.6,410.0 L202.5,402.6 L191.5,385.0 L202.5,367.4 L218.6,360.0 Z" fill="url(#rockfill)" stroke="#a49a8b" stroke-width="1.4"/></g>
<line x1="255.1" y1="523.6" x2="371.6" y2="407.1" stroke="#2a2420" stroke-width="1.2"/>
<line x1="251.6" y1="520.1" x2="258.6" y2="527.1" stroke="#2a2420" stroke-width="1.2"/>
<line x1="368.1" y1="403.6" x2="375.1" y2="410.6" stroke="#2a2420" stroke-width="1.2"/>
<text x="326.3" y="478.3" font-size="11" fill="#2a2420" font-weight="600" text-anchor="middle" transform="rotate(-45 326.3 478.3)">c. 10.3 m</text>
<text x="54.0" y="200.0" font-size="11" fill="#1f6fae" font-weight="600">platform c. 2 m wide on the NW front,</text>
<text x="54.0" y="213.8" font-size="11" fill="#1f6fae">“unsuspected until clearance”</text>
<line x1="118.0" y1="220.0" x2="161.4" y2="311.4" stroke="#1f6fae" stroke-width="0.8"/>
<text x="310.0" y="200.0" font-size="11" fill="#1f6fae" font-weight="600">inside cleared “to leave</text>
<text x="310.0" y="213.8" font-size="11" fill="#1f6fae">a section” (Pl. IX); its</text>
<text x="310.0" y="227.5" font-size="11" fill="#1f6fae">line is not stated</text>
<line x1="338.0" y1="238.0" x2="281.1" y2="427.1" stroke="#1f6fae" stroke-width="0.8"/>
<text x="54.0" y="562.0" font-size="11" fill="#1f6fae" font-weight="600">cleared round the base</text>
<text x="54.0" y="575.8" font-size="11" fill="#1f6fae">(width not stated)</text>
<line x1="108.0" y1="550.0" x2="195.1" y2="481.2" stroke="#1f6fae" stroke-width="0.8"/>
<text x="54.0" y="610.0" font-size="13" fill="#2a2420" font-weight="700">Key</text>
<circle cx="66.0" cy="628.0" r="7.0" fill="url(#rockfill)" stroke="#a49a8b" stroke-width="1.2"/>
<text x="84.0" y="632.0" font-size="11.5" fill="#5a524a">rock pinnacle at the core</text>
<rect x="58.0" y="646.0" width="16.0" height="12.0" fill="url(#earth)" stroke="#7d7264" stroke-width="3"/>
<text x="84.0" y="656.0" font-size="11.5" fill="#5a524a">coursed rubble walls; boulder fill in earth mortar</text>
<rect x="58.0" y="671.0" width="16.0" height="10.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1.1"/>
<text x="84.0" y="680.0" font-size="11.5" fill="#5a524a">NW platform</text>
<rect x="58.0" y="694.0" width="16.0" height="12.0" fill="#1f6fae" stroke="#1f6fae" stroke-width="1.1" stroke-dasharray="4 3" fill-opacity="0.15"/>
<text x="84.0" y="704.0" font-size="11.5" fill="#5a524a">cleared April 1960 (strip widths assumed)</text>
<rect x="60.0" y="778.0" width="40.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="100.0" y="778.0" width="40.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="60.0" y="798.0" font-size="11" fill="#2a2420">0</text>
<text x="140.0" y="798.0" font-size="11" fill="#2a2420" text-anchor="middle">5 m</text>
<path d="M198,764 L206,796 L198,790 L190,796 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="198.0" y="758.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="468.0" y="290.0" font-size="11.5" fill="#2a2420" font-weight="700">Section (schematic; only the 2 m wall height is to scale)</text>
<path d="M538,536 L538,392.0 L728,392.0 L728,522 Z" fill="url(#earth)" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<path d="M418.0,538.0 L518.0,536.0 L575.0,510.0 L609.8,410.0 L633.0,380.0 L656.2,412.0 L696.8,500.0 L743.2,532.0 L788.0,544.0 L788.0,610.0 L418.0,610.0 Z" fill="url(#rockfill)" stroke="#a49a8b" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="516.0" y="512.0" width="22.0" height="24.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="516.0" y="488.0" width="22.0" height="24.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="516.0" y="464.0" width="22.0" height="24.0" fill="#f0d9b0" stroke="#7d7264" stroke-width="1"/>
<rect x="516.0" y="440.0" width="22.0" height="24.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="516.0" y="416.0" width="22.0" height="24.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="516.0" y="392.0" width="22.0" height="24.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="728.0" y="500.3" width="22.0" height="21.7" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="728.0" y="478.7" width="22.0" height="21.7" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="728.0" y="457.0" width="22.0" height="21.7" fill="#f0d9b0" stroke="#7d7264" stroke-width="1"/>
<rect x="728.0" y="435.3" width="22.0" height="21.7" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="728.0" y="413.7" width="22.0" height="21.7" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="728.0" y="392.0" width="22.0" height="21.7" fill="#e9dfcc" stroke="#7d7264" stroke-width="1"/>
<rect x="456.0" y="500.0" width="60.0" height="36.0" fill="#e9dfcc" stroke="#7d7264" stroke-width="1.1"/>
<text x="512.0" y="492.0" font-size="10.5" fill="#2a2420" text-anchor="end">NW platform</text>
<path d="M516.0,392.0 L633.0,332.0 L750.0,392.0" fill="none" stroke="#8d8780" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5 4"/>
<text x="633.0" y="324.0" font-size="10.5" fill="#8d8780" text-anchor="middle">upper part thrown down by Bedouin: original height unknown</text>
<rect x="603.0" y="392.0" width="60.0" height="118.0" fill="#1f6fae" stroke="#1f6fae" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.12"/>
<text x="633.0" y="500.0" font-size="22" fill="#1f6fae" font-weight="700" text-anchor="middle">?</text>
<text x="633.0" y="564.0" font-size="10.5" fill="#1f6fae" font-weight="600" text-anchor="middle">cleared section (Pl. IX): depth reached not stated</text>
<rect x="516.0" y="392.0" width="22.0" height="27.6" fill="#1f6fae" stroke="none" stroke-width="1.0" fill-opacity="0.35"/>
<rect x="728.0" y="392.0" width="22.0" height="27.6" fill="#1f6fae" stroke="none" stroke-width="1.0" fill-opacity="0.35"/>
<line x1="516.0" y1="419.6" x2="758.0" y2="419.6" stroke="#1f6fae" stroke-width="1" stroke-dasharray="2 3"/>
<text x="762.0" y="413.6" font-size="10.5" fill="#1f6fae" font-weight="600">0.46 m: detector reach</text>
<text x="762.0" y="426.7" font-size="10.5" fill="#1f6fae">(Allegro 1964 p. 67)</text>
<line x1="440.0" y1="536.0" x2="440.0" y2="416.0" stroke="#2a2420" stroke-width="1.2"/>
<line x1="435.0" y1="536.0" x2="445.0" y2="536.0" stroke="#2a2420" stroke-width="1.2"/>
<line x1="435.0" y1="416.0" x2="445.0" y2="416.0" stroke="#2a2420" stroke-width="1.2"/>
<text x="434.0" y="480.0" font-size="11" fill="#2a2420" font-weight="600" text-anchor="end">2 m</text>
<line x1="750.0" y1="467.8" x2="768.0" y2="481.8" stroke="#b33a2a" stroke-width="0.8"/>
<text x="770.0" y="485.8" font-size="10.5" fill="#b33a2a" font-weight="600">third course from the base</text>
<text x="770.0" y="499.0" font-size="10.5" fill="#b33a2a">(course height not given)</text>
<text x="458.0" y="630.0" font-size="10.5" fill="#5a524a">Walls founded at different levels on the rock,</text>
<text x="458.0" y="643.1" font-size="10.5" fill="#5a524a">“partly well over 2 m high” (Wright).</text>
<rect x="458.0" y="656.0" width="468.0" height="64.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="6"/>
<text x="472.0" y="676.0" font-size="11" fill="#2f5a26" font-weight="600">Result (Wright): “No chamber or deposits were located</text>
<text x="472.0" y="689.8" font-size="11" fill="#2f5a26">in the monument”. Herodian sherds in the fill (lekythos necks).</text>
<text x="472.0" y="703.5" font-size="11" fill="#2f5a26">He reads it as a funerary monument or high place, or both.</text>
<rect x="960.0" y="100.0" width="400.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="974.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Entry 2 and this monument</text>
<text x="974.0" y="144.0" font-size="11.5" fill="#5a524a">The scroll's wording and what each source says.</text>
<rect x="974.0" y="782.0" width="187.8" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="982.0" y="795.0" font-size="10.5" fill="#7a2f22" font-weight="600">Partial search, depth unknown</text>
<text x="978.0" y="170.0" font-size="12" fill="#2a2420" font-weight="700">Text (project translation, I 5–6)</text>
<text x="978.0" y="188.0" font-size="11.5" fill="#b33a2a">“In the funerary monument, in the third course of</text>
<text x="978.0" y="203.2" font-size="11.5" fill="#b33a2a">stones: ingots of gold, 100.”</text>
<text x="978.0" y="228.4" font-size="12" fill="#2a2420" font-weight="700">What each source says</text>
<text x="978.0" y="246.4" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="246.4" font-size="11" fill="#5a524a">Wright 1961: the expedition went there because of</text>
<text x="990.0" y="260.9" font-size="11" fill="#5a524a">“possible references in the Copper Scroll”. Cleared</text>
<text x="990.0" y="275.4" font-size="11" fill="#5a524a">round the base and through the inside; no chamber or</text>
<text x="990.0" y="289.9" font-size="11" fill="#5a524a">deposit. No detector mentioned.</text>
<text x="978.0" y="310.4" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="310.4" font-size="11" fill="#5a524a">Allegro 1964: a square of “some thirty-three feet”;</text>
<text x="990.0" y="325.0" font-size="11" fill="#5a524a">“no difficulty” finding the third course; detectors</text>
<text x="990.0" y="339.5" font-size="11" fill="#5a524a">defeated by the rock's magnetism; “no thought of</text>
<text x="990.0" y="354.0" font-size="11" fill="#5a524a">destroying the whole monument”. No clearance or depth</text>
<text x="990.0" y="368.5" font-size="11" fill="#5a524a">given.</text>
<text x="978.0" y="389.0" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="389.0" font-size="11" fill="#5a524a">Search in the Desert: “we had excavated around the</text>
<text x="990.0" y="403.6" font-size="11" fill="#5a524a">sides”; a mine detector “got signals everywhere”.</text>
<text x="978.0" y="428.1" font-size="12" fill="#2a2420" font-weight="700">Not recorded anywhere</text>
<text x="978.0" y="446.1" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="446.1" font-size="11" fill="#5a524a">How deep the clearance went, or whether it reached the</text>
<text x="990.0" y="460.6" font-size="11" fill="#5a524a">rock.</text>
<text x="978.0" y="480.1" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="480.1" font-size="11" fill="#5a524a">Whether every course was taken down or only a section</text>
<text x="990.0" y="494.6" font-size="11" fill="#5a524a">cut.</text>
<text x="978.0" y="514.2" font-size="11" fill="#5a524a">•</text>
<text x="990.0" y="514.2" font-size="11" fill="#5a524a">Whether this monument is the scroll's at all: it is</text>
<text x="990.0" y="528.7" font-size="11" fill="#5a524a">one candidate.</text>
<text x="978.0" y="552.2" font-size="12" fill="#2a2420" font-weight="700">Ledger row S03</text>
<text x="978.0" y="570.2" font-size="11" fill="#5a524a">Result coded “negative”, kind EVIDENCE (the 1960</text>
<text x="978.0" y="584.7" font-size="11" fill="#5a524a">expedition as a whole). The row's notes say this is not a</text>
<text x="978.0" y="599.2" font-size="11" fill="#5a524a">complete negative for the monument, for the reasons above.</text>
<text x="978.0" y="619.8" font-size="11" fill="#8d8780">Allegro's 1960 book already ties the monument to his item</text>
<text x="978.0" y="634.3" font-size="11" fill="#8d8780">2 (pp. 64–68); it has no account of the trip.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Sources</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">Wright with Milik, Biblica 42 (1961) pp. 14–16, Fig. 4, Pls. VIII–IX; Allegro, Treasure of the Copper</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">Scroll, 2nd ed. (1964) pp. 57–58, 67; Search in the Desert (1966) pp. 117–118.</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">How it was drawn</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">Plan to scale from the stated side (c. 10.3 m) and platform (c. 2 m), faces turned to NW–SE after</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">Wright's “north west side” (bearing not measured). Cleared strips at an assumed width. The section is</text>
<text x="60.0" y="958.7" font-size="11.5" fill="#5a524a">schematic except for the 2 m wall height.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">What it shows</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">The only scroll-motivated search in the ledger with a published plan and section. It found no chamber</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">or deposit, and the detectors could see only about half a metre into the structure.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What it does not show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">That the monument is empty. With no depth and only a section cut, the search does not cover the whole</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">structure (ledger S03).</text>
</svg>
