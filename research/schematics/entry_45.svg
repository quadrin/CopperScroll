<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
<title>Copper Scroll entry 45: the ravine cistern</title>
<defs>
 <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2420"/></marker>
 <marker id="ah-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a17"/></marker>
 <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#245b82"/></marker>
 <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e2e22"/></marker>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#efe3cf"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a5a17" stroke-width="1.2"/></pattern>
 <pattern id="rockfill" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e7dfd0"/><circle cx="2" cy="2" r="0.8" fill="#a49a8b"/><circle cx="6" cy="6" r="0.6" fill="#a49a8b"/></pattern>
 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 45 (X 3–4) — the ravine cistern</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan and section. The text gives no direction, so the plan has no north arrow. One arrangement the text allows.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading (Puech 2015): a plastered cistern fed by channels from the wadi</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">“The channels that are watered from the great wadi” feed the cistern; the deposit is in its floor.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">No bearing, distance or depth is given: layout and sizes are arbitrary.</text>
<rect x="54.0" y="782.0" width="101.0" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="795.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading</text>
<rect x="58.0" y="176.0" width="450.0" height="582.0" fill="url(#rockfill)" stroke="#d6cfc4" stroke-width="0.8" fill-opacity="0.55"/>
<text x="70.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">PLAN</text>
<text x="114.0" y="198.0" font-size="11" fill="#8d8780" font-style="italic">orientation arbitrary</text>
<path d="M64.0,673.0 L178.0,657.0 L308.0,671.0 L438.0,659.0 L502.0,675.0" fill="none" stroke="#d7cbb3" stroke-width="16" stroke-linejoin="round"/>
<path d="M64.0,673.0 L178.0,657.0 L308.0,671.0 L438.0,659.0 L502.0,675.0" fill="none" stroke="#b8a888" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text x="76.0" y="707.0" font-size="12" fill="#7d6a4a" font-weight="700">the great wadi · נחל</text>
<text x="76.0" y="722.0" font-size="12" fill="#7d6a4a">course and direction not given</text>
<circle cx="288.0" cy="376.0" r="62.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="288.0" cy="376.0" r="3.2" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<text x="288.0" y="284.0" font-size="12" fill="#245b82" font-weight="700" text-anchor="middle">plastered(?) cistern · בור גר</text>
<text x="288.0" y="299.0" font-size="12" fill="#245b82" text-anchor="middle">Puech: a (re)plastered cistern, p. 87</text>
<path d="M300,384 L312,396 M312,384 L300,396" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="312.0" y1="384.0" x2="364.0" y2="366.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="368.0" y="364.0" font-size="11.5" fill="#8e2e22" font-weight="700">11 talents</text>
<text x="368.0" y="378.4" font-size="11.5" fill="#8e2e22">in its floor</text>
<path d="M168.0,655.0 L178.0,486.0 L244.0,420.0" fill="none" stroke="#245b82" stroke-width="7.4" stroke-linejoin="round"/>
<path d="M168.0,655.0 L178.0,486.0 L244.0,420.0" fill="none" stroke="#cfe1ee" stroke-width="5" stroke-linejoin="round"/>
<line x1="197.8" y1="466.2" x2="211.0" y2="453.0" stroke="#245b82" stroke-width="1.4" marker-end="url(#ah-blue)"/>
<path d="M403.0,657.0 L393.0,486.0 L332.0,420.0" fill="none" stroke="#245b82" stroke-width="7.4" stroke-linejoin="round"/>
<path d="M403.0,657.0 L393.0,486.0 L332.0,420.0" fill="none" stroke="#cfe1ee" stroke-width="5" stroke-linejoin="round"/>
<line x1="374.7" y1="466.2" x2="362.5" y2="453.0" stroke="#245b82" stroke-width="1.4" marker-end="url(#ah-blue)"/>
<text x="288.0" y="526.0" font-size="12" fill="#245b82" font-weight="700" text-anchor="middle">channels(?) · מזקות</text>
<text x="288.0" y="541.0" font-size="12" fill="#245b82" text-anchor="middle">watered from the great wadi</text>
<text x="288.0" y="556.0" font-size="12" fill="#245b82" text-anchor="middle">two drawn; number not given</text>
<text x="496.0" y="746.0" font-size="10.5" fill="#8d8780" text-anchor="end">Not to scale: the text gives no sizes.</text>
<rect x="528.0" y="176.0" width="324.0" height="380.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="540.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">SECTION · “in its floor”</text>
<rect x="529.0" y="268.0" width="322.0" height="287.0" fill="url(#rockfill)" stroke="none" stroke-width="1.0" fill-opacity="0.8"/>
<line x1="529.0" y1="268.0" x2="851.0" y2="268.0" stroke="#a49a8b" stroke-width="1.6"/>
<text x="540.0" y="260.0" font-size="10.5" fill="#8d8780" font-style="italic">ground</text>
<path d="M686.0,268 C686.0,308 605.0,318 605.0,458 Q605.0,488 635.0,488 L765.0,488 Q795.0,488 795.0,458 C795.0,318 714.0,308 714.0,268" fill="#eef4f8" stroke="#245b82" stroke-width="4" stroke-linejoin="round"/>
<rect x="686.0" y="265.0" width="28.0" height="6.0" fill="#fbfaf7" stroke="none" stroke-width="1.0"/>
<rect x="558.0" y="294.0" width="124.0" height="12.0" fill="#cfe1ee" stroke="#245b82" stroke-width="1.2"/>
<line x1="574.0" y1="300.0" x2="604.0" y2="300.0" stroke="#245b82" stroke-width="1.3" marker-end="url(#ah-blue)"/>
<text x="558.0" y="324.0" font-size="10.5" fill="#245b82">channel</text>
<text x="700.0" y="398.0" font-size="10.5" fill="#245b82" text-anchor="middle">plastered lining</text>
<text x="700.0" y="412.0" font-size="10.5" fill="#245b82" text-anchor="middle">(thick blue line)</text>
<path d="M694.0,472 L706.0,484 M706.0,472 L694.0,484" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="700.0" y="464.0" font-size="11" fill="#8e2e22" font-weight="700" text-anchor="middle">11 talents</text>
<text x="540.0" y="542.0" font-size="10.5" fill="#8d8780">Depth of the cistern and of the deposit not given.</text>
<text x="528.0" y="586.0" font-size="12.5" fill="#2a2420" font-weight="700">Reading the words</text>
<text x="528.0" y="606.0" font-size="11.5" fill="#5a524a">בור is a cistern (lexicon: high). מזקא / מזקות</text>
<text x="528.0" y="621.2" font-size="11.5" fill="#5a524a">is a rare technical word found in neither the</text>
<text x="528.0" y="636.4" font-size="11.5" fill="#5a524a">Bible nor the Mishnah; its meaning is rated</text>
<text x="528.0" y="651.5" font-size="11.5" fill="#5a524a">medium.</text>
<text x="528.0" y="672.7" font-size="11.5" fill="#5a524a">The only other occurrence is entry 9's channel</text>
<text x="528.0" y="687.9" font-size="11.5" fill="#5a524a">at II 9.</text>
<rect x="890.0" y="100.0" width="470.0" height="270.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Milik: a wheel-well, not a cistern</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Milik reads another word, bkyrgr, “a wheel-well”;</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">his DJD word list puts no cistern at X 3.</text>
<rect x="904.0" y="342.0" width="212.6" height="18.0" fill="#f6e7e3" stroke="#c08a7f" stroke-width="1" rx="9"/>
<text x="912.0" y="355.0" font-size="10.5" fill="#7a2f22" font-weight="600">Alternative reading · not adopted</text>
<path d="M908.0,298.0 L1048.0,292.0 L1198.0,302.0 L1342.0,296.0" fill="none" stroke="#d7cbb3" stroke-width="16" stroke-linejoin="round"/>
<path d="M908.0,298.0 L1048.0,292.0 L1198.0,302.0 L1342.0,296.0" fill="none" stroke="#b8a888" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="8 5"/>
<circle cx="1048.0" cy="222.0" r="18.0" fill="#3b2e22" stroke="#8a5a17" stroke-width="1.6"/>
<circle cx="1082.0" cy="210.0" r="15.0" fill="none" stroke="#3f3226" stroke-width="1.6"/>
<line x1="1082.0" y1="195.0" x2="1082.0" y2="225.0" stroke="#3f3226" stroke-width="1"/>
<line x1="1092.6" y1="199.4" x2="1071.4" y2="220.6" stroke="#3f3226" stroke-width="1"/>
<line x1="1097.0" y1="210.0" x2="1067.0" y2="210.0" stroke="#3f3226" stroke-width="1"/>
<line x1="1092.6" y1="220.6" x2="1071.4" y2="199.4" stroke="#3f3226" stroke-width="1"/>
<circle cx="1082.0" cy="210.0" r="2.2" fill="#3f3226" stroke="none" stroke-width="1.0"/>
<line x1="1067.0" y1="210.0" x2="1054.0" y2="220.0" stroke="#3f3226" stroke-width="1"/>
<path d="M1039,221 L1049,231 M1049,221 L1039,231" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1120.0" y="206.0" font-size="11.5" fill="#5a524a">well shaft lifted by a wheel</text>
<text x="1120.0" y="220.4" font-size="11.5" fill="#5a524a">deposit at its floor (X 4)</text>
<text x="1120.0" y="242.0" font-size="10.5" fill="#8d8780" font-style="italic">rest of Milik's line not recorded</text>
<line x1="1046.0" y1="242.0" x2="1048.0" y2="286.0" stroke="#245b82" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="1058.0" y="280.0" font-size="12" fill="#245b82" font-weight="700">?</text>
<rect x="890.0" y="380.0" width="470.0" height="250.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="404.0" font-size="14" fill="#2a2420" font-weight="700">Same letters, sense obscure</text>
<text x="904.0" y="424.0" font-size="11.5" fill="#5a524a">Puech 2006 and Lefkovits agree on בור גר מזקות; the sense</text>
<text x="904.0" y="440.0" font-size="11.5" fill="#5a524a">is obscure. If the channels go, only cistern and floor remain.</text>
<rect x="904.0" y="602.0" width="70.0" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="615.0" font-size="10.5" fill="#5f574e" font-weight="600">Sense open</text>
<circle cx="988.0" cy="523.0" r="30.0" fill="#dfe9f0" stroke="#245b82" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="988.0" cy="523.0" r="3.2" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<path d="M993,528.0 L1003,538.0 M1003,528.0 L993,538.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="1018.0" y1="523.0" x2="1078.0" y2="523.0" stroke="#245b82" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1084.0" y="527.0" font-size="13" fill="#245b82" font-weight="700">?</text>
<text x="1128.0" y="509.0" font-size="11.5" fill="#5a524a">fixed: a cistern, its floor,</text>
<text x="1128.0" y="523.4" font-size="11.5" fill="#5a524a">11 talents</text>
<text x="1128.0" y="537.8" font-size="11.5" fill="#5a524a">open: what feeds it</text>
<rect x="890.0" y="640.0" width="470.0" height="170.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="664.0" font-size="14" fill="#2a2420" font-weight="700">Readings that do not change the plan</text>
<rect x="904.0" y="782.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="906.0" y="692.0" font-size="11.5" fill="#5a524a">• Second word: Phase 1 gives Puech's as שרוי; the text shown has שרוו.</text>
<text x="906.0" y="711.2" font-size="11.5" fill="#5a524a">• Milik's DJD list of בור gives xii 3 where Puech has X 3.</text>
<text x="906.0" y="730.4" font-size="11.5" fill="#5a524a">• “The great wadi” · נחל is read by all; the files name no wadi.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (X 3–4)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the plastered(?) cistern of the channels(?) that are watered from the great wadi, in its floor:</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">11 talents.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">Puech 2015's sense (p. 87): channels fed by the wadi run into one plastered cistern. “Its floor” is</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">taken as the cistern's floor. Number of channels, sizes and orientation are not given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low. Candidates kept for comparison: Bir Ayyub (En-Rogel) at the Kidron–Hinnom</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">junction, and the Tekoa–Herodium sector (area only); both possible, low.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">phase5_assessments.csv (39–45): cemented cisterns at Tekoa and a reservoir and aqueduct at Herodium</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">are reported, but no site is narrowed down; the scroll's cistern is not identified.</text>
</svg>
