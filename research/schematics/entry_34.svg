<text x="370.0" y="558.0" font-size="10.5" fill="#8d8780" font-style="italic">valley sides: dotted</text>
<ellipse cx="280.0" cy="432.0" rx="74" ry="42" fill="#c98a2e" fill-opacity="0.10" stroke="#8a5a17" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M259.2,420.3 L272.2,413.8 L293.0,416.4 L302.1,428.1 L298.2,443.7 L280.0,448.9 L261.8,445.0 L256.6,433.3 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M274,426 L286,438 M286,426 L274,438" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="284.0" y1="414.0" x2="310.0" y2="290.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="314.0" y="276.0" font-size="12.5" fill="#2a2420" font-weight="700">the stone · האבן</text>
<text x="314.0" y="292.0" font-size="11.5" fill="#5a524a">in the middle of the ◦</text>
<line x1="220.0" y1="458.0" x2="170.0" y2="550.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="80.0" y="566.0" font-size="11.5" fill="#8a5a17" font-weight="600">the ◦: an unclear word · בתך דר</text>
<text x="80.0" y="582.0" font-size="11" fill="#8d8780">last letter unread; drawn as a dashed zone</text>
<line x1="288.0" y1="440.0" x2="320.0" y2="610.0" stroke="#5a524a" stroke-width="0.8"/>
<text x="260.0" y="626.0" font-size="11.5" fill="#8e2e22" font-weight="600">on the stone, dig 17 cubits ≈ 8.5 m;</text>
<text x="260.0" y="640.4" font-size="11.5" fill="#8e2e22">under it: silver and gold, 17 talents</text>
<text x="60.0" y="749.0" font-size="11" fill="#8d8780">Plan not to scale; the section is to scale in depth.</text>
<rect x="520.0" y="190.0" width="330.0" height="519.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="1" rx="4"/>
<text x="532.0" y="212.0" font-size="12.5" fill="#2a2420" font-weight="700">Section at the stone</text>
<text x="532.0" y="228.0" font-size="11" fill="#8d8780">depth to scale; 1 cubit ≈ 0.5 m</text>
<rect x="521.0" y="310.0" width="328.0" height="329.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="521.0" y1="310.0" x2="849.0" y2="310.0" stroke="#2a2420" stroke-width="1.4"/>
<text x="532.0" y="302.0" font-size="11" fill="#5a524a" font-style="italic">valley floor</text>
<path d="M623.0,285.4 L637.0,278.4 L659.4,281.2 L669.2,293.8 L665.0,310.6 L645.4,316.2 L625.8,312.0 L620.2,299.4 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.5" stroke-linejoin="round"/>
<text x="645.4" y="270.0" font-size="11" fill="#2a2420" font-weight="600" text-anchor="middle">the stone</text>
<rect x="632.4" y="314.0" width="26.0" height="285.0" fill="#fbf6ee" stroke="#8e2e22" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M639.4,585 L651.4,597 M651.4,585 L639.4,597" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="685.4" y1="310.0" x2="685.4" y2="599.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="690.4" y1="310.0" x2="680.4" y2="310.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="690.4" y1="599.0" x2="680.4" y2="599.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="675.4" y="454.5" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 675.4 454.5)"></text>
<text x="695.4" y="450.5" font-size="11.5" fill="#8e2e22" font-weight="700">dig 17 cubits</text>
<text x="695.4" y="464.9" font-size="11.5" fill="#8e2e22">≈ 8.5 m</text>
<text x="595.4" y="623.0" font-size="11" fill="#8e2e22" font-weight="600">silver and gold, 17 talents</text>
<rect x="532.0" y="673.0" width="34.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="566.0" y="673.0" width="34.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="532.0" y="693.0" font-size="11" fill="#2a2420">0</text>
<text x="600.0" y="693.0" font-size="11" fill="#2a2420" text-anchor="middle">2 m</text>
<rect x="890.0" y="100.0" width="470.0" height="342.5" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Puech 2006, Lefkovits 2000: an engraved inscription</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Both read כתב חרת: “in the middle of the engraved inscription,</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">on the stone”. The atlas title follows them.</text>
<rect x="904.0" y="414.5" width="212.6" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="427.5" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading · atlas title</text>
<rect x="928.0" y="200.0" width="190.0" height="120.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.6" rx="6"/>
<line x1="948.0" y1="222.0" x2="1098.0" y2="222.0" stroke="#7d7264" stroke-width="1.6" stroke-dasharray="9 3 4 3"/>
<line x1="948.0" y1="241.0" x2="1074.0" y2="241.0" stroke="#7d7264" stroke-width="1.6" stroke-dasharray="9 3 4 3"/>
<line x1="948.0" y1="260.0" x2="1098.0" y2="260.0" stroke="#7d7264" stroke-width="1.6" stroke-dasharray="9 3 4 3"/>
<line x1="948.0" y1="279.0" x2="1074.0" y2="279.0" stroke="#7d7264" stroke-width="1.6" stroke-dasharray="9 3 4 3"/>
<line x1="948.0" y1="298.0" x2="1098.0" y2="298.0" stroke="#7d7264" stroke-width="1.6" stroke-dasharray="9 3 4 3"/>
<path d="M1017.0,256.0 L1029.0,268.0 M1029.0,256.0 L1017.0,268.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1023.0" y="340.0" font-size="10.5" fill="#5a524a" text-anchor="middle">stone face with inscription</text>
<text x="1144.0" y="210.0" font-size="11.5" fill="#5a524a">The landmark is a written marker:</text>
<text x="1144.0" y="224.4" font-size="11.5" fill="#5a524a">the stone bears the inscription,</text>
<text x="1144.0" y="238.8" font-size="11.5" fill="#5a524a">and the digging starts at its</text>
<text x="1144.0" y="253.1" font-size="11.5" fill="#5a524a">middle. Depth and contents</text>
<text x="1144.0" y="267.5" font-size="11.5" fill="#5a524a">are the same: 17 cubits,</text>
<text x="1144.0" y="281.9" font-size="11.5" fill="#5a524a">17 talents.</text>
<text x="928.0" y="364.0" font-size="11" fill="#8d8780">The lexicon rates the meaning low (one Bible use, Exod 32:16).</text>
<rect x="890.0" y="452.5" width="470.0" height="342.5" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="476.5" font-size="14" fill="#2a2420" font-weight="700">Milik: the steep part of a slope</text>
<text x="904.0" y="496.5" font-size="11.5" fill="#5a524a">The landmark is a feature of the terrain; the stone lies in</text>
<text x="904.0" y="512.5" font-size="11.5" fill="#5a524a">the middle of the steep stretch. His Hebrew is not printed.</text>
<rect x="904.0" y="767.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="780.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<path d="M918.0,572.5 L968.0,580.5 L1008.0,612.5 L1068.0,692.5 L1108.0,712.5 L1178.0,718.5 L1178.0,762.5 L918.0,762.5 Z" fill="url(#earth)" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<path d="M918.0,572.5 L968.0,580.5 L1008.0,612.5 L1068.0,692.5 L1108.0,712.5 L1178.0,718.5" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="1008.0" y1="612.5" x2="1068.0" y2="692.5" stroke="#8e2e22" stroke-width="4" opacity="0.25"/>
<path d="M1026.8,638.2 L1033.8,634.7 L1045.0,636.1 L1049.9,642.4 L1047.8,650.8 L1038.0,653.6 L1028.2,651.5 L1025.4,645.2 Z" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="1038.0" y1="652.5" x2="1038.0" y2="722.5" stroke="#8e2e22" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M1033,717.5 L1043,727.5 M1043,717.5 L1033,727.5" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1074.0" y="654.5" font-size="10.5" fill="#8e2e22" font-weight="600">steep part</text>
<text x="1114.0" y="738.5" font-size="10.5" fill="#5a524a" font-style="italic">valley floor</text>
<text x="918.0" y="564.5" font-size="10.5" fill="#5a524a" font-style="italic">slope</text>
<text x="1194.0" y="572.5" font-size="11.5" fill="#5a524a">Section across the</text>
<text x="1194.0" y="586.9" font-size="11.5" fill="#5a524a">valley side, not to</text>
<text x="1194.0" y="601.2" font-size="11.5" fill="#5a524a">scale. The stone sits</text>
<text x="1194.0" y="615.6" font-size="11.5" fill="#5a524a">on the slope, not on</text>
<text x="1194.0" y="630.0" font-size="11.5" fill="#5a524a">the floor; the dig is</text>
<text x="1194.0" y="644.4" font-size="11.5" fill="#5a524a">still 17 cubits.</text>
<rect x="40.0" y="815.0" width="1320.0" height="169.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Text (VIII 4–7)</text>
<text x="60.0" y="858.0" font-size="11.5" fill="#5a524a">“In the outer valley, in the middle of the ◦ (an unclear word), on the stone, dig seventeen cubits;</text>
<text x="60.0" y="873.2" font-size="11.5" fill="#5a524a">under it: silver and gold, 17 talents.”</text>
<text x="60.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.4" font-size="11.5" fill="#5a524a">The stone lies on the valley floor in the middle of the unclear landmark. The seventeen cubits are a</text>
<text x="60.0" y="928.5" font-size="11.5" fill="#5a524a">digging depth at the stone, and “under it” means under the stone. No direction, size or distance is</text>
<text x="60.0" y="943.7" font-size="11.5" fill="#5a524a">given.</text>
<text x="700.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="858.0" font-size="11.5" fill="#5a524a">Atlas: possible only, low. Candidates, each possible, low: Bir Ayyub (En-Rogel) at the Kidron–Hinnom</text>
<text x="700.0" y="873.2" font-size="11.5" fill="#5a524a">junction; the Jericho oasis; Doq (Jebel Qarantal). The valley itself is not identified.</text>
<text x="700.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="913.4" font-size="11.5" fill="#5a524a">phase3_site_index.csv: seven candidates, none best (3 possible, 4 weak). No phase-5 assessment or</text>
<text x="700.0" y="928.5" font-size="11.5" fill="#5a524a">feature constraint names this entry, so nothing on the ground has been checked; readings.json</text>
<text x="700.0" y="943.7" font-size="11.5" fill="#5a524a">e34-inscription: the letters shown are not those of Puech and Lefkovits.</text>
</svg>
