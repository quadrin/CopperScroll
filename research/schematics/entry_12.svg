<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
<title>Copper Scroll entry 12: the courtyard corner</title>
<defs>
 <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2420"/></marker>
 <marker id="ah-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a17"/></marker>
 <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#245b82"/></marker>
 <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e2e22"/></marker>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#efe3cf"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a5a17" stroke-width="1.2"/></pattern>
 <pattern id="rockfill" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e7dfd0"/><circle cx="2" cy="2" r="0.8" fill="#a49a8b"/><circle cx="6" cy="6" r="0.6" fill="#a49a8b"/></pattern>
 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 12 (III 1–4) — the courtyard corner</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up, with a section at the corner. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="695.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Project reading: under the south corner of a court whose name is lost</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">“Court of ◦◦◦”: three letters unread. Court drawn square to the compass; its size is not given.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">“The south corner” drawn as the south-west one, so 12a’s “eastern one” is the south-east.</text>
<rect x="54.0" y="767.0" width="101.0" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="780.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project reading</text>
<rect x="130.0" y="220.0" width="340.0" height="350.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M130.0,220.0 L470.0,220.0 L470.0,570.0 L130.0,570.0 L130.0,220.0" fill="none" stroke="#7d7264" stroke-width="8" stroke-linejoin="miter"/>
<text x="300.0" y="385.0" font-size="13" fill="#2a2420" font-weight="700" text-anchor="middle">court · חצר</text>
<text x="300.0" y="401.2" font-size="13" fill="#2a2420" text-anchor="middle">name lost · בחצר ◦◦◦</text>
<text x="300.0" y="554.0" font-size="11" fill="#8d8780" text-anchor="middle" font-style="italic">south side</text>
<path d="M86,204 L94,236 L86,230 L78,236 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="86.0" y="198.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<path d="M140,548 L152,560 M152,548 L140,560" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<circle cx="130.0" cy="570.0" r="16.0" fill="none" stroke="#b33a2a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="110.0" y="604.0" font-size="12" fill="#2a2420" font-weight="700">the south corner · הפנא הדרומית</text>
<text x="110.0" y="622.0" font-size="11.5" fill="#8e2e22" font-weight="600">under it, dig 9 cubits ≈ 4.5 m:</text>
<text x="110.0" y="636.4" font-size="11.5" fill="#8e2e22">vessels of silver and gold of offering,</text>
<text x="110.0" y="650.8" font-size="11.5" fill="#8e2e22">609 in all</text>
<path d="M449,549 L459,559 M459,549 L449,559" fill="none" stroke="#8d8780" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="470.0" cy="570.0" r="16.0" fill="none" stroke="#8d8780" stroke-width="1" stroke-dasharray="3 3"/>
<text x="490.0" y="604.0" font-size="11" fill="#8d8780" text-anchor="end">entry 12a: “the other corner,</text>
<text x="490.0" y="617.8" font-size="11" fill="#8d8780" text-anchor="end">the eastern one” (own sheet)</text>
<text x="60.0" y="749.0" font-size="11" fill="#8d8780">Court size and proportions are arbitrary; only the section is to scale.</text>
<rect x="540.0" y="200.0" width="310.0" height="410.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="1" rx="4"/>
<text x="552.0" y="222.0" font-size="12.5" fill="#2a2420" font-weight="700">Section at the south corner</text>
<text x="552.0" y="238.0" font-size="11" fill="#8d8780">depth to scale; 1 cubit ≈ 0.5 m</text>
<rect x="541.0" y="320.0" width="308.0" height="220.0" fill="url(#earth)" stroke="none" stroke-width="1.0"/>
<line x1="541.0" y1="320.0" x2="849.0" y2="320.0" stroke="#2a2420" stroke-width="1.4"/>
<text x="552.0" y="312.0" font-size="11" fill="#5a524a" font-style="italic">court floor</text>
<rect x="648.2" y="268.0" width="44.0" height="52.0" fill="#d9d0bf" stroke="#7d7264" stroke-width="1.4"/>
<text x="670.2" y="260.0" font-size="11" fill="#2a2420" font-weight="600" text-anchor="middle">the corner</text>
<rect x="656.2" y="320.0" width="28.0" height="180.0" fill="#fbf6ee" stroke="#8e2e22" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M664.2,486 L676.2,498 M676.2,486 L664.2,498" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="630.2" y="524.0" font-size="11" fill="#8e2e22" font-weight="600">vessels; basins, cups,</text>
<text x="630.2" y="537.8" font-size="11" fill="#8e2e22">bowls, libation jugs</text>
<line x1="716.2" y1="320.0" x2="716.2" y2="500.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="721.2" y1="320.0" x2="711.2" y2="320.0" stroke="#8e2e22" stroke-width="1.2"/>
<line x1="721.2" y1="500.0" x2="711.2" y2="500.0" stroke="#8e2e22" stroke-width="1.2"/>
<text x="706.2" y="410.0" font-size="11" fill="#8e2e22" font-weight="600" text-anchor="middle" transform="rotate(90.0 706.2 410.0)"></text>
<text x="726.2" y="406.0" font-size="11.5" fill="#8e2e22" font-weight="700">dig 9 cubits</text>
<text x="726.2" y="420.4" font-size="11.5" fill="#8e2e22">≈ 4.5 m</text>
<rect x="552.0" y="576.0" width="40.0" height="6.0" fill="#2a2420" stroke="none" stroke-width="1.0"/>
<rect x="592.0" y="576.0" width="40.0" height="6.0" fill="#fbfaf7" stroke="#2a2420" stroke-width="1"/>
<text x="552.0" y="596.0" font-size="11" fill="#2a2420">0</text>
<text x="632.0" y="596.0" font-size="11" fill="#2a2420" text-anchor="middle">2 m</text>
<rect x="890.0" y="100.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Milik 1962: the court is the peribolos</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">The Temple enclosure itself; the corner is one of its corners.</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">Same text, much larger plan (DJD pp. 272–274).</text>
<rect x="904.0" y="297.0" width="125.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="310.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading</text>
<rect x="918.0" y="176.0" width="103.0" height="103.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M918.0,176.0 L1021.0,176.0 L1021.0,279.0 L918.0,279.0 L918.0,176.0" fill="none" stroke="#7d7264" stroke-width="6" stroke-linejoin="miter"/>
<path d="M925,262.0 L935,272.0 M935,262.0 L925,272.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<rect x="957.5" y="218.5" width="24.0" height="18.0" fill="none" stroke="#8d8780" stroke-width="1" stroke-dasharray="3 2"/>
<text x="969.5" y="251.5" font-size="10" fill="#8d8780" text-anchor="middle">an inner court</text>
<text x="1045.0" y="194.0" font-size="11.5" fill="#5a524a">peribolos: the enclosure wall</text>
<text x="1045.0" y="208.4" font-size="11.5" fill="#5a524a">and its outer court.</text>
<text x="1045.0" y="222.8" font-size="11.5" fill="#5a524a">Size not given in the records;</text>
<text x="1045.0" y="237.1" font-size="11.5" fill="#5a524a">the corner would be a corner of</text>
<text x="1045.0" y="251.5" font-size="11.5" fill="#5a524a">the enclosure, not of a small court.</text>
<rect x="890.0" y="335.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="359.0" font-size="14" fill="#2a2420" font-weight="700">Puech 2006, Lefkovits 2000: a named court</text>
<text x="904.0" y="379.0" font-size="11.5" fill="#5a524a">Puech: “court of the … Tribunal(?)”, Greek δίαιτα.</text>
<text x="904.0" y="395.0" font-size="11.5" fill="#5a524a">Lefkovits: “Court of Nebaṭ” · נבט.</text>
<rect x="904.0" y="532.0" width="194.0" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="545.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the name, not the plan</text>
<rect x="918.0" y="415.0" width="110.0" height="93.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M918.0,415.0 L1028.0,415.0 L1028.0,508.0 L918.0,508.0 L918.0,415.0" fill="none" stroke="#7d7264" stroke-width="5" stroke-linejoin="miter"/>
<path d="M924,492.0 L934,502.0 M934,492.0 L924,502.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1058.0" y="437.0" font-size="11.5" fill="#5a524a">Each edition restores the lost name</text>
<text x="1058.0" y="451.4" font-size="11.5" fill="#5a524a">differently. Any named court gives</text>
<text x="1058.0" y="465.8" font-size="11.5" fill="#5a524a">the same plan: a corner on the south,</text>
<text x="1058.0" y="480.1" font-size="11.5" fill="#5a524a">dig nine cubits.</text>
<rect x="890.0" y="570.0" width="470.0" height="225.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="594.0" font-size="14" fill="#2a2420" font-weight="700">One hiding place or two?</text>
<text x="904.0" y="614.0" font-size="11.5" fill="#5a524a">Puech (p. 173 n. 26) and Milik split III 5–7 off as 12a;</text>
<text x="904.0" y="630.0" font-size="11.5" fill="#5a524a">Lefkovits keeps one item, two corners (p. 142).</text>
<rect x="904.0" y="767.0" width="200.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="780.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the count, not the plan</text>
<rect x="918.0" y="650.0" width="110.0" height="93.0" fill="#f4efe6" stroke="none" stroke-width="1.0"/>
<path d="M918.0,650.0 L1028.0,650.0 L1028.0,743.0 L918.0,743.0 L918.0,650.0" fill="none" stroke="#7d7264" stroke-width="5" stroke-linejoin="miter"/>
<path d="M924,727.0 L934,737.0 M934,727.0 L924,737.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<path d="M1012,727.0 L1022,737.0 M1022,727.0 L1012,737.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="1058.0" y="672.0" font-size="11.5" fill="#5a524a">Either way two deposits at two corners</text>
<text x="1058.0" y="686.4" font-size="11.5" fill="#5a524a">of one court: 9 cubits at the south</text>
<text x="1058.0" y="700.8" font-size="11.5" fill="#5a524a">corner, 16 at “the other, the eastern</text>
<text x="1058.0" y="715.1" font-size="11.5" fill="#5a524a">one”. Only the count changes.</text>
<rect x="40.0" y="815.0" width="1320.0" height="169.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Text (III 1–4)</text>
<text x="60.0" y="858.0" font-size="11.5" fill="#5a524a">“In the court of ◦◦◦, under the south corner, dig nine cubits: vessels of silver and gold of</text>
<text x="60.0" y="873.2" font-size="11.5" fill="#5a524a">offering, sprinkling basins, cups, bowls, libation jugs; in all, six hundred and nine.”</text>
<text x="60.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="913.4" font-size="11.5" fill="#5a524a">A walled court square to the compass, north up. “The south corner” is drawn as the south-west one so</text>
<text x="60.0" y="928.5" font-size="11.5" fill="#5a524a">that 12a’s “other corner, the eastern one” is the south-east; the text fixes neither, nor the court’s</text>
<text x="60.0" y="943.7" font-size="11.5" fill="#5a524a">size. The nine cubits are read as a digging depth under the corner.</text>
<text x="700.0" y="841.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="858.0" font-size="11.5" fill="#5a524a">Atlas: possible only, low. Candidate: Temple enclosure (Temple Mount), possible, low. The site index</text>
<text x="700.0" y="873.2" font-size="11.5" fill="#5a524a">supplies no identified landmark; the scroll’s court has not been identified.</text>
<text x="700.0" y="896.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="913.4" font-size="11.5" fill="#5a524a">phase5_assessments.csv (JER, entries 3–14): the enclosure’s walls, corners and fill are reported</text>
<text x="700.0" y="928.5" font-size="11.5" fill="#5a524a">(Shukron &amp; Reich 2011; Warren 1871), but the court’s name is restored in every edition, so the entry</text>
<text x="700.0" y="943.7" font-size="11.5" fill="#5a524a">stays possible, low. The vessel list uses Temple-list words (deeper_analysis_2026-09-30.md §3.2).</text>
</svg>
