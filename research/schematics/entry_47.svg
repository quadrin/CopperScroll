<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
<title>Copper Scroll entry 47: the basin in the valley</title>
<defs>
 <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2420"/></marker>
 <marker id="ah-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a17"/></marker>
 <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#245b82"/></marker>
 <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e2e22"/></marker>
 <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#efe3cf"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a5a17" stroke-width="1.2"/></pattern>
 <pattern id="rockfill" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e7dfd0"/><circle cx="2" cy="2" r="0.8" fill="#a49a8b"/><circle cx="6" cy="6" r="0.6" fill="#a49a8b"/></pattern>
 <pattern id="field" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1e4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#b9c4a0" stroke-width="0.8"/></pattern>
 <pattern id="earth" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe6d6"/><circle cx="3" cy="3" r="0.9" fill="#c9b897"/></pattern>
</defs>
<rect width="1400" height="1000" fill="#fbfaf7"/>
<text x="40.0" y="48.0" font-size="24" fill="#2a2420" font-weight="700">Entry 47 (X 8–11) — the basin in the valley</text>
<text x="40.0" y="74.0" font-size="14.5" fill="#5a524a">Schematic plan, north up. One arrangement the text allows; not a reconstruction of any real site.</text>
<rect x="40.0" y="100.0" width="830.0" height="710.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="54.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Text shown (Milik, Lefkovits): a black stone on the basin's west side</text>
<text x="54.0" y="144.0" font-size="11.5" fill="#5a524a">Milik 1960: “pool of the vale of …, on the west side”; Lefkovits: “its western side”.</text>
<text x="54.0" y="160.0" font-size="11.5" fill="#5a524a">The black stone is “the entrance”; the deposit is drawn just behind it (assumed).</text>
<rect x="54.0" y="782.0" width="156.8" height="18.0" fill="#e5efe2" stroke="#6f9a63" stroke-width="1" rx="9"/>
<text x="62.0" y="795.0" font-size="10.5" fill="#2f5a26" font-weight="600">Project text · west side</text>
<rect x="58.0" y="176.0" width="450.0" height="590.0" fill="url(#rockfill)" stroke="#d6cfc4" stroke-width="0.8" fill-opacity="0.5"/>
<text x="70.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">PLAN</text>
<path d="M208,177 C178,376 168,556 198,765 L388,765 C418,556 408,376 378,177 Z" fill="#efe6d6" stroke="#c2ae8a" stroke-width="1" stroke-linejoin="round"/>
<path d="M294.0,178.0 L286.0,336.0 L294.0,506.0 L288.0,764.0" fill="none" stroke="#d7cbb3" stroke-width="16" stroke-linejoin="round"/>
<path d="M294.0,178.0 L286.0,336.0 L294.0,506.0 L288.0,764.0" fill="none" stroke="#b8a888" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text x="402.0" y="646.0" font-size="12" fill="#7d6a4a" font-weight="700">Valley of</text>
<text x="402.0" y="661.0" font-size="12" fill="#7d6a4a">Zered(?) · גי זרד</text>
<text x="402.0" y="676.0" font-size="12" fill="#7d6a4a">name disputed</text>
<path d="M290.0,436.0 L166.3,559.7 A175,175 0 0,1 166.3,312.3 Z" fill="#c98a2e" stroke="none" stroke-width="1.0" stroke-linejoin="round" fill-opacity="0.14"/>
<line x1="290.0" y1="436.0" x2="413.7" y2="312.3" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="290.0" y1="436.0" x2="413.7" y2="559.7" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="290.0" y1="436.0" x2="166.3" y2="559.7" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="290.0" y1="436.0" x2="166.3" y2="312.3" stroke="#8d8780" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="215.0" y="388.0" width="150.0" height="96.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.6"/>
<path d="M219.0,450.4 q18.75,-3 37.5,0 t37.5,0 t37.5,0" fill="none" stroke="#5d8fb3" stroke-width="0.9" stroke-linejoin="round"/>
<text x="342.0" y="502.0" font-size="12" fill="#245b82" font-weight="700" text-anchor="middle">basin · ים</text>
<text x="342.0" y="517.0" font-size="12" fill="#245b82" text-anchor="middle">size not given</text>
<text x="76.0" y="306.0" font-size="12" fill="#8a5a17" font-weight="700">WEST side · בצדו המערבי</text>
<rect x="202.5" y="427.0" width="9.0" height="30.0" fill="#1f1b18" stroke="#000000" stroke-width="1" rx="2"/>
<path d="M179.0,436 L191.0,448 M191.0,436 L179.0,448" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="179.0" y1="450.0" x2="128.0" y2="512.0" stroke="#8e2e22" stroke-width="0.8"/>
<text x="76.0" y="528.0" font-size="11.5" fill="#8e2e22" font-weight="700">300 talents of gold,</text>
<text x="76.0" y="542.4" font-size="11.5" fill="#8e2e22">twenty cups</text>
<line x1="207.0" y1="426.0" x2="154.0" y2="372.0" stroke="#2a2420" stroke-width="0.8"/>
<text x="76.0" y="344.0" font-size="11.5" fill="#2a2420" font-weight="700">black stone, 2 cubits</text>
<text x="76.0" y="358.4" font-size="11.5" fill="#2a2420">= the entrance</text>
<path d="M478,210 L486,242 L478,236 L470,242 Z" fill="#2a2420" stroke="none" stroke-width="1.0" stroke-linejoin="round"/>
<text x="478.0" y="204.0" font-size="14" fill="#2a2420" font-weight="700" text-anchor="middle">N</text>
<text x="496.0" y="754.0" font-size="10.5" fill="#8d8780" text-anchor="end">Not to scale; basin and stone enlarged.</text>
<rect x="528.0" y="176.0" width="324.0" height="380.0" fill="#fbfaf7" stroke="#d6cfc4" stroke-width="0.8"/>
<text x="540.0" y="198.0" font-size="12" fill="#2a2420" font-weight="700">DETAIL · the west side, enlarged</text>
<text x="540.0" y="214.0" font-size="10.5" fill="#8d8780" font-style="italic">plan, north up; 1 cubit ≈ 0.5 m</text>
<rect x="782.0" y="236.0" width="69.0" height="310.0" fill="#bcd6e8" stroke="none" stroke-width="1.0"/>
<line x1="782.0" y1="236.0" x2="782.0" y2="546.0" stroke="#245b82" stroke-width="2.2"/>
<text x="790.0" y="256.0" font-size="11" fill="#245b82">basin</text>
<rect x="759.0" y="331.0" width="18.0" height="110.0" fill="#1f1b18" stroke="#000000" stroke-width="1" rx="2"/>
<line x1="744.0" y1="331.0" x2="744.0" y2="441.0" stroke="#2a2420" stroke-width="1.2"/>
<line x1="749.0" y1="331.0" x2="739.0" y2="331.0" stroke="#2a2420" stroke-width="1.2"/>
<line x1="749.0" y1="441.0" x2="739.0" y2="441.0" stroke="#2a2420" stroke-width="1.2"/>
<text x="734.0" y="386.0" font-size="11" fill="#2a2420" font-weight="600" text-anchor="middle" transform="rotate(90.0 734.0 386.0)">2 cubits ≈ 1 m</text>
<text x="778.0" y="291.0" font-size="11.5" fill="#2a2420" font-weight="700" text-anchor="end">black stone · אבן, drawn as its length</text>
<text x="778.0" y="305.4" font-size="11.5" fill="#2a2420" text-anchor="end">= “the entrance” · פתח</text>
<line x1="722.0" y1="386.0" x2="670.0" y2="386.0" stroke="#3f3226" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-ink)"/>
<path d="M647,379 L661,393 M661,379 L647,393" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<text x="654.0" y="414.0" font-size="11.5" fill="#8e2e22" font-weight="700" text-anchor="middle">300 talents of gold,</text>
<text x="654.0" y="428.4" font-size="11.5" fill="#8e2e22" text-anchor="middle">twenty cups</text>
<text x="654.0" y="446.0" font-size="10.5" fill="#8d8780" text-anchor="middle">behind the entrance (assumed)</text>
<text x="540.0" y="542.0" font-size="10.5" fill="#8d8780">What the entrance leads to is not said.</text>
<text x="528.0" y="582.0" font-size="12.5" fill="#2a2420" font-weight="700">Reading the words</text>
<text x="528.0" y="602.0" font-size="11.5" fill="#5a524a">ים here is a basin or pool, not “sea” or</text>
<text x="528.0" y="617.2" font-size="11.5" fill="#5a524a">“west” as at IX 7 (lexicon: medium). The text</text>
<text x="528.0" y="632.4" font-size="11.5" fill="#5a524a">shown follows Milik's בצדו המערבי.</text>
<text x="528.0" y="653.5" font-size="11.5" fill="#5a524a">“Two cubits” could also give a distance; the</text>
<text x="528.0" y="668.7" font-size="11.5" fill="#5a524a">records do not discuss it.</text>
<rect x="890.0" y="100.0" width="470.0" height="270.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="124.0" font-size="14" fill="#2a2420" font-weight="700">Puech 2006: the chamber by its spring</text>
<text x="904.0" y="144.0" font-size="11.5" fill="#5a524a">Puech reads מעינו, “(the chamber by) its spring”, for “west side”:</text>
<text x="904.0" y="160.0" font-size="11.5" fill="#5a524a">an underground chamber · צריח, and no direction at this point.</text>
<rect x="904.0" y="342.0" width="256.0" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="355.0" font-size="10.5" fill="#5f574e" font-weight="600">Alternative reading · not the text shown</text>
<circle cx="968.0" cy="255.0" r="9.0" fill="#bcd6e8" stroke="#245b82" stroke-width="1.4"/>
<circle cx="968.0" cy="255.0" r="14.4" fill="none" stroke="#245b82" stroke-width="0.8" stroke-dasharray="2 3"/>
<circle cx="968.0" cy="255.0" r="20.7" fill="none" stroke="#245b82" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="968.0" y="289.0" font-size="11" fill="#245b82" font-weight="600" text-anchor="middle">spring · מעין</text>
<rect x="1048.0" y="204.0" width="130.0" height="100.0" fill="#efe6d6" stroke="#3f3226" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1113.0" y="222.0" font-size="11" fill="#3f3226" font-weight="600" text-anchor="middle">chamber</text>
<text x="1113.0" y="236.0" font-size="10.5" fill="#3f3226" text-anchor="middle">(underground)</text>
<rect x="1044.0" y="249.0" width="8.0" height="26.0" fill="#1f1b18" stroke="#000000" stroke-width="1" rx="2"/>
<path d="M1083,267.0 L1093,277.0 M1093,267.0 L1083,277.0" fill="none" stroke="#b33a2a" stroke-width="2" stroke-linejoin="round"/>
<line x1="990.0" y1="255.0" x2="1040.0" y2="262.0" stroke="#245b82" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1192.0" y="234.0" font-size="11.5" fill="#2a2420">black stone at</text>
<text x="1192.0" y="248.4" font-size="11.5" fill="#2a2420">its entrance</text>
<text x="1192.0" y="262.8" font-size="11.5" fill="#2a2420">(one choice)</text>
<rect x="890.0" y="380.0" width="470.0" height="280.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="404.0" font-size="14" fill="#2a2420" font-weight="700">The valley's name: the setting, not the plan</text>
<text x="904.0" y="424.0" font-size="11.5" fill="#5a524a">Every reading keeps a basin in a valley; the name moves it.</text>
<rect x="904.0" y="632.0" width="156.8" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="645.0" font-size="10.5" fill="#5f574e" font-weight="600">Changes the setting only</text>
<text x="906.0" y="450.0" font-size="11.5" fill="#2a2420" font-weight="700">Wolters</text>
<text x="1048.0" y="450.0" font-size="11.5" fill="#5a524a">Valley of Zered · גי זרד (text shown)</text>
<text x="906.0" y="471.0" font-size="11.5" fill="#2a2420" font-weight="700">Puech 2006, 2015</text>
<text x="1048.0" y="471.0" font-size="11.5" fill="#5a524a">valley of Job, south-east of Jerusalem</text>
<text x="906.0" y="492.0" font-size="11.5" fill="#2a2420" font-weight="700">Milik 1962 Addenda</text>
<text x="1048.0" y="492.0" font-size="11.5" fill="#5a524a">Vale of Job = Bîr Ayyûb · גי איך for איב</text>
<text x="906.0" y="513.0" font-size="11.5" fill="#2a2420" font-weight="700">Milik 1956–57</text>
<text x="1048.0" y="513.0" font-size="11.5" fill="#5a524a">Gihon · גיחן</text>
<text x="906.0" y="534.0" font-size="11.5" fill="#2a2420" font-weight="700">Milik 1960</text>
<text x="1048.0" y="534.0" font-size="11.5" fill="#5a524a">name left open</text>
<text x="906.0" y="555.0" font-size="11.5" fill="#2a2420" font-weight="700">Lefkovits 2000</text>
<text x="1048.0" y="555.0" font-size="11.5" fill="#5a524a">Pure Valley</text>
<text x="906.0" y="580.0" font-size="11" fill="#8d8780" font-style="italic">The research rates the name low to medium.</text>
<rect x="890.0" y="670.0" width="470.0" height="140.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="904.0" y="694.0" font-size="14" fill="#2a2420" font-weight="700">Twenty cups or ten?</text>
<rect x="904.0" y="782.0" width="138.2" height="18.0" fill="#eeeae4" stroke="#a39b90" stroke-width="1" rx="9"/>
<text x="912.0" y="795.0" font-size="10.5" fill="#5f574e" font-weight="600">No change to the plan</text>
<text x="906.0" y="722.0" font-size="11.5" fill="#5a524a">Puech 20, Lefkovits 10; the facsimile drawings themselves show 10 or</text>
<text x="906.0" y="737.2" font-size="11.5" fill="#5a524a">20. The text shown has twenty · עסרין.</text>
<rect x="40.0" y="830.0" width="1320.0" height="154.0" fill="#ffffff" stroke="#d6cfc4" stroke-width="1.1" rx="6"/>
<text x="60.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Text (X 8–11)</text>
<text x="60.0" y="873.0" font-size="11.5" fill="#5a524a">“In the basin of the Valley of Zered(?), on its west side, a black stone, two cubits; that is the</text>
<text x="60.0" y="888.2" font-size="11.5" fill="#5a524a">entrance: three hundred talents of gold, and twenty cups.”</text>
<text x="60.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the plan assumes</text>
<text x="60.0" y="928.4" font-size="11.5" fill="#5a524a">A basin in the valley floor; the stone on its west side marks the entrance and the deposit lies just</text>
<text x="60.0" y="943.5" font-size="11.5" fill="#5a524a">behind it. Basin size, the valley's course and what the entrance leads to are not given.</text>
<text x="700.0" y="856.0" font-size="13" fill="#2a2420" font-weight="700">Project placement</text>
<text x="700.0" y="873.0" font-size="11.5" fill="#5a524a">Possible only, low: Bir Ayyub (En-Rogel), Kidron–Hinnom junction, on the “Vale of Job” readings. The</text>
<text x="700.0" y="888.2" font-size="11.5" fill="#5a524a">atlas names no individual feature.</text>
<text x="700.0" y="911.4" font-size="13" fill="#2a2420" font-weight="700">What the records show</text>
<text x="700.0" y="928.4" font-size="11.5" fill="#5a524a">No phase-5 assessment or feature-constraint row is recorded for this entry. The atlas keeps Bir Ayyub</text>
<text x="700.0" y="943.5" font-size="11.5" fill="#5a524a">for comparison only (Phase 3 site index).</text>
</svg>
