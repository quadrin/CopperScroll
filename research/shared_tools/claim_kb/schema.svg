<text x="61" y="188" class="head">1 · Text, witnesses, readings</text>
<text x="61" y="216" class="body">Entry ↔ edition numbering ↔ locus</text>
<text x="61" y="239" class="body">Segment / original / replica / reconstruction</text>
<text x="61" y="262" class="body">Letters, restorations, lexical sense, syntax</text>
<text x="61" y="285" class="body">Interpretation → derived requirement</text>
<rect x="455" y="160" width="355" height="160" rx="7" fill="#edf3ed" stroke="#8fa79c"/>
<text x="471" y="188" class="head">4 · Sources and observations</text>
<text x="471" y="216" class="body">Work → edition → digital copy → locator</text>
<text x="471" y="239" class="body">Archive / campaign / original observation</text>
<text x="471" y="262" class="body">Inspection, rights, hashes, exact pages</text>
<text x="471" y="285" class="body">Observed / reconstruction / inference</text>
