<text x="61" y="486" class="body">Written occurrence ≠ proposed referent</text>
<text x="61" y="509" class="body">Document findspot ≠ mentioned place</text>
<text x="61" y="532" class="body">Composition / object / described dates</text>
<rect x="455" y="430" width="355" height="140" rx="7" fill="#edf3ed" stroke="#8fa79c"/>
<text x="471" y="458" class="head">3 · Places and feature states</text>
<text x="471" y="486" class="body">Feature identity → state → event</text>
<text x="471" y="509" class="body">Measurement endpoints, phase and frame</text>
<text x="471" y="532" class="body">Local plan; registration needed for world</text>
<rect x="240" y="680" width="390" height="150" rx="7" fill="#edf3ed" stroke="#8fa79c"/>
<text x="256" y="708" class="head">5 · Claims and hypotheses</text>
<text x="256" y="736" class="body">Subject + relationship + object / value</text>
<text x="256" y="759" class="body">Supporting / conflicting / prerequisite claims</text>
<text x="256" y="782" class="body">Fixed feature assignment under each branch</text>
<text x="256" y="805" class="body">Separate uncertainty dimensions; revisions</text>
<rect x="240" y="930" width="390" height="140" rx="7" fill="#edf3ed" stroke="#8fa79c"/>
<text x="256" y="958" class="head">6 · Tests, coverage, dependencies</text>
<text x="256" y="986" class="body">Frozen specification + controls + decision rule</text>
<text x="256" y="1009" class="body">Requirement result ≠ inspection ≠ test outcome</text>
<text x="256" y="1032" class="body">Explicit gap → acquisition → conditional effect</text>
