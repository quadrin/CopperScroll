<text x="45" y="1120" class="body">Legend: pale green = record groups; pale tan = conditional result. Null = unestablished. Geometry stays null when unestablished.</text>
<text x="45" y="1146" class="body">Source-plan frames stay local. Repeated reports retain one original-observation lineage. Compatibility supplies no identification confidence.</text>
