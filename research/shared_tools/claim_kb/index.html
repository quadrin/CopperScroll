<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copper Scroll · Claim workbench</title>
<style>
:root{color-scheme:light;--ink:#253333;--line:#d5dcda;--paper:#faf9f5;--accent:#245c55}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}header{padding:20px 28px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 5px}h2{font-size:19px;margin:22px 0 10px}h3{font-size:16px;margin:0 0 6px}p{margin:5px 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,select,input{font:inherit;padding:7px 10px;border:1px solid #a6b7b2;border-radius:4px;background:white;color:var(--ink)}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);background:#ebf2ee}button[aria-pressed=true]{background:var(--accent);color:white}a{color:var(--accent)}main{display:grid;grid-template-columns:minmax(360px,1.15fr) minmax(340px,1fr);min-height:75vh}#content{padding:4px 28px 40px;border-right:1px solid var(--line)}#inspector{padding:18px 24px;position:sticky;top:0;max-height:100vh;overflow:auto;align-self:start;background:#f1f4f0}.record{display:block;text-align:left;width:100%;margin:5px 0;padding:10px 12px}.meta{font-size:12px;color:#4c625e;overflow-wrap:anywhere}.status{font-weight:600}details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;background:#fff;padding:12px;border:1px solid var(--line)}.notice{padding:10px;border-left:3px solid #8d6d35;background:#faf1dc}.small{font-size:13px}.muted{color:#53625e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#error{color:#8c3226;white-space:pre-wrap}svg,img{max-width:100%;height:auto}#loading{padding:20px}.checks{padding-left:16px}.checks li{margin:6px 0}@media(max-width:850px){main{display:block}#content{border:0}#inspector{position:static;max-height:none;border-top:1px solid var(--line)}}
</style>
<header><h1>Copper Scroll · Claim workbench</h1><p>Reviewed exploratory records. Select a claim to follow its readings, assignments, evidence and unknowns.</p><div id="version" class="meta"></div>
<nav aria-label="Views"><button data-view="entry" aria-pressed="true">Entries</button><button data-view="names">Name chronology</button><button data-view="impact">Change impact</button><button data-view="queries">Eight queries</button><button data-view="schema">Schema</button><a href="/">Shared research tools</a></nav></header>
<div id="error" role="alert"></div><div id="loading">Loading local records…</div>
<main hidden><section id="content" aria-label="Evidence browser"></section><aside id="inspector" aria-label="Selected claim"><h2>Evidence chain</h2><p>Select any record. Its stable ID, underlying locator and assumptions appear here.</p></aside></main>
<script>
'use strict';
let graph,version,by,out,reverse,currentView='entry';
const $=s=>document.querySelector(s), el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
async function api(route){const r=await fetch('/api/kb/'+route);const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d;}
function error(e){$('#error').textContent=e.message;}
function selectButton(r,parent){if(!r)return;const b=el('button',undefined,'record');b.append(el('strong',r.label),el('div',r.key,'meta'));if(r.payload.status)b.append(el('span',r.payload.status,'status'));b.onclick=()=>inspect(r.key).catch(error);parent.append(b);return b;}
function group(parent,title,records,open=false){const d=el('details');d.open=open;d.append(el('summary',title+' ('+records.length+')'));for(const r of records)selectButton(r,d);parent.append(d);}
function json(parent,value){parent.append(el('pre',JSON.stringify(value,null,2)));}
function sourceLinks(parent,r){for(const l of r.locators){const d=el('div',undefined,'small');d.append(el('p',l.repo_path+' · '+l.pointer,'meta'));const fields=['printed_page','pdf_page','figure','image_region','archival_identifier'].filter(k=>l[k]!==null&&l[k]!==undefined);for(const f of fields)d.append(el('span',f+': '+JSON.stringify(l[f])+'  '));const a=el('a','Underlying record');a.href='/api/kb/locator?id='+encodeURIComponent(r.key)+'&n='+r.locators.indexOf(l);a.target='_blank';a.rel='noopener';d.append(el('br'),a);parent.append(d);}}
async function inspect(k){const data=(await api('claim?id='+encodeURIComponent(k))).result;const r=by.get(k),p=$('#inspector');p.replaceChildren(el('h2',r.label),el('p',r.key,'meta'));if(r.payload.reassessment?.required)p.append(el('p','Reassessment required after changed evidence. Historical status retained.','notice'));sourceLinks(p,r);json(p,r.payload);
const assumptions=data.assumptions.filter(x=>x.key!==k);group(p,'Assumptions and unresolved dependencies',assumptions);
const selectedFeatures=new Set(r.kind==='feature'?[r.id]:r.kind==='hypothesis'?Object.values(r.payload.assignment):[]);const states=graph.records.filter(x=>x.kind==='state'&&selectedFeatures.has(x.payload.feature_id));if(states.length)group(p,'Historical states · joint phase remains as recorded',states,true);
const links=out.get(k)||[];const d=el('div');d.append(el('h3','Direct evidence and relations'));for(const e of links){const row=el('div');row.append(el('span',e.relation,'meta'));selectButton(by.get(e.object),row);d.append(row);}p.append(d);
group(p,'Underlying sources',data.records.filter(x=>x.kind==='source'),true);group(p,'Supporting observations',data.records.filter(x=>x.kind==='observation'));
const impact=el('button','Show what depends on this record');impact.onclick=()=>impactView(k).catch(error);p.append(impact);if(window.innerWidth<850)p.scrollIntoView({behavior:'smooth'});history.replaceState(null,'','#record='+encodeURIComponent(k));}
async function entryView(id='60'){const p=$('#content');p.replaceChildren();const row=el('div',undefined,'row');row.append(el('h2','Passage'));const s=el('select');s.setAttribute('aria-label','Scroll entry');for(const r of graph.records.filter(x=>x.kind==='entry')){const o=el('option',r.label+' · '+r.payload.canonical_lines);o.value=r.id;s.append(o);}s.value=id;s.onchange=()=>entryView(s.value).catch(error);row.append(s);p.append(row);
const packet=(await api('entry?id='+encodeURIComponent(id))).result;selectButton(packet.entry,p);const text=graph.records.find(x=>x.kind==='translation'&&x.id===id);if(text){for(const line of text.payload.lines)p.append(el('p',line.line+' · '+line.text));selectButton(text,p);}else p.append(el('p','Concordance indexed; formal claim extraction outside this pilot.','notice'));
const records=packet.records;group(p,'Passage readings',records.filter(x=>x.kind==='reading_set'),true);group(p,'Retained branches',records.filter(x=>x.kind==='branch'));
const hypotheses=records.filter(x=>x.kind==='hypothesis');if(!hypotheses.length)return;const hselect=el('select');hselect.setAttribute('aria-label','Candidate assignment');for(const h of hypotheses){const o=el('option',h.label);o.value=h.key;hselect.append(o);}const panel=el('div');p.append(el('h2','Candidate feature assignments'),hselect,panel);
const render=()=>{const h=by.get(hselect.value);panel.replaceChildren();selectButton(h,panel);json(panel,h.payload.assignment);panel.append(el('p','Historical coexistence: '+h.payload.coexistence_status+'. Native-plan geometry and missing datums remain as recorded.','small'));const atlas=el('a','Open existing atlas historical-state view');atlas.href=packet.spatial_view.url;atlas.target='_blank';atlas.rel='noopener';panel.append(atlas);
const evs=records.filter(r=>r.kind==='evaluation'&&r.payload.hypothesis_key===h.key);const bs=el('select');bs.setAttribute('aria-label','Test and reading branch');for(const r of evs){const o=el('option',r.payload.branch_key.replace('branch/','')+' · '+(r.payload.window_id||r.payload.ruleset||'')+' · '+r.payload.status);o.value=r.key;bs.append(o);}const result=el('div');panel.append(el('h3','Requirements under each retained branch'),bs,result);
const draw=()=>{const ev=by.get(bs.value);result.replaceChildren();if(!ev)return;selectButton(ev,result);selectButton(by.get(ev.payload.branch_key),result);if(ev.payload.reassessment?.required)result.append(el('p','Reassessment required','notice'));for(const c of ev.payload.checks){const box=el('details');box.open=true;box.append(el('summary',c.label+' · '+c.status),el('p',c.detail));if(c.value!==undefined)json(box,c.value);const v=c.value;if(v&&typeof v==='object'&&v.predicate_id)selectButton(by.get('requirement/'+v.predicate_id),box);for(const source of c.source_ids||[])selectButton(by.get('source/'+source),box);const evidence=(out.get(ev.key)||[]).filter(e=>['depends_on','supports','conflicts'].includes(e.relation));for(const e of evidence){const r=by.get(e.object);if(r&&(r.payload.relationship===c.property||r.payload.property===c.property||r.id===c.id))selectButton(r,box);}result.append(box);}};bs.onchange=draw;draw();};hselect.onchange=render;render();group(p,'Acquisition targets and conditional consequences',packet.acquisition_targets);}
async function namesView(){const p=$('#content');p.replaceChildren(el('h2','Chronological name attestations'),el('p','Order follows approximate composition dates. Object dates, periods described, written forms and place referents remain separate.','small'));const d=(await api('names')).result;for(const r of d.occurrences){const box=el('div');const a=r.payload;const date=a.composition_date?.range_ce;box.append(el('h3',(date?date.join(' to ')+' CE':'Composition date unknown')+' · '+a.original_spelling));selectButton(r,box);json(box,{composition_date:a.composition_date,object_date:a.object_date,period_described:a.period_described,findspot:a.findspot,place_mentioned:a.place_mentioned});p.append(box);}group(p,'Identity proposals; records remain separate',d.identity_proposals);group(p,'Bounded searches and their limits',d.searches,true);}
async function impactView(id='reading/e60-janoah:4'){currentView='impact';const p=$('#content');p.replaceChildren(el('h2','Change impact'),el('p','This previews dependency invalidation. It changes no reading or observation.','small'));const form=el('form'),input=el('input');input.value=id;input.setAttribute('aria-label','Changed record ID');input.style.width='100%';const b=el('button','Trace affected conclusions');form.append(input,b);p.append(form);const body=el('div');p.append(body);form.onsubmit=e=>{e.preventDefault();draw(input.value).catch(error);};async function draw(k){const d=(await api('impact?id='+encodeURIComponent(k))).result;body.replaceChildren(el('p',d.candidate_conclusions.length+' candidate conclusions require reassessment under the specified change.'));selectButton(by.get(k),body);group(body,'Affected candidate conclusions',d.candidate_conclusions.map(x=>x.record),true);group(body,'All affected records',d.affected.map(x=>x.record));const check=el('button','Check actual input changes');check.onclick=async()=>{try{json(body,await api('changes'));}catch(e){error(e);}};body.append(check);}await draw(id);}
async function queriesView(){const p=$('#content');p.replaceChildren(el('h2','Eight reusable queries'));const labels=['Disputed reading → dependent conclusions','Publications sharing an original observation','Candidate requirements under every branch','Historical coexistence and unresolved states','Names with no external match in recorded scope','Changed dating claim → reassessment','Additional distinguishing observations','Uninspected sources and pages'];labels.forEach((label,i)=>{const b=el('button',(i+1)+'. '+label,'record');b.onclick=async()=>{try{const d=(await api('query?number='+(i+1))).result;const box=$('#inspector');box.replaceChildren(el('h2',label));json(box,d);const seen=new Set();function walk(x){if(!x||typeof x!=='object')return;if(x.key&&by.has(x.key)&&!seen.has(x.key)){seen.add(x.key);selectButton(by.get(x.key),box);}for(const v of Object.values(x))walk(v);}walk(d);}catch(e){error(e);}};p.append(b);});}
async function schemaView(){const p=$('#content');p.replaceChildren(el('h2','Schema and populated evidence chain'));const img=el('img');img.src='/kb/schema.svg';img.alt='Six connected record groups and the populated Koḥlit pool chronology evidence chain';p.append(img);}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));currentView=b.dataset.view;({entry:entryView,names:namesView,impact:impactView,queries:queriesView,schema:schemaView}[currentView])().catch(error);};
(async()=>{const response=await api('graph');graph=response.result;version=response.version;by=new Map(graph.records.map(r=>[r.key,r]));out=new Map();reverse=new Map();for(const e of graph.edges){if(!out.has(e.subject))out.set(e.subject,[]);out.get(e.subject).push(e);if(!reverse.has(e.object))reverse.set(e.object,[]);reverse.get(e.object).push(e);}$('#version').textContent='Input version '+version.snapshot.slice(0,16)+' · base '+version.base_commit.slice(0,12);$('#loading').hidden=true;$('main').hidden=false;await entryView();if(location.hash.startsWith('#record='))await inspect(decodeURIComponent(location.hash.slice(8)));})().catch(e=>{$('#loading').hidden=true;error(e);});
</script></html>
